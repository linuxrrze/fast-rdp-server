# Renders the main role templates with the lab inventory + role defaults and a few
# representative overrides, into render_out. Checked by test_templates.py.
#   ansible-playbook -i localhost, tests/ansible/render.yml -e render_out=DIR
- name: Render fastrdp templates
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../../ansible/roles/common/defaults/main.yml
    - ../../ansible/inventories/lab/group_vars/all/main.yml
    - ../../ansible/roles/desktops/defaults/main.yml
    - ../../ansible/roles/xrdp/defaults/main.yml
    - ../../ansible/roles/freerdp_proxy/defaults/main.yml
    - ../../ansible/roles/web_gateway/defaults/main.yml
    - ../../ansible/roles/tuning/defaults/main.yml
    - ../../ansible/roles/identity/defaults/main.yml
    - ../../ansible/roles/base/defaults/main.yml
    - ../../ansible/roles/gpu/defaults/main.yml
  vars:
    roles_dir: "{{ playbook_dir }}/../../ansible/roles"
    render_fqdn: rdp1.lab.example.com
    render_hostname: rdp1
    fastrdp_gpu_effective: none
  tasks:
    # set_fact: play vars would lose against fastrdp_fqdn from common's defaults in vars_files
    - name: Host names (facts in a real run)
      ansible.builtin.set_fact:
        fastrdp_fqdn: "{{ render_fqdn }}"
        fastrdp_hostname: "{{ render_hostname }}"

    - name: GPU packages per stack (role gpu)
      ansible.builtin.copy:
        dest: "{{ render_out }}/gpu-packages-{{ item }}.json"
        content: "{{ {'packages': fastrdp_gpu_packages, 'virtualgl': fastrdp_virtualgl | bool} | to_json }}"
        mode: "0644"
      vars:
        fastrdp_gpu_effective: "{{ item }}"
      loop: [none, mesa, nvidia]

    - name: Derived names - TERMSRV principals (identity), front certificate SAN (base)
      ansible.builtin.copy:
        dest: "{{ render_out }}/names-{{ item.name }}.json"
        content: >-
          {{ {'spns': fastrdp_termsrv_spns, 'keytab_spns': fastrdp_termsrv_keytab_spns,
              'san': fastrdp_front_cert_san} | to_json }}
        mode: "0644"
      vars:
        fastrdp_identity_provider: "{{ item.provider }}"
        fastrdp_termsrv_aliases: "{{ item.aliases }}"
      loop:
        - {name: ad, provider: ad, aliases: []}
        - {name: ad-aliases, provider: ad, aliases: [rdp.lab.example.com, rdp1.lab.example.com, rdp]}
        - {name: ipa-aliases, provider: ipa, aliases: [rdp.lab.example.com]}
        - {name: none, provider: none, aliases: []}

    - name: Kerberized NFS homes (gssproxy impersonation for rpc.gssd)
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_nfs_krb5_homes: true
        fastrdp_nfs_gssproxy_keytab: "{{ item.keytab }}"
      loop:
        - {src: gssproxy-nfs-client.conf.j2, dest: gssproxy-nfs-client.conf, keytab: /etc/krb5.keytab}
        - {src: gssproxy-nfs-client.conf.j2, dest: gssproxy-nfs-client-own.conf, keytab: /etc/gssproxy/nfs.keytab}
        - {src: nfs-gssd.conf.j2, dest: nfs-gssd.conf, keytab: /etc/krb5.keytab}

    - name: Kerberized SMB homes (gssproxy impersonation for cifs.upcall)
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_smb_krb5_homes: true
        fastrdp_smb_gssproxy_keytab: "{{ item.keytab }}"
        fastrdp_smb_mounts: "{{ item.mounts }}"
      loop:
        - {src: gssproxy-smb-client.conf.j2, dest: gssproxy-smb-client.conf, keytab: /etc/krb5.keytab, mounts: []}
        - {src: gssproxy-smb-client.conf.j2, dest: gssproxy-smb-client-own.conf, keytab: /etc/gssproxy/smb.keytab, mounts: []}
        - {src: request-key-cifs-spnego.conf.j2, dest: request-key-cifs-spnego.conf, keytab: /etc/krb5.keytab, mounts: []}
        - {src: fstab-smb.j2, dest: fstab-smb-none, keytab: /etc/krb5.keytab, mounts: []}
        - src: fstab-smb.j2
          dest: fstab-smb
          keytab: /etc/krb5.keytab
          mounts:
            - {what: //fs1.lab.example.com/users$, where: /smb/users}
            - {what: //fs1.lab.example.com/projects/it, where: /smb/projects, options: "vers=3.1.1,seal,sec=krb5i"}

    - name: Kerberos client and sssd renewal settings per identity provider
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_identity_provider: "{{ item.provider }}"
        fastrdp_kcm_tgt_renewal: "{{ item.kcm }}"
      loop:
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ad.conf, provider: ad, kcm: true}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ipa.conf, provider: ipa, kcm: true}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-none.conf, provider: none, kcm: true}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ad-nokcm.conf, provider: ad, kcm: false}
        - {src: sssd-ad.conf.j2, dest: sssd-ad.conf, provider: ad, kcm: true}
        - {src: krb5.conf.j2, dest: krb5.conf, provider: ad, kcm: true}
        - {src: krb5-fastrdp.conf.j2, dest: krb5-fastrdp.conf, provider: ipa, kcm: true}

    - name: SSSD with fully qualified names (AD sssd.conf, FreeIPA snippet)
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_identity_provider: "{{ item.provider }}"
        fastrdp_sssd_fully_qualified_names: true
      loop:
        - {src: sssd-ad.conf.j2, dest: sssd-ad-fqn.conf, provider: ad}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ipa-fqn.conf, provider: ipa}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-none-fqn.conf, provider: none}

    - name: SSSD with local homes (override_homedir) and directory automount maps (autofs)
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_identity_provider: "{{ item.provider }}"
        fastrdp_sssd_override_homedir: "{{ item.homedir }}"
        fastrdp_autofs: "{{ item.autofs }}"
      loop:
        - {src: sssd-ad.conf.j2, dest: sssd-ad-homes.conf, provider: ad, homedir: /home/%u, autofs: sssd}
        - {src: sssd-ad.conf.j2, dest: sssd-ad-autofs-files.conf, provider: ad, homedir: "", autofs: files}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ipa-homes.conf, provider: ipa, homedir: /home/%d/%u, autofs: sssd}
        - {src: sssd-fastrdp.conf.j2, dest: sssd-fastrdp-ad-homes.conf, provider: ad, homedir: /home/%u, autofs: sssd}

    - name: FreeIPA krb5.conf restored on hosts an older role had changed (with/without sssd's include dir)
      ansible.builtin.template:
        src: "{{ roles_dir }}/identity/templates/krb5-ipa.conf.j2"
        dest: "{{ render_out }}/krb5-ipa-{{ item }}.conf"
        mode: "0644"
      vars:
        fastrdp_identity_provider: ipa
        fastrdp_ipa_sss_includedir: "{{ item == 'sss' }}"
      loop: [sss, nosss]

    - name: Keytab watcher units as the build install method copies them (identity role)
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', roles_dir ~ '/../../broker/session/systemd/' ~ item)
             | replace('/usr/sbin/', fastrdp_termsrv_sbin ~ '/') }}
        dest: "{{ render_out }}/build-{{ item }}"
        mode: "0644"
      vars:
        fastrdp_install_method: build
      loop: [fastrdp-termsrv-keytab.path, fastrdp-termsrv-keytab.service]

    - name: Helper directory per install method (identity role)
      ansible.builtin.copy:
        dest: "{{ render_out }}/termsrv-sbin-{{ item }}.txt"
        content: "{{ fastrdp_termsrv_sbin }}"
        mode: "0644"
      vars:
        fastrdp_install_method: "{{ item }}"
      loop: [apt, build]

    - name: Xrdp gfx.toml per encoder choice
      ansible.builtin.template:
        src: "{{ roles_dir }}/xrdp/templates/gfx.toml.j2"
        dest: "{{ render_out }}/gfx-{{ item.name }}.toml"
        mode: "0644"
      vars:
        fastrdp_xrdp_h264_encoder: "{{ item.encoder }}"
        fastrdp_gpu_effective: "{{ item.gpu }}"
      loop:
        - {name: vaapi, encoder: vaapi, gpu: mesa}
        - {name: nvenc, encoder: nvenc, gpu: nvidia}
        - {name: qsv, encoder: qsv, gpu: mesa}
        - {name: x264, encoder: x264, gpu: mesa}
        - {name: auto-mesa, encoder: auto, gpu: mesa}
        - {name: auto-nvidia, encoder: auto, gpu: nvidia}
        - {name: auto-none, encoder: auto, gpu: none}

    - name: Xrdp gfx.toml, other auto-detect profiles
      ansible.builtin.template:
        src: "{{ roles_dir }}/xrdp/templates/gfx.toml.j2"
        dest: "{{ render_out }}/gfx-{{ item.name }}.toml"
        mode: "0644"
      vars:
        fastrdp_xrdp_h264_encoder: "{{ item.encoder }}"
        fastrdp_gpu_effective: mesa
        fastrdp_xrdp_autodetect_profile: "{{ item.profile }}"
      loop:
        - {name: vaapi-satellite, encoder: vaapi, profile: satellite}
        - {name: x264-modem, encoder: x264, profile: modem}
        - {name: vaapi-default, encoder: vaapi, profile: default}
        - {name: vaapi-lan, encoder: vaapi, profile: lan}

    - name: Xrdp xrdp.ini, sesman.ini, xorg.conf
      ansible.builtin.template:
        src: "{{ roles_dir }}/xrdp/templates/{{ item }}.j2"
        dest: "{{ render_out }}/{{ item }}"
        mode: "0644"
      vars:
        fastrdp_xorgxrdp_glamor: true
        fastrdp_xrdp_disconnected_time_limit: 30
      loop: [xrdp.ini, sesman.ini, xorg.conf]

    - name: Audio - xrdp.ini and sesman.ini per switch (fastrdp_audio, fastrdp_audio_input)
      ansible.builtin.template:
        src: "{{ roles_dir }}/xrdp/templates/{{ item.src }}.j2"
        dest: "{{ render_out }}/audio-{{ item.name }}-{{ item.src }}"
        mode: "0644"
      vars:
        fastrdp_audio: "{{ item.audio }}"
        fastrdp_audio_input: "{{ item.input }}"
      loop:
        - {name: no-mic, src: xrdp.ini, audio: true, input: false}
        - {name: no-mic, src: sesman.ini, audio: true, input: false}
        - {name: none, src: xrdp.ini, audio: false, input: true}
        - {name: none, src: sesman.ini, audio: "False", input: "False"}

    - name: Audio - webgate.toml without the microphone, without audio, and with an own enable-audio-input
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/webgate.toml.j2"
        dest: "{{ render_out }}/audio-{{ item.name }}-webgate.toml"
        mode: "0644"
      vars:
        fastrdp_web_enabled: true
        fastrdp_audio: "{{ item.audio | default(true) }}"
        fastrdp_audio_input: "{{ item.input }}"
        fastrdp_web_rdp_parameters: "{{ item.params }}"
      loop:
        - {name: no-mic, input: false, params: {color-depth: "32"}}
        - {name: none, audio: "False", input: true, params: {}}
        - {name: own, input: false, params: {enable-audio-input: true, disable-audio: "true"}}

    - name: Proxy.ini (TLS logins, web, both off)
      ansible.builtin.template:
        src: "{{ roles_dir }}/freerdp_proxy/templates/proxy.ini.j2"
        dest: "{{ render_out }}/proxy-{{ item.name }}.ini"
        mode: "0644"
      vars:
        fastrdp_allow_tls_logins: "{{ item.tls }}"
        fastrdp_web_enabled: "{{ item.web }}"
      loop:
        - {name: lab, tls: true, web: false}
        - {name: web-only, tls: false, web: true}
        - {name: nla-only, tls: false, web: false}

    - name: Proxy.ini, TLS login sources set explicitly (fastrdp_tls_login_sources)
      ansible.builtin.template:
        src: "{{ roles_dir }}/freerdp_proxy/templates/proxy.ini.j2"
        dest: "{{ render_out }}/proxy-sources.ini"
        mode: "0644"
      vars:
        fastrdp_allow_tls_logins: true
        fastrdp_web_enabled: true
        fastrdp_tls_login_sources: [127.0.0.1, "::1", 10.1.2.0/24, "2001:db8::/32"]

    - name: Proxy.ini, Remote Credential Guard accepted (fastrdp_accept_remote_guard)
      ansible.builtin.template:
        src: "{{ roles_dir }}/freerdp_proxy/templates/proxy.ini.j2"
        dest: "{{ render_out }}/proxy-rcg.ini"
        mode: "0644"
      vars:
        fastrdp_accept_remote_guard: true

    - name: Broker.toml, lab defaults
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-lab.toml"
        mode: "0644"

    - name: Broker.toml, MFA + wlroots + group defaults
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-mfa.toml"
        mode: "0644"
      vars:
        fastrdp_realm: lab.example.com
        fastrdp_mfa_mode: otp_or_push
        fastrdp_mfa_exempt_groups: [rdp-break-glass, "domain admins"]
        fastrdp_otp_lengths: [6, 8]
        fastrdp_mfa_reconnect_grace: 600
        fastrdp_mfa_reconnect_grace_same_address: false
        fastrdp_privacyidea_ca_src: files/pi-ca.pem
        fastrdp_privacyidea_service_user: pi-service
        fastrdp_privacyidea_verify_tls: false
        fastrdp_allow_tls_logins: false
        fastrdp_web_enabled: true
        fastrdp_desktops: [xfce, plasma-x11, sway, gnome, plasma]
        fastrdp_default_desktop: sway
        fastrdp_group_desktops: {rdp-kde: plasma, "grp \"quoted\"": gnome}
        fastrdp_desktop_groups: {plasma: [rdp-kde], gnome: [rdp-gnome, "domain users"]}
        fastrdp_desktop_labels: {sway: "Sway (tiling)", xfce: "XFCE \"light\""}
        fastrdp_default_geometry: 2560x1440
        fastrdp_lan_networks: [10.0.0.0/8, "2001:db8::/32", 192.0.2.7]
        fastrdp_xrdp_autodetect_profile: broadband_high

    - name: Broker.toml, KDC-enforced MFA for NLA (FreeIPA passkey/PKINIT)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-kdc.toml"
        mode: "0644"
      vars:
        fastrdp_identity_provider: ipa
        fastrdp_mfa_mode: push
        fastrdp_mfa_nla_kdc_enforced: true

    - name: Broker.toml, MFA by web approval (with and without privacyIDEA push)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-{{ item.mode }}.toml"
        mode: "0644"
      vars:
        fastrdp_mfa_mode: "{{ item.mode }}"
        fastrdp_web_enabled: true
        fastrdp_mfa_web_approval_timeout: 75
        fastrdp_mfa_web_approval_max_auth_age: 0
        fastrdp_mfa_web_approval_single_pending: false
      loop:
        - {mode: web}
        - {mode: push_or_web}

    - name: Broker.toml, waiting screen texts (German default, own texts, URL behind a proxy)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-ui.toml"
        mode: "0644"
      vars:
        fastrdp_mfa_mode: web
        fastrdp_web_enabled: true
        fastrdp_web_public_url: https://rdp.example.org:8443
        fastrdp_ui_language: fr
        fastrdp_ui_language_from_keyboard: false
        fastrdp_ui_qr_code: false
        fastrdp_ui_texts:
          fr: {mfa_web: "Approuvez \"{user}\" sur\n{approve_url}", countdown: "Reste :"}
          de: {session_start: "Desktop {desktop} startet…", picker_title: "Desktop wählen ({count})"}
        fastrdp_proxy_waiting_screen: true
        fastrdp_desktop_picker: if_multiple
        fastrdp_desktop_picker_timeout: 20
        fastrdp_desktop_picker_when_running: skip

    - name: Proxy.ini, waiting screen and Status Info PDUs
      ansible.builtin.template:
        src: "{{ roles_dir }}/freerdp_proxy/templates/proxy.ini.j2"
        dest: "{{ render_out }}/proxy-waiting.ini"
        mode: "0644"
      vars:
        fastrdp_proxy_waiting_screen: true
        fastrdp_proxy_status_info: true

    - name: Broker.toml, MFA from KDC evidence per login (PKINIT indicator, AD key trust)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-kdc-evidence.toml"
        mode: "0644"
      vars:
        fastrdp_mfa_mode: push
        fastrdp_mfa_kdc_evidence_as_mfa: ["ind:pkinit", "sid:S-1-18-4", "sid:S-1-5-21-1-2-3-1300"]

    - name: Broker.toml, SSSD with fully qualified names (FreeIPA domain other than the realm)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-fqn.toml"
        mode: "0644"
      vars:
        fastrdp_identity_provider: ipa
        fastrdp_realm: IPA.LAB.EXAMPLE.ORG
        fastrdp_domain: Lab.Example.com
        fastrdp_sssd_fully_qualified_names: true

    - name: Broker.toml, session TGT required
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-tgt-required.toml"
        mode: "0644"
      vars:
        fastrdp_session_tgt: required

    - name: Broker.toml, session TGT per group
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-tgt-groups.toml"
        mode: "0644"
      vars:
        fastrdp_session_tgt_groups: {nfs-homes: required, kiosk: "off", "domain users@example.com": auto, "grp \"quoted\"": required}

    - name: Broker.toml, home creation roots (several, none)
      ansible.builtin.template:
        src: "{{ roles_dir }}/broker/templates/broker.toml.j2"
        dest: "{{ render_out }}/broker-homes-{{ item.name }}.toml"
        mode: "0644"
      vars:
        fastrdp_home_create_roots: "{{ item.roots }}"
      loop:
        - {name: several, roots: [/home, /srv/home]}
        - {name: none, roots: []}

    - name: Proxy.ini, broker.toml and webgate.toml with non-default ports (smoke test parser)
      ansible.builtin.template:
        src: "{{ roles_dir }}/{{ item.role }}/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_listen_port: 3399
        fastrdp_xrdp_port: 3391
      loop:
        - {role: freerdp_proxy, src: proxy.ini.j2, dest: proxy-ports.ini}
        - {role: broker, src: broker.toml.j2, dest: broker-ports.toml}
        - {role: web_gateway, src: webgate.toml.j2, dest: webgate-ports.toml}

    - name: Resource limits drop-ins (tuning role)
      ansible.builtin.template:
        src: "{{ roles_dir }}/tuning/templates/limits.conf.j2"
        dest: "{{ render_out }}/limits-{{ item.unit }}.conf"
        mode: "0644"
      vars:
        fastrdp_user_cpu_quota: "400%"
        fastrdp_user_memory_max: 16G
        fastrdp_xrdp_cpu_quota: "800%"
        limits_section: "{{ item.section }}"
        limits_comment: "{{ item.comment }}"
        limits_cpu_quota: "{{ item.cpu_quota }}"
        limits_memory_max: "{{ item.memory_max }}"
        limits_tasks_max: "{{ item.tasks_max }}"
      loop: "{{ fastrdp_limit_units }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: Webgate.toml
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/webgate.toml.j2"
        dest: "{{ render_out }}/webgate.toml"
        mode: "0644"
      vars:
        fastrdp_web_enabled: true
        fastrdp_domain: LAB.Example.com
        fastrdp_web_oidc_ca_src: files/idp-ca.pem
        fastrdp_web_rdp_parameters:
          enable-font-smoothing: "true"
          color-depth: 32
          resize-method: display-update

    - name: Webgate.toml with approval notifications (ntfy with a token, web push)
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/webgate.toml.j2"
        dest: "{{ render_out }}/webgate-notify.toml"
        mode: "0644"
      vars:
        fastrdp_web_enabled: true
        fastrdp_web_notify_backends: [ntfy, webpush]
        fastrdp_web_notify_ntfy_url: https://ntfy.lab.example.com
        fastrdp_web_notify_ntfy_token: tk_example
        fastrdp_web_notify_rate_limit: 5/3600
        fastrdp_web_notify_alert_on_deny: false
        fastrdp_web_notify_webpush_extra_hosts: [NTFY.lab.example.com]

    - name: Nginx site without and with the KDC proxy (web_gateway)
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/nginx-fastrdp-web.conf.j2"
        dest: "{{ render_out }}/nginx-{{ item.name }}.conf"
        mode: "0644"
      vars:
        fastrdp_web_enabled: true
        fastrdp_web_kdcproxy: "{{ item.kdcproxy }}"
        fastrdp_web_kdcproxy_rate_per_minute: "{{ item.rate }}"
        fastrdp_web_kdcproxy_burst: "{{ item.burst }}"
      loop:
        - {name: web, kdcproxy: false, rate: 60, burst: 20}
        - {name: web-kdcproxy, kdcproxy: true, rate: 30, burst: 10}

    # fastrdp_kdcproxy_srv: what tasks/kdcproxy.yml registers from fastrdp_kdcproxy_srv.py
    - name: Kdcproxy.conf from a KDC list, from SRV records, without kpasswd (web_gateway)
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/kdcproxy.conf.j2"
        dest: "{{ render_out }}/kdcproxy-{{ item.name }}.conf"
        mode: "0644"
      vars:
        fastrdp_web_kdcproxy: true
        fastrdp_web_kdcproxy_kdcs: "{{ item.kdcs }}"
        fastrdp_web_kdcproxy_kpasswd: "{{ item.kpasswd }}"
        fastrdp_kdcproxy_srv: {stdout: "{{ item.srv | to_json }}"}
      loop:
        - name: list
          kdcs: [dc1.lab.example.com, "dc2.lab.example.com:1088", 192.0.2.10, "dc1.lab.example.com:750"]
          kpasswd: true
          srv: {}
        - name: srv
          kdcs: []
          kpasswd: true
          srv: {kerberos: ["dc2.lab.example.com:88", "dc1.lab.example.com:88"], kpasswd: ["dc1.lab.example.com:464"]}
        - name: srv-no-kpasswd-records
          kdcs: []
          kpasswd: true
          srv: {kerberos: ["dc1.lab.example.com:88", "dc2.lab.example.com:88"], kpasswd: []}
        - name: no-kpasswd
          kdcs: [dc1.lab.example.com]
          kpasswd: false
          srv: {}
        - name: local      # kdcproxy_check.py's fake KDC
          kdcs: ["127.0.0.1:18088"]
          kpasswd: true
          srv: {}

    - name: KDC proxy gunicorn settings and units (web_gateway)
      ansible.builtin.template:
        src: "{{ roles_dir }}/web_gateway/templates/{{ item }}.j2"
        dest: "{{ render_out }}/{{ item }}"
        mode: "0644"
      loop: [kdcproxy-gunicorn.conf.py, fastrdp-kdcproxy.socket, fastrdp-kdcproxy.service]

    - name: Polkit power rule (base role) with the defaults
      ansible.builtin.template:
        src: "{{ roles_dir }}/base/templates/40-fastrdp-power.rules.j2"
        dest: "{{ render_out }}/power-default.rules"
        mode: "0644"

    - name: Polkit power rule per admin-group/console setting
      ansible.builtin.template:
        src: "{{ roles_dir }}/base/templates/40-fastrdp-power.rules.j2"
        dest: "{{ render_out }}/power-{{ item.name }}.rules"
        mode: "0644"
      vars:
        fastrdp_power_admin_groups: "{{ item.groups }}"
        fastrdp_power_allow_local_console: "{{ item.console }}"
      loop:
        - {name: groups-console, groups: [sudo, "rdp admins@example.com"], console: true}
        - {name: root-only, groups: [], console: false}

    - name: Kerberos login reminder settings (desktops role) with the defaults
      ansible.builtin.template:
        src: "{{ roles_dir }}/desktops/templates/tgt-notify.conf.j2"
        dest: "{{ render_out }}/tgt-notify-default.conf"
        mode: "0644"

    - name: Kerberos login reminder settings, own thresholds and texts
      ansible.builtin.template:
        src: "{{ roles_dir }}/desktops/templates/tgt-notify.conf.j2"
        dest: "{{ render_out }}/tgt-notify-custom.conf"
        mode: "0644"
      vars:
        fastrdp_tgt_notify: false
        fastrdp_tgt_notify_thresholds: [2d, 90m, 3600]
        fastrdp_tgt_notify_interval: 5m
        fastrdp_tgt_notify_expired: false
        fastrdp_tgt_notify_texts:
          summary: "Kerberos-Anmeldung endet in {left}"
          body: "Ab {deadline} kein Zugriff auf \"H:\\\" ({principal}).\nNeu verbinden: Ä"

    - name: Browser SSO policies (desktops role, fastrdp_browser_spnego_domains)
      ansible.builtin.template:
        src: "{{ roles_dir }}/desktops/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      vars:
        fastrdp_browser_spnego_domains: "{{ item.domains }}"
        fastrdp_firefox_policies: "{{ item.policies }}"
      loop:
        - {src: firefox-policies.json.j2, dest: firefox-policies-spnego.json, domains: [Lab.Example.com, intranet.example.org], policies: {}}
        - src: firefox-policies.json.j2
          dest: firefox-policies-merged.json
          domains: [lab.example.com]
          policies: {DisableTelemetry: true, Authentication: {Locked: false, SPNEGO: [https://other.example.net]}}
        - {src: firefox-policies.json.j2, dest: firefox-policies-extra.json, domains: [], policies: {DisableTelemetry: true}}
        - {src: chromium-spnego.json.j2, dest: chromium-spnego.json, domains: [Lab.Example.com, intranet.example.org], policies: {}}

# A new site sets only what is required: everything else must come from role
# defaults (roles/common), and the common checks must pass.
- name: Render with a minimal inventory (role defaults + realm/domain)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../../ansible/roles/common/defaults/main.yml
    - ../../ansible/roles/desktops/defaults/main.yml
    - ../../ansible/roles/xrdp/defaults/main.yml
    - ../../ansible/roles/freerdp_proxy/defaults/main.yml
    - ../../ansible/roles/web_gateway/defaults/main.yml
  vars:
    roles_dir: "{{ playbook_dir }}/../../ansible/roles"
    render_fqdn: rdp1.example.com
    render_hostname: rdp1
    fastrdp_gpu_effective: none
  tasks:
    # set_fact: play vars would lose against the defaults file in vars_files
    - name: The only settings a minimal inventory needs
      ansible.builtin.set_fact:
        fastrdp_fqdn: "{{ render_fqdn }}"
        fastrdp_hostname: "{{ render_hostname }}"
        fastrdp_realm: EXAMPLE.COM
        fastrdp_domain: example.com

    - name: Site checks pass
      ansible.builtin.include_tasks: "{{ roles_dir }}/common/tasks/main.yml"

    - name: Broker.toml, proxy.ini and gfx.toml from defaults
      ansible.builtin.template:
        src: "{{ roles_dir }}/{{ item.role }}/templates/{{ item.src }}"
        dest: "{{ render_out }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - {role: broker, src: broker.toml.j2, dest: broker-minimal.toml}
        - {role: freerdp_proxy, src: proxy.ini.j2, dest: proxy-minimal.ini}
        - {role: xrdp, src: gfx.toml.j2, dest: gfx-minimal.toml}
