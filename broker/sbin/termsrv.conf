# /etc/fastrdp/termsrv.conf - settings of fastrdp-termsrv-keytab and fastrdp-termsrv-check
# (KEY=VALUE, no shell syntax). The environment and the scripts' options override them.
# The defaults fit a host set up by the Ansible roles or docs/manual-setup.md.

# Host keytab with the TERMSRV/* keys of the machine account (AD join). The watcher
# fastrdp-termsrv-keytab.path watches /etc/krb5.keytab; for another file add a drop-in
# with PathChanged= for it.
#FASTRDP_HOST_KEYTAB=/etc/krb5.keytab

# The proxy's keytab (KRB5_KTNAME of fastrdp-proxy.service), also the default keytab
# of fastrdp-termsrv-check.
#FASTRDP_TERMSRV_KEYTAB=/etc/fastrdp/termsrv.keytab

# Group that may read the proxy's keytab (owner root, mode 0640).
#FASTRDP_TERMSRV_KEYTAB_GROUP=_fastrdp-proxy

# Also copy the machine account's own entries (<NAME>$@REALM) whose keys equal the
# TERMSRV keys (AD: one key set per account, so no new key). Windows clients start
# with Kerberos user-to-user, for which the proxy needs the machine account's TGT.
# no: TERMSRV entries only (Windows clients then fail with AD).
#FASTRDP_TERMSRV_KEYTAB_MACHINE=yes
