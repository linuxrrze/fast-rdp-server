; fastrdp default (fastrdp-session, ansible/roles/xrdp/templates/sesman.ini.j2): your changes are kept on upgrades, see fastrdp-defaults(8)
[Globals]
; The broker decides the desktop; users cannot override it with ~/startwm.sh.
EnableUserWindowManager=false
UserWindowManager=startwm.sh
DefaultWindowManager=startwm.sh
ReconnectScript=reconnectwm.sh

[Security]
AllowRootLogin=false
; Group of /run/xrdp/<uid> (mode 2750), where Xorg's and chansrv's sockets live: MUST be
; xrdp.ini's runtime_group, or xrdp (which drops to user xrdp) cannot reach the session
; ("Error connecting to X server [Permission denied]" in xrdp.log, black window).
SessionSockdirGroup=xrdp
MaxLoginRetry=1
; Group checks happen in the broker (fastrdp_allow_groups) and in SSSD.
AlwaysGroupCheck=false
RestrictOutboundClipboard=none
RestrictInboundClipboard=none

[Sessions]
X11DisplayOffset=10
MaxSessions=100
KillDisconnected=false
DisconnectedTimeLimit=0
IdleTimeLimit=0
; Default: one session per user and colour depth; reconnects resize it.
Policy=Default

[Logging]
LogFile=xrdp-sesman.log
LogLevel=INFO
EnableSyslog=true

[Xorg]
; The real server binary, not the setuid wrapper: no Xwrapper.config needed.
param=/usr/lib/xorg/Xorg
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[Chansrv]
FuseMountName=thinclient_drives
FileUmask=077

[ChansrvLogging]
LogLevel=INFO
EnableSyslog=true

[SessionVariables]
; Microphone (fastrdp_audio_input): false = /usr/libexec/fastrdp/xrdp-audio loads the
; PipeWire xrdp module sink-only (docs/audio.md). PULSE_SCRIPT of xrdp's default
; belongs to the PulseAudio module, which fastrdp does not use.
FASTRDP_AUDIO_INPUT=true
