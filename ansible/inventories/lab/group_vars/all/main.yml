---
# ---------------------------------------------------------------- identity
fastrdp_realm: LAB.EXAMPLE.COM
fastrdp_domain: lab.example.com
# ad   = Samba AD / Windows AD (realm join via adcli/sssd)
# ipa  = FreeIPA (ipa-client-install)
# none = keytab and sssd.conf provided out of band (MIT KDC + LDAP)
fastrdp_identity_provider: ad
fastrdp_join_user: Administrator
fastrdp_join_password: "{{ vault_fastrdp_join_password | default('') }}"
# Groups allowed to log in at all (empty = everyone valid in the directory).
fastrdp_allow_groups: [rdp-users]

# ---------------------------------------------------------------- front-end
fastrdp_listen_port: 3389
# PEM files on the controller; when empty a self-signed cert is generated (lab only).
fastrdp_front_cert_src: ""
fastrdp_front_key_src: ""
# Accept clients without NLA (password + OTP typed into one field).
fastrdp_allow_tls_logins: true

# Browser access via Keycloak + Guacamole (role web_gateway, docs/web-access.md)
fastrdp_web_enabled: false

# ---------------------------------------------------------------- MFA
# none | otp | push | otp_or_push   (see docs/auth-matrix.md)
fastrdp_mfa_mode: none
fastrdp_privacyidea_url: https://privacyidea.lab.example.com
fastrdp_privacyidea_realm: lab
fastrdp_privacyidea_ca_src: ""            # PEM on the controller; "" = system trust store
fastrdp_privacyidea_service_user: ""      # admin with triggerchallenge right ("" = use user password)
fastrdp_privacyidea_service_password: "{{ vault_fastrdp_privacyidea_service_password | default('') }}"
fastrdp_mfa_exempt_groups: []
fastrdp_otp_lengths: [6]

# ---------------------------------------------------------------- desktops
# X11 (xrdp): xfce mate cinnamon lxqt plasma-x11 | Wayland: gnome plasma
# wlroots (Wayland, nested in xrdp): sway labwc wayfire
fastrdp_desktops: [xfce, mate, gnome, plasma]
fastrdp_default_desktop: xfce
fastrdp_group_desktops: {}                # e.g. {rdp-kde: plasma}
fastrdp_default_geometry: 1920x1080

# ---------------------------------------------------------------- performance
# auto | nvidia | mesa | none
fastrdp_gpu: auto
fastrdp_x264_threads: 2
fastrdp_backend_port_range: [33900, 34899]
fastrdp_xrdp_port: 3390

# ---------------------------------------------------------------- hardening
# Optional: hide other users' processes (/proc hidepid). The nftables owner
# rules already stop other users from reaching back-end ports.
fastrdp_proc_hidepid: false
