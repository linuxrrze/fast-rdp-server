---
- name: GNOME + gnome-remote-desktop
  ansible.builtin.apt:
    name: "{{ fastrdp_gnome_packages }}"
    state: present
    install_recommends: false

- name: GDM provides headless sessions (gnome-headless-session@.service, GDM 50+)
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/gnome-headless-session@.service
  register: fastrdp_gdm_headless

- name: Headless session support present
  ansible.builtin.assert:
    that: fastrdp_gdm_headless.stat.exists
    fail_msg: GDM on this host lacks gnome-headless-session@.service (needs GDM 50+).

- name: Drop-in directory of the GDM headless unit
  ansible.builtin.file:
    path: /etc/systemd/system/gnome-headless-session@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fastrdp_gdm_headless_static_user | bool

# polkit (GDM's 20-gdm.rules) still requires group gdm inside the matching
# gnome-headless-session@<user>.service; root would bypass that check.
- name: GDM headless unit runs as the static gdm user (dbus-daemon drops its DynamicUser client)
  ansible.builtin.copy:
    dest: /etc/systemd/system/gnome-headless-session@.service.d/fastrdp.conf
    content: |
      # Ansible managed (fast-rdp-server): local changes are overwritten
      # Ubuntu 26.04's dbus-daemon disconnects this unit's DynamicUser client
      # ("Failed: The connection is closed"); run as the static gdm user instead.
      [Service]
      DynamicUser=no
      User=gdm
      Group=gdm
      # Implied by DynamicUser=yes, lost with DynamicUser=no:
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      # no RemoveIPC=: it would remove IPC objects of the shared gdm account
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_gdm_headless_static_user | bool
  notify: Reload systemd units (GDM headless drop-in)

- name: No fastrdp drop-in when disabled
  ansible.builtin.file:
    path: /etc/systemd/system/gnome-headless-session@.service.d/fastrdp.conf
    state: absent
  when: not fastrdp_gdm_headless_static_user | bool
  notify: Reload systemd units (GDM headless drop-in)

- name: GDM running (manages headless user displays)
  ansible.builtin.systemd_service:
    name: gdm.service
    enabled: true
    state: started

- name: System-wide g-r-d remote-login daemon stays off (the broker starts per-user headless g-r-d)
  ansible.builtin.systemd_service:
    name: gnome-remote-desktop.service
    enabled: false
    state: stopped
  failed_when: false

# Settings in /etc/dconf/db/local.d apply only when the user profile reads the "local"
# database; Ubuntu and Debian ship neither the directory nor /etc/dconf/profile/user.
- name: Dconf directories for the system database
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/dconf/profile, /etc/dconf/db/local.d]

- name: Dconf user profile (kept if the site has one)
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    force: false
    owner: root
    group: root
    mode: "0644"
  notify: Compile dconf database

- name: Dconf user profile reads the local database
  ansible.builtin.lineinfile:
    path: /etc/dconf/profile/user
    line: system-db:local
  notify: Compile dconf database

- name: Session defaults for remote GNOME (no screen lock, no idle blank)
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/50-fastrdp
    content: |
      [org/gnome/desktop/screensaver]
      lock-enabled=false
      [org/gnome/desktop/session]
      idle-delay=uint32 0
      [org/gnome/desktop/interface]
      enable-animations=false
    owner: root
    group: root
    mode: "0644"
  notify: Compile dconf database
