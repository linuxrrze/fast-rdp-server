---
fastrdp_gnome_packages:
  - gdm3
  - gnome-shell
  - gnome-session
  - gnome-remote-desktop
  - gnome-control-center
  - gnome-console
  - nautilus
  - xwayland
  - dconf-cli          # dconf update (system database below)
# Audio out (fastrdp_audio): a sink for gnome-remote-desktop, also without a sound card
fastrdp_gnome_audio_packages: [pipewire-pulse]
# GDM's gnome-headless-session@.service runs gdm-new-session with DynamicUser=yes; Ubuntu
# 26.04's dbus-daemon disconnects that client ("Failed: The connection is closed", dbus#390).
# true: a drop-in runs it as the static gdm user, with the sandboxing DynamicUser implied.
# Revisit with dbus-broker (Ubuntu 26.10).
fastrdp_gdm_headless_static_user: true
