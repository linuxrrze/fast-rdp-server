---
# Samba/Windows AD: how sssd applies GPO logon rights to the RDP PAM services
# (enforcing | permissive | disabled). Start permissive, check logs, then enforce.
fastrdp_ad_gpo_access_control: permissive
# For provider "none": keytab with TERMSRV/<fqdn> keys, on the controller.
fastrdp_termsrv_keytab_src: ""
# Encryption types of the TERMSRV keys. FreeRDP's Kerberos acceptor needs AES: RC4
# tickets fail (docs/windows-clients.md §3.4). AD: adcli writes the keytab and
# msDS-SupportedEncryptionTypes with these types (aes256 + aes128 = 0x18; adding
# arcfour-hmac allows 0x1C), narrowed to the value already on the computer account.
# FreeIPA: ipa-getkeytab -e. The role fails if the keytab has no AES key.
fastrdp_termsrv_enctypes: [aes256-cts-hmac-sha1-96, aes128-cts-hmac-sha1-96]
# Derived, normally not set: the TERMSRV principals of this host (FQDN, short name,
# fastrdp_termsrv_aliases), and those whose keys must be in /etc/fastrdp/termsrv.keytab
# (FreeIPA aliases share the FQDN principal's keys; provider "none": FQDN only).
fastrdp_termsrv_spns: >-
  {{ (['TERMSRV/' ~ fastrdp_fqdn, 'TERMSRV/' ~ (fastrdp_hostname | upper)]
      + (fastrdp_termsrv_aliases | map('regex_replace', '^', 'TERMSRV/') | list)) | unique }}
fastrdp_termsrv_keytab_spns: >-
  {{ fastrdp_termsrv_spns if fastrdp_identity_provider == 'ad' else ['TERMSRV/' ~ fastrdp_fqdn] }}
# Derived: directory of fastrdp-termsrv-check / fastrdp-termsrv-keytab (fastrdp-broker
# package: /usr/sbin; build: copies in /usr/local/sbin).
fastrdp_termsrv_sbin: "{{ '/usr/sbin' if fastrdp_install_method == 'apt' else '/usr/local/sbin' }}"
# FreeIPA krb5.conf handling (tasks/ipa_krb5.yml); other paths only for tests/ansible.
fastrdp_krb5_conf: /etc/krb5.conf
fastrdp_sss_krb5_include_dir: /var/lib/sss/pubconf/krb5.include.d

# Ticket renewal for long-running terminal-server sessions. sssd renews the TGTs it
# obtained at login (domain options); with fastrdp_kcm_tgt_renewal sssd-kcm also renews
# every renewable TGT in KCM, e.g. from `kinit` inside a session. Renewal ends at the
# ticket's renew-till (at most the KDC's limit, AD default 7 days).
fastrdp_krb5_renewable_lifetime: 7d   # requested by sssd and (krb5.conf renew_lifetime) kinit
fastrdp_krb5_renew_interval: 1h       # how often sssd / sssd-kcm look for TGTs to renew
fastrdp_kcm_tgt_renewal: true

# Home directories on NFS with sec=krb5 / krb5i / krb5p (docs/nfs-kerberos-homes.md).
# true: rpc.gssd asks gssproxy for NFS credentials, and gssproxy obtains them for
# every local user by impersonation (S4U2Self + S4U2Proxy) with the host keytab, so
# sessions without a password (Kerberos SSO, smartcard, web, GNOME, Plasma) can use
# their home. The directory must allow constrained delegation from this host to
# nfs/<server> first (AD: msDS-AllowedToDelegateTo or RBCD; FreeIPA: delegation rule).
fastrdp_nfs_krb5_homes: false
# Keytab whose FIRST entry is the impersonating principal (AD: HOST$@REALM,
# FreeIPA: host/<fqdn>@REALM). Check with: klist -k <keytab> | head
fastrdp_nfs_gssproxy_keytab: /etc/krb5.keytab

# fastrdp_autofs: sssd on FreeIPA: the automount location whose maps sssd serves
# (ipa automountlocation-find; FreeIPA's own default location is "default").
fastrdp_autofs_ipa_location: default
