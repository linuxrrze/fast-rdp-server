---
- name: Directory / Kerberos client packages
  ansible.builtin.apt:
    name: [sssd, sssd-kcm, sssd-tools, libnss-sss, libpam-sss, krb5-user, adcli, realmd, packagekit]
    state: present

- name: Kerberos client configuration
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"

- name: Join directory
  ansible.builtin.include_tasks: "{{ fastrdp_identity_provider }}.yml"

- name: TERMSRV keytab extraction script
  ansible.builtin.template:
    src: fastrdp-termsrv-keytab.sh.j2
    dest: /usr/local/sbin/fastrdp-termsrv-keytab
    owner: root
    group: root
    mode: "0755"
  when: fastrdp_identity_provider == 'ad'

- name: Re-extract TERMSRV keys whenever sssd/adcli rotates the machine password
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: fastrdp-termsrv-keytab.path
      content: |
        [Unit]
        Description=Watch the host keytab for TERMSRV key rotation
        [Path]
        PathChanged=/etc/krb5.keytab
        [Install]
        WantedBy=multi-user.target
    - name: fastrdp-termsrv-keytab.service
      content: |
        [Unit]
        Description=Copy TERMSRV keys for freerdp-proxy
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/fastrdp-termsrv-keytab
        ExecStartPost=-/usr/bin/systemctl try-restart fastrdp-proxy.service
  when: fastrdp_identity_provider == 'ad'
  register: fastrdp_keytab_units

- name: Enable keytab watcher
  ansible.builtin.systemd_service:
    name: fastrdp-termsrv-keytab.path
    enabled: true
    state: started
    daemon_reload: "{{ fastrdp_keytab_units is changed }}"
  when: fastrdp_identity_provider == 'ad'

- name: Extract TERMSRV keytab now
  ansible.builtin.command: /usr/local/sbin/fastrdp-termsrv-keytab
  changed_when: false
  when: fastrdp_identity_provider == 'ad'

- name: Keytab permissions
  ansible.builtin.file:
    path: /etc/fastrdp/termsrv.keytab
    owner: root
    group: _fastrdp-proxy
    mode: "0640"

- name: SSSD running
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true

- name: Kerberized NFS home directories
  ansible.builtin.include_tasks: nfs_krb5.yml
  when: fastrdp_nfs_krb5_homes | bool
