---
# TERMSRV/<domain> would be a principal no client asks for (clients ask for the name they
# connect to); it happened with a PTR record pointing at the bare domain.
- name: TERMSRV names are host names, never the bare domain
  ansible.builtin.assert:
    that:
      - ('TERMSRV/' ~ fastrdp_domain) | lower not in fastrdp_termsrv_spns | map('lower') | list
      - fastrdp_termsrv_spns | map('lower') | reject('match', '^termsrv/[a-z0-9-]+(\.[a-z0-9-]+)*$') | list | length == 0
    fail_msg: >-
      Refusing to register {{ fastrdp_termsrv_spns | join(', ') }}: TERMSRV/{{ fastrdp_domain }} is the
      bare domain. Check fastrdp_fqdn ({{ fastrdp_fqdn }}) and fastrdp_termsrv_aliases.
    quiet: true

- name: Directory / Kerberos client packages
  ansible.builtin.apt:
    name: [sssd, sssd-kcm, sssd-tools, libnss-sss, libpam-sss, krb5-user, adcli, realmd, packagekit]
    state: present

# fastrdp's Kerberos client settings (KCM ccache, renewable tickets) are a snippet, for
# every provider. /etc/krb5.conf belongs to the join: on FreeIPA ipa-client-install
# writes it (includedir lines, PKINIT anchors; ipa.yml keeps it), for AD and "none" the
# role writes it below. The directory must exist before ipa-client-install (which only
# then adds "includedir /etc/krb5.conf.d/") and before a krb5.conf names it (libkrb5
# fails on a missing includedir).
- name: Kerberos snippet directory
  ansible.builtin.file:
    path: /etc/krb5.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Kerberos client settings of fastrdp (snippet)
  ansible.builtin.template:
    src: krb5-fastrdp.conf.j2
    dest: /etc/krb5.conf.d/fastrdp
    owner: root
    group: root
    mode: "0644"

- name: Kerberos client configuration (AD, none; FreeIPA keeps the enrolment's)
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_identity_provider != 'ipa'

- name: TERMSRV keys must be AES (FreeRDP cannot use RC4)
  ansible.builtin.assert:
    that: fastrdp_termsrv_enctypes | select('match', '^aes(128|256)-cts-hmac-sha1-96$') | list | length > 0
    fail_msg: fastrdp_termsrv_enctypes needs aes256-cts-hmac-sha1-96 and/or aes128-cts-hmac-sha1-96.
    quiet: true

# fastrdp-termsrv-check, fastrdp-termsrv-keytab and the keytab watcher units: from the
# fastrdp-broker package (apt) or copied from this checkout (build), docs/packaging.md.
- name: TERMSRV keytab helpers from the APT repository
  when: fastrdp_install_method == 'apt'
  block:
    - name: Broker package (TERMSRV helpers; the broker role configures the daemon)
      ansible.builtin.apt:
        name: fastrdp-broker
        state: "{{ fastrdp_apt_package_state }}"

    - name: Watcher unit copy from build installs
      ansible.builtin.stat:
        path: /etc/systemd/system/fastrdp-termsrv-keytab.path
      register: fastrdp_keytab_path_copy

    # Disable it first: its enablement link points at the copy.
    - name: Watcher unit copy disabled
      ansible.builtin.systemd_service:
        name: fastrdp-termsrv-keytab.path
        enabled: false
      when: fastrdp_keytab_path_copy.stat.exists

    - name: No copies from build installs shadowing the packaged helpers and units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/fastrdp-termsrv-check
        - /usr/local/sbin/fastrdp-termsrv-keytab
        - /etc/systemd/system/fastrdp-termsrv-keytab.path
        - /etc/systemd/system/fastrdp-termsrv-keytab.service
      register: fastrdp_keytab_copies_removed

- name: TERMSRV keytab helpers from this checkout
  when: fastrdp_install_method == 'build'
  block:
    - name: TERMSRV keytab helpers (AES check, TERMSRV key extraction)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/sbin/{{ item }}"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: [fastrdp-termsrv-check, fastrdp-termsrv-keytab]

    - name: TERMSRV helper settings (all commented out; an edited file is kept)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/sbin/termsrv.conf"
        dest: /etc/fastrdp/termsrv.conf
        owner: root
        group: root
        mode: "0644"
        force: false

    # The packaged units, with the helper in /usr/local/sbin.
    - name: Units that re-extract the TERMSRV keys when sssd/adcli rotates the machine password
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../broker/session/systemd/' ~ item)
             | replace('/usr/sbin/', fastrdp_termsrv_sbin ~ '/') }}
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [fastrdp-termsrv-keytab.path, fastrdp-termsrv-keytab.service]
      register: fastrdp_keytab_units

- name: Join directory
  ansible.builtin.include_tasks: "{{ fastrdp_identity_provider }}.yml"

- name: Keytab watcher enabled (AD; FreeIPA and "none" have separate TERMSRV keys)
  ansible.builtin.systemd_service:
    name: fastrdp-termsrv-keytab.path
    enabled: true
    state: started
    daemon_reload: "{{ fastrdp_keytab_units is changed or fastrdp_keytab_copies_removed is changed }}"
  when: fastrdp_identity_provider == 'ad'

- name: Extract TERMSRV keytab now
  ansible.builtin.command: "{{ fastrdp_termsrv_sbin }}/fastrdp-termsrv-keytab"
  changed_when: false
  when: fastrdp_identity_provider == 'ad'

- name: Keytab permissions
  ansible.builtin.file:
    path: /etc/fastrdp/termsrv.keytab
    owner: root
    group: _fastrdp-proxy
    mode: "0640"

# A snippet, not sssd.conf: on FreeIPA, ipa-client-install owns sssd.conf. sssd reads
# conf.d only when sssd.conf exists (written by the join, or provided for "none").
- name: SSSD configuration snippet directory
  ansible.builtin.file:
    path: /etc/sssd/conf.d
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: SSSD ticket renewal (sssd-kcm; FreeIPA domain options)
  ansible.builtin.template:
    src: sssd-fastrdp.conf.j2
    dest: /etc/sssd/conf.d/50-fastrdp.conf
    owner: root
    group: root
    mode: "0600"
  notify: [Restart sssd, Restart sssd-kcm]

# Fails with the missing principals and a fix hint (docs/windows-clients.md §4).
- name: TERMSRV keytab has AES keys for every principal
  ansible.builtin.command:
    argv: "{{ [fastrdp_termsrv_sbin ~ '/fastrdp-termsrv-check'] + fastrdp_termsrv_keytab_spns }}"
  changed_when: false

- name: SSSD running
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true

# Now, not at the end of the play: the broker's PAM account check and the later roles need
# sssd with this configuration (GPO mapping of the fastrdp PAM services, short names).
- name: Apply the SSSD and Kerberos configuration (pending restarts)
  ansible.builtin.meta: flush_handlers

- name: Kerberized NFS home directories
  ansible.builtin.include_tasks: nfs_krb5.yml
  when: fastrdp_nfs_krb5_homes | bool
