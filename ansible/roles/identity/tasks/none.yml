---
- name: Provided TERMSRV keytab
  ansible.builtin.copy:
    src: "{{ fastrdp_termsrv_keytab_src }}"
    dest: /etc/fastrdp/termsrv.keytab
    owner: root
    group: _fastrdp-proxy
    mode: "0640"
  when: fastrdp_termsrv_keytab_src | length > 0

- name: Keytab must exist
  ansible.builtin.stat:
    path: /etc/fastrdp/termsrv.keytab
  register: fastrdp_keytab

- name: Keytab present
  ansible.builtin.assert:
    that: fastrdp_keytab.stat.exists or (ansible_check_mode and fastrdp_termsrv_keytab_src | length > 0)
    fail_msg: Provide fastrdp_termsrv_keytab_src (TERMSRV/{{ fastrdp_fqdn }}) and an sssd.conf for provider "none".

# The broker's name order ([auth] strip_realm) follows fastrdp_sssd_fully_qualified_names;
# if your sssd.conf says otherwise, local accounts may shadow directory users.
- name: Names in your SSSD configuration (read-only)
  ansible.builtin.include_tasks: sssd_names.yml
  vars:
    fastrdp_sssd_dir: /etc/sssd

# There is no join to write one, and sssd does not start without it (nor reads conf.d/).
- name: SSSD configuration present
  ansible.builtin.assert:
    that: fastrdp_sssd_conf_found | bool
    fail_msg: >-
      Provider "none" needs your /etc/sssd/sssd.conf (root:root 0600) for the directory
      before this role runs: sssd does not start without it (docs/manual-setup.md, section 3.7).
    quiet: true

- name: SSSD gives the names fastrdp_sssd_fully_qualified_names says
  ansible.builtin.assert:
    that: fastrdp_sssd_fqn_found | bool == fastrdp_sssd_fully_qualified_names | bool
    fail_msg: >-
      fastrdp_sssd_fully_qualified_names is {{ fastrdp_sssd_fully_qualified_names | bool | lower }}, but
      /etc/sssd/sssd.conf (with conf.d) gives {{ 'fully qualified (alice@domain)' if fastrdp_sssd_fqn_found | bool
      else 'short (alice)' }} names: set use_fully_qualified_names = {{ fastrdp_sssd_fully_qualified_names | bool | lower }}
      in its [domain/...] section, or change the variable (docs/auth-matrix.md#short-or-fully-qualified-account-names).
    quiet: true
