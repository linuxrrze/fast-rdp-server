---
- name: Check domain membership
  ansible.builtin.command: realm list --name-only
  register: fastrdp_realm_list
  changed_when: false

- name: Join AD domain
  ansible.builtin.command:
    cmd: >-
      realm join --membership-software=adcli --client-software=sssd
      --user={{ fastrdp_join_user }} {{ fastrdp_domain }}
    stdin: "{{ fastrdp_join_password }}"
  when: fastrdp_domain | lower not in fastrdp_realm_list.stdout | lower
  no_log: true
  changed_when: true

# TERMSRV principals (NLA). adcli writes keytab entries and msDS-SupportedEncryptionTypes
# for the permitted enctypes of its Kerberos configuration; this file, read before
# /etc/krb5.conf by the adcli runs below only, makes those fastrdp_termsrv_enctypes.
- name: Encryption types for adcli (TERMSRV keys)
  ansible.builtin.copy:
    dest: /etc/fastrdp/krb5-termsrv-enctypes.conf
    content: |
      # Ansible managed (fast-rdp-server): local changes are overwritten
      [libdefaults]
          permitted_enctypes = {{ fastrdp_termsrv_enctypes | join(' ') }}
    owner: root
    group: root
    mode: "0644"

- name: Host keytab state (TERMSRV principals with AES keys)
  ansible.builtin.command:
    argv: "{{ [fastrdp_termsrv_sbin ~ '/fastrdp-termsrv-check', '-k', '/etc/krb5.keytab'] + item }}"
  loop:
    - "{{ fastrdp_termsrv_spns[:2] }}"    # FQDN and short name: the machine may add them itself
    - "{{ fastrdp_termsrv_spns[2:] or ['TERMSRV/' ~ fastrdp_fqdn] }}"   # aliases
  register: fastrdp_termsrv_hostkeys
  changed_when: false
  failed_when: false

# Only when a principal or its AES key is missing (first run, RC4-only keys): a new
# machine password re-keys the account with AES and sets msDS-SupportedEncryptionTypes.
- name: Register TERMSRV/<fqdn> and TERMSRV/<SHORT>, re-key with AES
  ansible.builtin.command:
    cmd: >-
      adcli update --domain={{ fastrdp_domain }} --computer-password-lifetime=0
      --add-service-principal=TERMSRV/{{ fastrdp_fqdn }}
      --add-service-principal=TERMSRV/{{ fastrdp_hostname | upper }}
  environment:
    KRB5_CONFIG: /etc/fastrdp/krb5-termsrv-enctypes.conf:/etc/krb5.conf
  when: fastrdp_termsrv_hostkeys.results[0].rc != 0
  changed_when: true

# The machine account may only add SPNs of its own host names; aliases need the join
# account. adcli copies the current keys to the new principals.
- name: Register TERMSRV/<alias> (fastrdp_termsrv_aliases)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -eo pipefail
      dir=$(mktemp -d)
      trap 'kdestroy -q -c "FILE:$dir/cc" 2>/dev/null; rm -rf "$dir"' EXIT
      echo "$JOIN_PW" | kinit -c "FILE:$dir/cc" "{{ fastrdp_join_user }}@{{ fastrdp_realm }}" >/dev/null
      KRB5_CONFIG=/etc/fastrdp/krb5-termsrv-enctypes.conf:/etc/krb5.conf \
        adcli update --domain={{ fastrdp_domain }} --login-ccache="FILE:$dir/cc" \
        {% for spn in fastrdp_termsrv_spns[2:] %} --add-service-principal={{ spn }}{% endfor %}
  environment:
    JOIN_PW: "{{ fastrdp_join_password }}"
  when:
    - fastrdp_termsrv_spns[2:] | length > 0
    - fastrdp_termsrv_hostkeys.results[1].rc != 0
    - fastrdp_join_password | length > 0   # else the keytab check below names the aliases
  no_log: true
  changed_when: true

- name: SSSD configuration for terminal-server use
  ansible.builtin.template:
    src: sssd-ad.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sssd
