---
# The cache first: entries looked up under realm join's settings keep their name format
# (user@domain with use_fully_qualified_names) until they expire.
- name: Restart sssd
  ansible.builtin.shell: sss_cache -E || true; systemctl restart sssd
  changed_when: true

# KCM keeps its caches in /var/lib/sss/secrets; a restart loses no tickets.
- name: Restart sssd-kcm
  ansible.builtin.systemd_service:
    name: sssd-kcm.service
    state: restarted

# gssproxy before rpc.gssd (handlers run in this order): rpc.gssd talks to gssproxy.
- name: Restart gssproxy
  ansible.builtin.systemd_service:
    name: gssproxy
    state: restarted

- name: Restart rpc-gssd
  ansible.builtin.systemd_service:
    name: rpc-gssd
    state: restarted
