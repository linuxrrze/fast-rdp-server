---
- name: Restart sssd
  ansible.builtin.service:
    name: sssd
    state: restarted

# gssproxy before rpc.gssd (handlers run in this order): rpc.gssd talks to gssproxy.
- name: Restart gssproxy
  ansible.builtin.systemd_service:
    name: gssproxy
    state: restarted

- name: Restart rpc-gssd
  ansible.builtin.systemd_service:
    name: rpc-gssd
    state: restarted
