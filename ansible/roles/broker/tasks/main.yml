---
- name: Install from this checkout (build on the host)
  when: fastrdp_install_method == 'build'
  block:
    - name: Build dependencies for the PAM token module
      ansible.builtin.apt:
        name: [build-essential, pkgconf, libpam0g-dev, libcjson-dev, python3]
        state: present

    - name: Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [/usr/lib/fastrdp/python, /usr/libexec/fastrdp, /usr/local/src/fastrdp/pam_fastrdp_token]

    - name: Broker package
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/brokerd/fastrdp_broker"
        dest: /usr/lib/fastrdp/python/
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX
      notify: Restart fastrdp-brokerd

    - name: Admin command fastrdpctl
      ansible.builtin.copy:
        dest: /usr/local/sbin/fastrdpctl
        content: |
          #!/bin/sh
          PYTHONPATH=/usr/lib/fastrdp/python exec /usr/bin/python3 -c 'import sys; from fastrdp_broker.__main__ import ctl_main; sys.exit(ctl_main())' "$@"
        owner: root
        group: root
        mode: "0755"

    - name: PAM token module sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/pam_fastrdp_token/{{ item }}"
        dest: "/usr/local/src/fastrdp/pam_fastrdp_token/{{ item }}"
        mode: "0644"
      loop: [pam_fastrdp_token.c, Makefile]
      register: fastrdp_pam_src

    - name: Build and install pam_fastrdp_token  # noqa: no-handler - must exist before xrdp logins, not at play end
      ansible.builtin.command:
        cmd: make install
        chdir: /usr/local/src/fastrdp/pam_fastrdp_token
      when: fastrdp_pam_src is changed
      changed_when: true

    - name: Broker PAM services (fastrdp - password + account checks; fastrdp-tgt - session TGT)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/session/pam/{{ item }}"
        dest: "/etc/pam.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [fastrdp, fastrdp-tgt]

- name: Install from the APT repository
  when: fastrdp_install_method == 'apt'
  block:
    - name: Broker and PAM token module packages
      ansible.builtin.apt:
        name: [fastrdp-broker, libpam-fastrdp-token]
        state: "{{ fastrdp_apt_package_state }}"
      notify: Restart fastrdp-brokerd

    # The base role upgrades packages older than the roles; if the repository has nothing newer,
    # stop here: newer roles would write settings the installed broker rejects.
    - name: Installed broker version
      ansible.builtin.command: dpkg-query -W -f=${Version} fastrdp-broker
      register: fastrdp_broker_pkg
      changed_when: false

    - name: Installed packages are not older than these roles
      vars:
        pkg_version: "{{ fastrdp_broker_pkg.stdout | regex_replace('[~+].*$', '') }}"
      ansible.builtin.assert:
        that: pkg_version is version(fastrdp_roles_version, '>=')
        fail_msg: >-
          fastrdp-broker {{ fastrdp_broker_pkg.stdout }} is older than these roles ({{ fastrdp_roles_version }})
          even after the upgrade in the base role: the {{ fastrdp_apt_suite }} suite of
          {{ fastrdp_apt_repo_url }} has no newer version yet (release not published, or not live on
          GitHub Pages yet: the pages workflow of the repository waits up to 15 minutes for it).
          Retry later, use channel testing for a checkout of main, or check out the tag of the
          installed version (git checkout v{{ pkg_version }}).
        quiet: true

    - name: No copies from build installs shadowing the packaged unit and command
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/systemd/system/fastrdp-brokerd.service, /usr/local/sbin/fastrdpctl]
      notify: Restart fastrdp-brokerd

# The broker reads the CA once at start; its checksum in broker.toml makes a new CA
# (copied by the mfa_privacyidea role) a config change, which restarts the broker.
- name: Checksum of the privacyIDEA CA
  ansible.builtin.stat:
    path: /etc/fastrdp/privacyidea-ca.pem
    checksum_algorithm: sha256
    get_mime: false
  register: fastrdp_broker_pi_ca
  when: fastrdp_privacyidea_ca_src | length > 0

# mode code_or_web: the Keycloak client the broker checks codes with (secret read per
# check, so a new secret needs no restart; the CA is read at start, as privacyIDEA's).
- name: Keycloak client secret for code checks
  ansible.builtin.copy:
    dest: /etc/fastrdp/keycloak-otp.secret
    content: "{{ fastrdp_mfa_keycloak_client_secret }}\n"
    owner: root
    group: root
    mode: "0600"
  when: fastrdp_mfa_mode == 'code_or_web'
  no_log: true

- name: CA certificate of Keycloak for code checks
  ansible.builtin.copy:
    src: "{{ fastrdp_mfa_keycloak_ca_src }}"
    dest: /etc/fastrdp/keycloak-otp-ca.pem
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_mfa_mode == 'code_or_web' and fastrdp_mfa_keycloak_ca_src | length > 0

- name: Checksum of Keycloak's CA for code checks
  ansible.builtin.stat:
    path: /etc/fastrdp/keycloak-otp-ca.pem
    checksum_algorithm: sha256
    get_mime: false
  register: fastrdp_broker_kc_ca
  when: fastrdp_mfa_mode == 'code_or_web' and fastrdp_mfa_keycloak_ca_src | length > 0

- name: No Keycloak code-check secret without code_or_web
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/fastrdp/keycloak-otp.secret, /etc/fastrdp/keycloak-otp-ca.pem]
  when: fastrdp_mfa_mode != 'code_or_web'

# validate: a config the broker rejects never replaces the working one (with force_handlers
# the restart would otherwise run and stop the broker).
- name: Broker configuration
  ansible.builtin.template:
    src: broker.toml.j2
    dest: /etc/fastrdp/broker.toml
    owner: root
    group: root
    mode: "0600"
    validate: env PYTHONPATH=/usr/lib/fastrdp/python /usr/bin/python3 -m fastrdp_broker --check --config %s
  notify: Restart fastrdp-brokerd

- name: Broker unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/session/systemd/fastrdp-brokerd.service"
    dest: /etc/systemd/system/fastrdp-brokerd.service
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_install_method == 'build'
  notify: Restart fastrdp-brokerd

- name: Broker running
  ansible.builtin.systemd_service:
    name: fastrdp-brokerd.service
    enabled: true
    state: started
    daemon_reload: true
