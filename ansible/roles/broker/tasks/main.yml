---
- name: Install from this checkout (build on the host)
  when: fastrdp_install_method == 'build'
  block:
    - name: Build dependencies for the PAM token module
      ansible.builtin.apt:
        name: [build-essential, pkgconf, libpam0g-dev, libcjson-dev, python3]
        state: present

    - name: Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [/usr/lib/fastrdp/python, /usr/libexec/fastrdp, /usr/local/src/fastrdp/pam_fastrdp_token]

    - name: Broker package
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/brokerd/fastrdp_broker"
        dest: /usr/lib/fastrdp/python/
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX
      notify: Restart fastrdp-brokerd

    - name: Admin command fastrdpctl
      ansible.builtin.copy:
        dest: /usr/local/sbin/fastrdpctl
        content: |
          #!/bin/sh
          PYTHONPATH=/usr/lib/fastrdp/python exec /usr/bin/python3 -c 'import sys; from fastrdp_broker.__main__ import ctl_main; sys.exit(ctl_main())' "$@"
        owner: root
        group: root
        mode: "0755"

    - name: PAM token module sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/pam_fastrdp_token/{{ item }}"
        dest: "/usr/local/src/fastrdp/pam_fastrdp_token/{{ item }}"
        mode: "0644"
      loop: [pam_fastrdp_token.c, Makefile]
      register: fastrdp_pam_src

    - name: Build and install pam_fastrdp_token  # noqa: no-handler - must exist before xrdp logins, not at play end
      ansible.builtin.command:
        cmd: make install
        chdir: /usr/local/src/fastrdp/pam_fastrdp_token
      when: fastrdp_pam_src is changed
      changed_when: true

    - name: Broker PAM services (fastrdp - password + account checks; fastrdp-tgt - session TGT)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../broker/session/pam/{{ item }}"
        dest: "/etc/pam.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [fastrdp, fastrdp-tgt]

- name: Install from the APT repository
  when: fastrdp_install_method == 'apt'
  block:
    - name: Broker and PAM token module packages
      ansible.builtin.apt:
        name: [fastrdp-broker, libpam-fastrdp-token]
        state: "{{ fastrdp_apt_package_state }}"
      notify: Restart fastrdp-brokerd

    # The roles come from the checkout, the packages from the APT channel: roles newer than
    # the installed broker write settings it rejects (e.g. a stable package and roles from main).
    - name: Installed broker version
      ansible.builtin.command: dpkg-query -W -f=${Version} fastrdp-broker
      register: fastrdp_broker_pkg
      changed_when: false

    - name: Installed packages are not older than these roles
      vars:
        roles_version: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../debian/changelog').splitlines()[0]
             | regex_replace('^[^(]*[(]([0-9.]+).*$', '\1') }}
        pkg_version: "{{ fastrdp_broker_pkg.stdout | regex_replace('[~+].*$', '') }}"
      ansible.builtin.assert:
        that: pkg_version is version(roles_version, '>=')
        fail_msg: >-
          fastrdp-broker {{ fastrdp_broker_pkg.stdout }} is older than these roles ({{ roles_version }}),
          which may write settings it does not know. Install the matching packages
          (fastrdp_apt_package_state: latest after the release is published, or channel testing for main),
          or check out the tag of the installed version (git checkout v{{ pkg_version }}).
        quiet: true

    - name: No copies from build installs shadowing the packaged unit and command
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/systemd/system/fastrdp-brokerd.service, /usr/local/sbin/fastrdpctl]
      notify: Restart fastrdp-brokerd

# validate: a config the broker rejects never replaces the working one (with force_handlers
# the restart would otherwise run and stop the broker).
- name: Broker configuration
  ansible.builtin.template:
    src: broker.toml.j2
    dest: /etc/fastrdp/broker.toml
    owner: root
    group: root
    mode: "0600"
    validate: env PYTHONPATH=/usr/lib/fastrdp/python /usr/bin/python3 -m fastrdp_broker --check --config %s
  notify: Restart fastrdp-brokerd

- name: Broker unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/session/systemd/fastrdp-brokerd.service"
    dest: /etc/systemd/system/fastrdp-brokerd.service
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_install_method == 'build'
  notify: Restart fastrdp-brokerd

- name: Broker running
  ansible.builtin.systemd_service:
    name: fastrdp-brokerd.service
    enabled: true
    state: started
    daemon_reload: true
