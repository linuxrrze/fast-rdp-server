---
# Site-wide settings shared by several roles. Every role that uses them depends on
# this role (meta/main.yml), so an inventory only has to set what differs. The
# values marked REQUIRED have no usable default; tasks/main.yml checks them first.

# ---------------------------------------------------------------- identity
fastrdp_realm: ""                    # REQUIRED: Kerberos realm, e.g. EXAMPLE.COM
fastrdp_domain: ""                   # REQUIRED: DNS domain, e.g. example.com
fastrdp_identity_provider: ad        # ad (Samba AD / Active Directory) | ipa (FreeIPA) | none (keytab provided)
fastrdp_join_user: Administrator     # account used for the domain join
fastrdp_join_password: "{{ vault_fastrdp_join_password | default('') }}"    # secret: vault.yml
# Who may log in: members of these groups; [] = every user who can authenticate.
fastrdp_allow_groups: []
# Kerberos TGT for GNOME/Plasma sessions (broker [broker] session_tgt; xrdp sessions get
# one through their own PAM stack): auto = when the login carries the password (NLA
# with delegated password, TLS), failures only logged; required = also refuse logins
# without a password (Kerberos SSO without delegation, smartcard, web), e.g. for
# Kerberized NFS homes without gssproxy impersonation; off. docs/nfs-kerberos-homes.md
fastrdp_session_tgt: auto

# Other DNS names clients type for THIS host (DNS aliases), e.g. [rdp.example.com].
# Each gets a TERMSRV/<alias> Kerberos principal (identity role; registering it needs
# the join account) and goes into the self-signed front certificate (base role).
# An alias belongs to one host: farms behind a shared name need a service account and
# a distributed keytab instead (docs/windows-clients.md §3.2).
fastrdp_termsrv_aliases: []

# ---------------------------------------------------------------- front end
fastrdp_listen_port: 3389
fastrdp_front_cert_src: ""           # PEM on the controller; "" = self-signed (lab only)
fastrdp_front_key_src: ""
# Allow password logins over TLS (clients without NLA, the web path); false = NLA only.
fastrdp_allow_tls_logins: true
# Peers that may log in over TLS (non-NLA) at all: proxy.ini [FastRDP] AllowTlsFrom,
# addresses/CIDRs, [] = any. Default: loopback only when TLS is there just for the web
# path (guacd connects from 127.0.0.1), else any (TLS logins on, or no TLS at all).
# docs/backends/web.md
fastrdp_tls_login_sources: >-
  {{ ['127.0.0.1', '::1'] if (fastrdp_web_enabled | bool and not fastrdp_allow_tls_logins | bool) else [] }}

# ---------------------------------------------------------------- MFA
fastrdp_mfa_mode: none               # none | otp | push | otp_or_push (docs/auth-matrix.md)
fastrdp_privacyidea_url: ""          # REQUIRED when fastrdp_mfa_mode != none
fastrdp_privacyidea_realm: ""
fastrdp_privacyidea_ca_src: ""       # PEM on the controller; "" = system trust store
fastrdp_privacyidea_service_user: "" # admin with triggerchallenge right ("" = use user password)
fastrdp_privacyidea_service_password: "{{ vault_fastrdp_privacyidea_service_password | default('') }}"  # vault.yml
fastrdp_mfa_exempt_groups: []
fastrdp_otp_lengths: [6]
# KDC-enforced strong authentication for NLA (broker [mfa] nla_kdc_enforced; docs/passkeys.md):
# Kerberos NLA logins skip privacyIDEA because the KDC issues TERMSRV/<host> tickets only
# to TGTs with one of fastrdp_mfa_nla_kdc_auth_indicators (passkey or smartcard
# pre-authentication). FreeIPA: the identity role sets them on the TERMSRV service
# (ipa service-mod --auth-ind, needs the join account) and checks them at every run;
# password-only TGTs can then no longer use NLA (TLS + OTP/push still works). TLS and web
# logins keep their MFA. AD has no authentication indicators: refused there unless
# fastrdp_mfa_nla_kdc_enforced_by_ad_policy says an AD policy guarantees it (see the doc).
fastrdp_mfa_nla_kdc_enforced: false
fastrdp_mfa_nla_kdc_auth_indicators: [passkey, pkinit]   # FreeIPA; also otp, radius, idp; never hardened
fastrdp_mfa_nla_kdc_set_auth_ind: true                    # FreeIPA: let the identity role set them
fastrdp_mfa_nla_kdc_enforced_by_ad_policy: false          # AD: you guarantee it by policy (no check possible)
# MFA grace for reconnects (broker [mfa] reconnect_grace; docs/auth-matrix.md#reconnect-grace):
# seconds after a passed OTP/push during which reconnects of the same account, login
# method (NLA/TLS), Kerberos principal and, with ..._same_address, client address skip
# the second factor (the RDP proxy has no auto-reconnect cookies, so every network drop
# is a new login). Counted from the real second factor, never extended; 0 = off, at most
# 3600; 300-900 recommended. Broker memory only (a restart clears it);
# `fastrdpctl clear-grace USER` forgets a user's grace.
fastrdp_mfa_reconnect_grace: 0
fastrdp_mfa_reconnect_grace_same_address: true

# ---------------------------------------------------------------- web access
# Browser path (Keycloak + Guacamole, role web_gateway). Read by the broker and proxy
# templates too, so it lives here; the web_gateway role holds the other web settings.
fastrdp_web_enabled: false

# ---------------------------------------------------------------- desktops
fastrdp_desktops: [xfce]             # xfce mate cinnamon lxqt budgie i3 sway labwc wayfire gnome plasma
fastrdp_default_desktop: xfce        # must be one of fastrdp_desktops
fastrdp_group_desktops: {}           # default desktop per group, e.g. {rdp-kde: plasma}
# Restrict desktops to groups, e.g. {plasma: [rdp-kde]}; desktops not listed are open
# to every allowed user.
fastrdp_desktop_groups: {}
fastrdp_desktop_labels: {}           # display names, e.g. {xfce: "XFCE (light)"}
fastrdp_default_geometry: 1920x1080

# ---------------------------------------------------------------- performance
fastrdp_gpu: auto                    # auto | nvidia | mesa | none
fastrdp_x264_threads: 2
fastrdp_backend_port_range: [33900, 34899]
fastrdp_xrdp_port: 3390
# H.264 profile for xrdp sessions (gfx.toml [x264.<type>]/[ffmpeg.<type>]) by the client's
# connection type. mstsc asks for auto-detection by default, which the proxy does not do;
# such clients get fastrdp_xrdp_autodetect_profile, or lan if their address is in
# fastrdp_lan_networks. A type the client chose itself (.rdp "connection type:i:N",
# FreeRDP /network:) is kept. Read by the broker and xrdp roles. docs/performance.md
fastrdp_xrdp_autodetect_profile: wan   # lan wan broadband_high satellite broadband_low modem default
fastrdp_lan_networks: []               # client CIDRs, e.g. [10.0.0.0/8, "2001:db8::/32"]

# ---------------------------------------------------------------- hardening
# Hide other users' processes (/proc hidepid). The nftables owner rules already stop
# other users from reaching back-end ports.
fastrdp_proc_hidepid: false
