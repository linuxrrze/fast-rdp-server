---
# Site-wide settings shared by several roles. Every role that uses them depends on
# this role (meta/main.yml), so an inventory only has to set what differs. The
# values marked REQUIRED have no usable default; tasks/main.yml checks them first.

# ---------------------------------------------------------------- identity
fastrdp_realm: ""                    # REQUIRED: Kerberos realm, e.g. EXAMPLE.COM
fastrdp_domain: ""                   # REQUIRED: DNS domain, e.g. example.com
# The name clients connect to (TERMSRV/<fqdn>, certificate, nginx): the inventory name when
# it is a DNS name with a dot (fastrdp-setup writes the FQDN there), else the fqdn fact.
# Not the fact first: it comes from a reverse lookup, and a wrong PTR record or /etc/hosts
# line silently gives e.g. the bare domain.
fastrdp_fqdn: >-
  {{ (inventory_hostname if inventory_hostname is match('^(?=.*[A-Za-z])[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$')
      else ansible_facts.fqdn) | lower }}
fastrdp_hostname: "{{ ansible_facts.hostname }}"
fastrdp_identity_provider: ad        # ad (Samba AD / Active Directory) | ipa (FreeIPA) | none (keytab provided)
fastrdp_join_user: Administrator     # account used for the domain join
fastrdp_join_password: "{{ vault_fastrdp_join_password | default('') }}"    # secret: vault.yml
# Who may log in: members of these groups; [] = every user who can authenticate.
fastrdp_allow_groups: []
# Directory accounts as "alice@<fastrdp_domain>" (SSSD use_fully_qualified_names; broker
# [auth] strip_realm = false) instead of "alice": a local account with the same name
# can then never stand in for a directory user. Users, sudoers, ACLs and tools see the
# long names; homes stay /home/<short name>. docs/auth-matrix.md#short-or-fully-qualified-account-names
# AD: sssd.conf, FreeIPA: /etc/sssd/conf.d/50-fastrdp.conf; provider "none": your
# sssd.conf must say the same (the identity role checks it).
fastrdp_sssd_fully_qualified_names: false
# Kerberos TGT for GNOME/Plasma sessions (broker [broker] session_tgt; xrdp sessions get
# one through their own PAM stack): auto = when the login carries the password (NLA
# with delegated password, TLS), failures only logged; required = also refuse logins
# without a password (Kerberos SSO without delegation, smartcard, web), e.g. for
# Kerberized NFS homes without gssproxy impersonation; off. docs/nfs-kerberos-homes.md
fastrdp_session_tgt: auto
# fastrdp_session_tgt per group (broker [broker.session_tgt_groups]): {group: mode}, e.g.
# {nfs-homes: required, kiosk: "off"} (quote "off": YAML reads a bare off as false).
# Members of listed groups get the strictest mode of their groups (required > auto >
# off), everybody else fastrdp_session_tgt. Group names as in fastrdp_allow_groups.
fastrdp_session_tgt_groups: {}
# Kerberos login reminder (desktops role: /usr/libexec/fastrdp/tgt-notify, XDG autostart
# in every desktop session, /etc/fastrdp/tgt-notify.conf). sssd renews a session's TGT
# only until its renew-until time (fastrdp_krb5_renewable_lifetime after the last login
# with a password, AD default 7 days); then the session loses Kerberized NFS/SMB homes
# and shares until the user reconnects with the password or runs kinit. The reminder
# warns once per threshold before that and once when the TGT has expired. Sessions
# without a TGT (SSO without password) see nothing. Not needed with gssproxy
# impersonation for every Kerberized mount. docs/nfs-kerberos-homes.md#long-running-sessions
fastrdp_tgt_notify: true
fastrdp_tgt_notify_thresholds: [24h, 2h]   # before renew-until; units s m h d; [] = only when expired
fastrdp_tgt_notify_interval: 10m           # how often each session checks (at least 1m)
fastrdp_tgt_notify_expired: true           # also once when the TGT has expired
# Own texts, e.g. translated: {summary, body, expired_summary, expired_body}, each
# optional, with the placeholders {left}, {deadline} (local time) and {principal}.
# {} = the built-in English texts (reconnect with the password, or kinit).
fastrdp_tgt_notify_texts: {}

# Other DNS names clients type for THIS host (DNS aliases), e.g. [rdp.example.com].
# Each gets a TERMSRV/<alias> Kerberos principal (identity role; registering it needs
# the join account) and goes into the self-signed front certificate (base role).
# An alias belongs to one host: farms behind a shared name need a service account and
# a distributed keytab instead (docs/windows-clients.md §3.2).
fastrdp_termsrv_aliases: []

# ---------------------------------------------------------------- front end
fastrdp_listen_port: 3389
fastrdp_front_cert_src: ""           # PEM on the controller; "" = self-signed (lab only)
fastrdp_front_key_src: ""
# Allow password logins over TLS (clients without NLA, the web path); false = NLA only.
fastrdp_allow_tls_logins: true
# Peers that may log in over TLS (non-NLA) at all: proxy.ini [FastRDP] AllowTlsFrom,
# addresses/CIDRs, [] = any. Default: loopback only when TLS is there just for the web
# path (guacd connects from 127.0.0.1), else any (TLS logins on, or no TLS at all).
# docs/backends/web.md
fastrdp_tls_login_sources: >-
  {{ ['127.0.0.1', '::1'] if (fastrdp_web_enabled | bool and not fastrdp_allow_tls_logins | bool) else [] }}
# Remote Credential Guard (mstsc /remoteGuard, policy "Require Remote Credential Guard"):
# proxy.ini [FastRDP] AcceptRemoteGuard. false: not offered; such a client gets a negotiation
# response without support and shows its own error. true: accepted identity only, the
# forwarded Kerberos tickets are discarded, so the session has no TGT (like Restricted
# Admin; fastrdp_session_tgt: required refuses these logins). docs/windows-clients.md §3.11
fastrdp_accept_remote_guard: false

# ---------------------------------------------------------------- MFA
fastrdp_mfa_mode: none               # none | otp | push | otp_or_push | web | push_or_web (docs/auth-matrix.md)
fastrdp_privacyidea_url: ""          # REQUIRED for otp, push, otp_or_push, push_or_web
fastrdp_privacyidea_realm: ""
fastrdp_privacyidea_ca_src: ""       # PEM on the controller; "" = system trust store
fastrdp_privacyidea_service_user: "" # admin with triggerchallenge right ("" = use user password)
fastrdp_privacyidea_service_password: "{{ vault_fastrdp_privacyidea_service_password | default('') }}"  # vault.yml
fastrdp_mfa_exempt_groups: []
fastrdp_otp_lengths: [6]
# KDC-enforced strong authentication for NLA (broker [mfa] nla_kdc_enforced; docs/passkeys.md):
# Kerberos NLA logins skip privacyIDEA because the KDC issues TERMSRV/<host> tickets only
# to TGTs with one of fastrdp_mfa_nla_kdc_auth_indicators (passkey or smartcard
# pre-authentication). FreeIPA: the identity role sets them on the TERMSRV service
# (ipa service-mod --auth-ind, needs the join account) and checks them at every run;
# password-only TGTs can then no longer use NLA (TLS + OTP/push still works). TLS and web
# logins keep their MFA. AD has no authentication indicators: refused there unless
# fastrdp_mfa_nla_kdc_enforced_by_ad_policy says an AD policy guarantees it (see the doc).
fastrdp_mfa_nla_kdc_enforced: false
fastrdp_mfa_nla_kdc_auth_indicators: [passkey, pkinit]   # FreeIPA; also otp, radius, idp; never hardened
fastrdp_mfa_nla_kdc_set_auth_ind: true                    # FreeIPA: let the identity role set them
fastrdp_mfa_nla_kdc_enforced_by_ad_policy: false          # AD: you guarantee it by policy (no check possible)
# Per login instead (broker [mfa] kdc_evidence_as_mfa; docs/passkeys.md#kdc-evidence-per-login):
# a Kerberos NLA login whose ticket carries one of these skips privacyIDEA; logins without
# one keep their second factor, nothing changes for the client. The proxy's FreeRDP reads
# them from the ticket and checks the KDC's signature (fastrdp-freerdp3 >= 3.32.2-4).
#   "ind:<indicator>"  FreeIPA/MIT authentication indicator: ind:pkinit, ind:passkey, ind:otp
#   "sid:<SID>"        group SID from the AD PAC: sid:S-1-18-4 (Windows Hello for Business key
#                      trust), sid:S-1-18-3 (PKINIT with freshness), an Authentication
#                      Mechanism Assurance group (sid:S-1-5-21-...-<RID>)
# Refused: ind:hardened, sid:S-1-18-1, sid:S-1-18-2, Domain Users (password logons have them).
fastrdp_mfa_kdc_evidence_as_mfa: []
# MFA grace for reconnects (broker [mfa] reconnect_grace; docs/auth-matrix.md#reconnect-grace):
# seconds after a passed OTP/push during which reconnects of the same account, login
# method (NLA/TLS), Kerberos principal and, with ..._same_address, client address skip
# the second factor (the RDP proxy has no auto-reconnect cookies, so every network drop
# is a new login). Counted from the real second factor, never extended; 0 = off, at most
# 3600; 300-900 recommended. Broker memory only (a restart clears it);
# `fastrdpctl clear-grace USER` forgets a user's grace.
fastrdp_mfa_reconnect_grace: 0
fastrdp_mfa_reconnect_grace_same_address: true
# Web approval (fastrdp_mfa_mode web or push_or_web; needs fastrdp_web_enabled;
# docs/auth-matrix.md#web-approval): the RDP login waits until the user approves it on
# https://<fqdn>/web/approve after a fresh MFA sign-in at Keycloak (passkey, TOTP, ...).
# Seconds to wait, 10..510; fastrdp_proxy_broker_timeout must be at least this plus 90
# (the broker's session_start_timeout, for the session start after the approval):
fastrdp_mfa_web_approval_timeout: 90
# The approving sign-in may be at most this many seconds older than the login (0..300):
fastrdp_mfa_web_approval_max_auth_age: 30
# Two or more pending logins of a user: none can be approved (somebody with the password
# may have started one alongside the user's own); the user denies them and retries.
fastrdp_mfa_web_approval_single_pending: true

# Seconds the proxy waits for the broker (proxy.ini [FastRDP] Timeout, at most 600): an
# MFA push (privacyIDEA push_timeout 60) or web approval (fastrdp_mfa_web_approval_timeout
# 90) plus the session start (broker session_start_timeout 90; slow GNOME/Plasma starts).
# With web approval at least fastrdp_mfa_web_approval_timeout + 90 (checked). Here, not in
# role freerdp_proxy: the common checks compare them.
fastrdp_proxy_broker_timeout: 180

# ---------------------------------------------------------------- web access
# Browser path (Keycloak + Guacamole, role web_gateway). Read by the broker and proxy
# templates too, so it lives here; the web_gateway role holds the other web settings.
fastrdp_web_enabled: false
# The web gateway's URL as users reach it (webgate [webgate] public_url; the approval
# page <url>/web/approve is named on the proxy's waiting screen).
fastrdp_web_public_url: "https://{{ fastrdp_fqdn }}"

# ---------------------------------------------------------------- waiting screen
# What the RDP client shows while a login waits for its push or web approval and while
# the session starts (proxy.ini [FastRDP] WaitingScreen; docs/auth-matrix.md#waiting-screen):
# a panel with what to do, a countdown and, with web approval, the approval page's URL
# and a QR code of it for a phone. false (default until tested with mstsc/Windows App/
# Remmina in the lab): the client shows its own "connecting" state as before.
fastrdp_proxy_waiting_screen: false
# Server Status Info PDUs as well (proxy.ini [FastRDP] StatusInfo), for clients that ask
# for them (FreeRDP clients never do; what mstsc shows is untested).
fastrdp_proxy_status_info: false
# The panel's texts (broker [ui]): language en or de (built in) or one of fastrdp_ui_texts;
# the client's keyboard layout picks the language when there are texts for it.
fastrdp_ui_language: en
fastrdp_ui_language_from_keyboard: true
# Own texts: {language: {key: text}}, keys mfa_push, mfa_web, mfa_push_or_web, qr_hint,
# session_start, countdown; placeholders {user} {approve_url} {timeout} {method} {desktop}
# {code} (the web approval's two-digit code).
fastrdp_ui_texts: {}
# The approval page on the panel ("" = not named, no QR code) and its QR code.
fastrdp_ui_approve_url: "{{ (fastrdp_web_public_url ~ '/web/approve') if fastrdp_web_enabled | bool else '' }}"
fastrdp_ui_qr_code: true

# ---------------------------------------------------------------- desktops
fastrdp_desktops: [xfce]             # xfce mate cinnamon lxqt budgie i3 sway labwc wayfire gnome plasma
fastrdp_default_desktop: xfce        # must be one of fastrdp_desktops
fastrdp_group_desktops: {}           # default desktop per group, e.g. {rdp-kde: plasma}
# Restrict desktops to groups, e.g. {plasma: [rdp-kde]}; desktops not listed are open
# to every allowed user.
fastrdp_desktop_groups: {}
fastrdp_desktop_labels: {}           # display names, e.g. {xfce: "XFCE (light)"}
fastrdp_default_geometry: 1920x1080

# ---------------------------------------------------------------- home directories
# Where users' homes are (docs/nfs-kerberos-homes.md#where-homes-are). "" = the directory's
# (AD unixHomeDirectory, FreeIPA homeDirectory; AD accounts without one: /home/<user>).
# A path like /home/%u makes sssd report local homes instead (sssd.conf override_homedir;
# expansions %u %U %d %f %l %P %o %h %H %%), e.g. when the directory names /autofs/...
# paths that do not exist on this host. AD and FreeIPA; provider none: set it in your
# sssd.conf. The broker creates a missing home (mode 0700, /etc/skel) only when its
# parent directory exists: create /home/%d yourself for a path like /home/%d/%u.
fastrdp_sssd_override_homedir: ""
# Where the broker may create a missing home (broker [broker] home_create_roots): only
# when the home's parent directory is one of these or below one, also with symlinks
# resolved, on local disk and root-owned. Roots and other missing parents are never
# created. [] = never create homes (they are provisioned elsewhere; still checked).
fastrdp_home_create_roots: [/home]
# Automounted homes (autofs): none = left to the host (default); sssd = automount maps
# from the directory (AD/FreeIPA LDAP maps through sssd: installs autofs, adds sssd's
# autofs service, nsswitch "automount: files sss"); files = installs and enables autofs,
# the maps are yours (/etc/auto.master.d/*.autofs).
fastrdp_autofs: none

# ---------------------------------------------------------------- performance
fastrdp_gpu: auto                    # auto | nvidia | mesa | none
fastrdp_x264_threads: 2
fastrdp_backend_port_range: [33900, 34899]
fastrdp_xrdp_port: 3390
# H.264 profile for xrdp sessions (gfx.toml [x264.<type>]/[ffmpeg.<type>]) by the client's
# connection type. mstsc asks for auto-detection by default, which the proxy does not do;
# such clients get fastrdp_xrdp_autodetect_profile, or lan if their address is in
# fastrdp_lan_networks. A type the client chose itself (.rdp "connection type:i:N",
# FreeRDP /network:) is kept. Read by the broker and xrdp roles. docs/performance.md
fastrdp_xrdp_autodetect_profile: wan   # lan wan broadband_high satellite broadband_low modem default
fastrdp_lan_networks: []               # client CIDRs, e.g. [10.0.0.0/8, "2001:db8::/32"]

# ---------------------------------------------------------------- audio
# Sound and microphone in sessions (docs/audio.md, backlog A1). Clients decide whether
# they want either (mstsc "Play on this computer" / "Record from this computer", FreeRDP
# /sound /microphone); these switches decide what the host offers.
# xrdp desktops (X11 and wlroots): PipeWire with pipewire-module-xrdp (xrdp role) and
# xrdp.ini rdpsnd; GNOME: pipewire-pulse, a sink for gnome-remote-desktop to capture
# (gnome_rd role). Plasma (KRdp) has no audio. false = no audio packages, rdpsnd off.
fastrdp_audio: true
# Applications in xrdp sessions may record from the client's microphone (xrdp-source)
# when the client offers it; false = the PipeWire xrdp module is loaded sink-only, and
# the web path does not offer the microphone (Guacamole enable-audio-input). A default,
# not a policy: users can load the module themselves, and GNOME (gnome-remote-desktop)
# has no switch. The proxy passes AUDIO_INPUT either way (docs/audio.md#privacy-and-policy).
fastrdp_audio_input: true

# ---------------------------------------------------------------- hardening
# Hide other users' processes (/proc hidepid). The nftables owner rules already stop
# other users from reaching back-end ports.
fastrdp_proc_hidepid: false
# Users in RDP sessions must not power off, reboot, suspend, hibernate or halt the shared
# host (base role: polkit rule /etc/polkit-1/rules.d/40-fastrdp-power.rules for logind's
# power actions, their -multiple-sessions/-ignore-inhibit variants and set-reboot-*).
# Without it every user in an RDP session sees the menu entries, and the password of an
# admin (polkit: group sudo) is all it takes. Desktops hide or grey out the entries
# (logind answers "no"); log out, lock and inhibitors are unaffected. root (sudo
# systemctl poweroff) is never affected. false = no rule (upstream polkit defaults).
# docs/desktop-matrix.md#host-safety-power-actions
fastrdp_block_power_actions: true
# Members may still use these actions after authenticating as an admin (polkit
# auth_admin_keep, the same prompt as without the rule). Use groups polkit accepts as
# admins (Ubuntu/Debian: sudo; Ubuntu also admin), e.g. [sudo, rdp-admins@example.com]
# only when polkit's admin rule names it too. [] = only root.
fastrdp_power_admin_groups: [sudo]
# true: active sessions on a physical seat (local console, incl. the GDM login screen)
# keep the upstream defaults: power off, reboot and suspend without a password, even
# while other users are logged in. RDP sessions never have a seat.
fastrdp_power_allow_local_console: false

# Derived: the version of these roles (debian/changelog of the checkout). Packages from the
# APT repository must not be older (base role upgrades them, broker role checks).
fastrdp_roles_version: >-
  {{ lookup('ansible.builtin.file', playbook_dir ~ '/../debian/changelog').splitlines()[0]
     | regex_replace('^[^(]*[(]([0-9.]+).*$', '\1') }}
# fastrdp's own packages (one source package, one version); the vendored FreeRDP/xrdp
# packages have their own versions and follow as dependencies.
fastrdp_apt_own_packages: [fastrdp-broker, libpam-fastrdp-token, fastrdp-session, fastrdp-proxy-module, fastrdp-webgate]
# Derived: the vendored packages (own version numbers) these roles need, from their
# changelogs in the checkout; the base role upgrades installed ones that are older.
fastrdp_apt_vendored_versions:
  fastrdp-freerdp3: >-
    {{ lookup('ansible.builtin.file', playbook_dir ~ '/../packaging/freerdp/debian/changelog').splitlines()[0]
       | regex_replace('^[^(]*[(]([^)]+)[)].*$', '\1') }}
  fastrdp-xrdp: >-
    {{ lookup('ansible.builtin.file', playbook_dir ~ '/../packaging/xrdp/debian/changelog').splitlines()[0]
       | regex_replace('^[^(]*[(]([^)]+)[)].*$', '\1') }}

