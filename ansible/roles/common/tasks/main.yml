---
- name: Host name usable for Kerberos (TERMSRV/<fqdn>) and the certificate
  ansible.builtin.assert:
    that:
      - fastrdp_fqdn is match('^[a-z0-9-]+(\.[a-z0-9-]+)+$')
      - fastrdp_fqdn | lower != fastrdp_domain | lower
    fail_msg: >-
      fastrdp_fqdn is "{{ fastrdp_fqdn }}": it must be this host's fully qualified name
      (e.g. rdp1.{{ fastrdp_domain }}), never the bare domain, or the TERMSRV principal and the
      certificate get the wrong name. It is the inventory name when that is an FQDN, else the
      fqdn fact (reverse DNS, /etc/hosts): use the FQDN as inventory name, set fastrdp_fqdn,
      or fix the PTR record / /etc/hosts.
    quiet: true

# override_homedir goes into sssd.conf as is: an absolute path of plain names and the
# expansions sssd knows (sssd.conf(5)), no "." or ".." components, no trailing slash.
- name: Home directory settings
  ansible.builtin.assert:
    that:
      - fastrdp_sssd_override_homedir is string
      - fastrdp_sssd_override_homedir == ''
        or (fastrdp_sssd_override_homedir is match('^(/([A-Za-z0-9._@+-]|%[uUdflPohH%])+)+\Z')
            and fastrdp_sssd_override_homedir is not search('(^|/)\.\.?(/|$)'))
      - fastrdp_autofs in ['none', 'sssd', 'files']
      - fastrdp_home_create_roots is sequence and fastrdp_home_create_roots is not string
      - fastrdp_home_create_roots | map('string') | reject('match', '^(/[A-Za-z0-9._@+-]+)+\Z') | list | length == 0
      - fastrdp_home_create_roots | map('string') | select('search', '(^|/)\.\.?(/|$)') | list | length == 0
    fail_msg: >-
      fastrdp_sssd_override_homedir is "" (the directory's homes) or an absolute path such as
      /home/%u, with only the sssd expansions %u %U %d %f %l %P %o %h %H %% (sssd.conf(5));
      fastrdp_autofs is none, sssd or files; fastrdp_home_create_roots is a list of absolute
      directories other than / without "." or ".." components or a trailing slash, e.g.
      [/home] or [] (docs/nfs-kerberos-homes.md).
    quiet: true

# Role identity's defaults; the lines go into /etc/fstab as they are (fstab-smb.j2).
- name: SMB home settings
  vars:
    smb_mounts: "{{ fastrdp_smb_mounts | default([]) }}"
    smb_mount_list: "{{ smb_mounts if smb_mounts is sequence and smb_mounts is not string and smb_mounts is not mapping else [] }}"
  ansible.builtin.assert:
    that:
      - fastrdp_smb_krb5_homes | default(false) | string | lower in ['true', 'false']
      - smb_mounts is sequence and smb_mounts is not string and smb_mounts is not mapping
      - smb_mount_list | reject('mapping') | list | length == 0
      - smb_mount_list | select('mapping') | map('list') | flatten | difference(['what', 'where', 'options']) | length == 0
      - smb_mount_list | length == 0 or fastrdp_smb_krb5_homes | default(false) | bool
      # //<FQDN>/<share>[/<path>]: the name of the cifs/ principal
      - smb_mount_list | select('mapping') | map(attribute='what', default='') | map('string')
        | reject('match', '^//[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(/[A-Za-z0-9._$@+-]+)+\Z') | list | length == 0
      - smb_mount_list | select('mapping') | map(attribute='where', default='') | map('string')
        | reject('match', '^(/[A-Za-z0-9._@+-]+)+\Z') | list | length == 0
      - smb_mount_list | select('mapping') | map(attribute='where', default='') | map('string')
        | select('search', '(^|/)\.\.?(/|$)') | list | length == 0
      - smb_mount_list | select('mapping') | map(attribute='where', default='') | unique | list | length == smb_mount_list | length
      - smb_mount_list | select('mapping') | map(attribute='options', default='') | map('string')
        | reject('match', '^[A-Za-z0-9_.:=,/-]*\Z') | list | length == 0
      - smb_mount_list | select('mapping') | map(attribute='options', default='') | map('string')
        | select('search', '(^|,)sec=(?!krb5i?(,|$))') | list | length == 0
    fail_msg: >-
      fastrdp_smb_krb5_homes is true or false; fastrdp_smb_mounts (only with
      fastrdp_smb_krb5_homes: true) is a list of {what: //<server FQDN>/<share>, where:
      <absolute path>, options: <optional mount.cifs options without spaces, sec only
      krb5 or krb5i>}, each "where" once (docs/smb-kerberos-homes.md).

# Group names go into the polkit rule as JSON strings; still only names a group can have
# (letters, digits, . _ - @, spaces as in AD names), so a typo cannot change the rule.
- name: Power action settings (polkit rule, base role)
  ansible.builtin.assert:
    that:
      - fastrdp_block_power_actions | string | lower in ['true', 'false']
      - fastrdp_power_allow_local_console | string | lower in ['true', 'false']
      - fastrdp_power_admin_groups is sequence and fastrdp_power_admin_groups is not string
      - fastrdp_power_admin_groups | map('string') | reject('match', '^[A-Za-z0-9._@][A-Za-z0-9._@ -]*\Z') | list | length == 0
    fail_msg: >-
      fastrdp_block_power_actions and fastrdp_power_allow_local_console are true or false;
      fastrdp_power_admin_groups is a list of group names, e.g. [sudo] or [] (only root)
      (docs/desktop-matrix.md#host-safety-power-actions).
    quiet: true

# The values go into /etc/fastrdp/tgt-notify.conf (desktops role) as TOML strings;
# tgt-notify refuses what it cannot parse, so check here, not in every session.
- name: Kerberos login reminder settings (desktops role)
  vars:
    thresholds: "{{ fastrdp_tgt_notify_thresholds }}"
    threshold_list: "{{ thresholds if thresholds is sequence and thresholds is not string and thresholds is not mapping else [] }}"
    texts: "{{ fastrdp_tgt_notify_texts }}"
    text_map: "{{ texts if texts is mapping else {} }}"
  ansible.builtin.assert:
    that:
      - fastrdp_tgt_notify | string | lower in ['true', 'false']
      - fastrdp_tgt_notify_expired | string | lower in ['true', 'false']
      - thresholds is sequence and thresholds is not string and thresholds is not mapping
      - threshold_list | map('string') | reject('match', '^0*[1-9][0-9]*[smhd]?\Z') | list | length == 0
      - fastrdp_tgt_notify_interval | string is match('^0*[1-9][0-9]*[smhd]?\Z')
      - texts is mapping
      - text_map.keys() | difference(['summary', 'body', 'expired_summary', 'expired_body']) | length == 0
      - text_map.values() | reject('string') | list | length == 0
      - text_map.values() | map('trim') | select('equalto', '') | list | length == 0
      # only {left} {deadline} {principal}; literal braces doubled
      - text_map.values() | map('regex_replace', '\{\{|\}\}|\{(left|deadline|principal)\}', '')
        | select('search', '[{}]') | list | length == 0
    fail_msg: >-
      fastrdp_tgt_notify and fastrdp_tgt_notify_expired are true or false;
      fastrdp_tgt_notify_thresholds is a list of durations such as [24h, 2h] (a whole
      number above 0 with s, m, h or d; [] = only when expired); fastrdp_tgt_notify_interval
      is one duration, e.g. 10m; fastrdp_tgt_notify_texts is a mapping with the keys
      summary, body, expired_summary, expired_body (each optional, non-empty text), using
      only the placeholders {left}, {deadline} and {principal}
      (docs/nfs-kerberos-homes.md#long-running-sessions).

# Role desktops' defaults (browsers, backlog K9). The domains go into browser policies
# as host patterns: DNS names with at least one dot (no bare TLD, no wildcard, no URL).
- name: Browser settings (desktops role)
  vars:
    domains: "{{ fastrdp_browser_spnego_domains | default([]) }}"
    domain_list: "{{ domains if domains is sequence and domains is not string and domains is not mapping else [] }}"
  ansible.builtin.assert:
    that:
      - fastrdp_firefox_deb | default(false) | string | lower in ['true', 'false']
      - fastrdp_firefox_mozilla_key_fingerprint | default('35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3') | string
        is match('^[0-9A-Fa-f]{40}\Z')
      - domains is sequence and domains is not string and domains is not mapping
      - domain_list | map('string') | reject('match', '^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]*[A-Za-z0-9])?\Z')
        | list | length == 0
      - fastrdp_firefox_policies | default({}) is mapping
    fail_msg: >-
      fastrdp_firefox_deb is true or false; fastrdp_firefox_mozilla_key_fingerprint is 40 hex
      digits; fastrdp_browser_spnego_domains is a list of DNS domains with at least one dot,
      e.g. [example.com] (the domain and every host below it; no "*.", no URL);
      fastrdp_firefox_policies is a mapping of Firefox enterprise policies
      (docs/desktop-matrix.md#browsers-and-kerberos-sso).
    quiet: true

# Role web_gateway's defaults. The KDCs go into kdcproxy.conf as they are (one
# space-separated line), and the realm becomes its section name.
- name: KDC proxy settings (web_gateway role)
  vars:
    kdcproxy: "{{ fastrdp_web_kdcproxy | default(false) }}"
    kdcs: "{{ fastrdp_web_kdcproxy_kdcs | default([]) }}"
    kdc_list: "{{ kdcs if kdcs is sequence and kdcs is not string and kdcs is not mapping else [] }}"
    rate: "{{ fastrdp_web_kdcproxy_rate_per_minute | default(60) | string }}"
    burst: "{{ fastrdp_web_kdcproxy_burst | default(20) | string }}"
  ansible.builtin.assert:
    that:
      - kdcproxy | string | lower in ['true', 'false']
      - fastrdp_web_kdcproxy_kpasswd | default(true) | string | lower in ['true', 'false']
      - kdcs is sequence and kdcs is not string and kdcs is not mapping
      - kdc_list | map('string') | reject('match', '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?\Z') | list | length == 0
      - kdc_list | map('string') | select('search', ':') | map('regex_replace', '^[^:]*:', '') | map('int')
        | reject('ge', 1) | list | length == 0
      - kdc_list | map('string') | select('search', ':') | map('regex_replace', '^[^:]*:', '') | map('int')
        | reject('le', 65535) | list | length == 0
      - rate is match('^[0-9]+\Z') and rate | int >= 1
      - burst is match('^[0-9]+\Z')
      - not kdcproxy | bool or fastrdp_web_enabled | bool
      - not kdcproxy | bool or (fastrdp_realm is match('^[A-Za-z0-9][A-Za-z0-9._-]*\Z') and fastrdp_realm | lower != 'global')
    fail_msg: >-
      fastrdp_web_kdcproxy and fastrdp_web_kdcproxy_kpasswd are true or false;
      fastrdp_web_kdcproxy needs fastrdp_web_enabled (the proxy runs behind the web
      gateway's nginx) and a realm of letters, digits, ".", "_" and "-";
      fastrdp_web_kdcproxy_kdcs is a list of KDC host names or IPv4 addresses with an
      optional port 1-65535, e.g. [dc1.example.com, "dc2.example.com:88"] ([] = DNS SRV);
      fastrdp_web_kdcproxy_rate_per_minute is a whole number of at least 1 and
      fastrdp_web_kdcproxy_burst a whole number (docs/web-access.md#kdc-proxy).
    quiet: true

- name: Required site settings are present and consistent
  ansible.builtin.assert:
    that:
      - fastrdp_realm | length > 0
      - fastrdp_domain | length > 0
      - fastrdp_domain is match('^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*$')
      - fastrdp_desktops | length > 0
      - fastrdp_default_desktop in fastrdp_desktops
      - fastrdp_group_desktops.values() | difference(fastrdp_desktops) | length == 0
      - fastrdp_desktop_groups.keys() | difference(fastrdp_desktops) | length == 0
      - fastrdp_identity_provider in ['ad', 'ipa', 'none']
      - fastrdp_mfa_mode in ['none', 'otp', 'push', 'otp_or_push', 'web', 'push_or_web']
      - fastrdp_gpu in ['auto', 'nvidia', 'mesa', 'none']
      - fastrdp_session_tgt in ['auto', 'off', 'required']
      - fastrdp_session_tgt_groups is mapping
      - fastrdp_session_tgt_groups.values() | map('string') | difference(['auto', 'off', 'required']) | length == 0
      - fastrdp_session_tgt_groups.keys() | map('string') | reject('match', '^\S([^\x00-\x1f]*\S)?\Z') | list | length == 0
      - fastrdp_sssd_fully_qualified_names | string | lower in ['true', 'false']
      - fastrdp_mfa_mode not in ['otp', 'push', 'otp_or_push', 'push_or_web'] or fastrdp_privacyidea_url | length > 0
      - fastrdp_mfa_mode not in ['web', 'push_or_web'] or fastrdp_web_enabled | bool
      - fastrdp_backend_port_range | length == 2
      - fastrdp_backend_port_range[0] | int < fastrdp_backend_port_range[1] | int
      - fastrdp_xrdp_port | int != fastrdp_listen_port | int
      - fastrdp_termsrv_aliases is sequence and fastrdp_termsrv_aliases is not string
      - fastrdp_termsrv_aliases | reject('match', '^[A-Za-z0-9][A-Za-z0-9.-]*$') | list | length == 0
      - not fastrdp_mfa_nla_kdc_enforced | bool
        or (fastrdp_mfa_nla_kdc_auth_indicators | length > 0
            and fastrdp_mfa_nla_kdc_auth_indicators | difference(['passkey', 'pkinit', 'otp', 'radius', 'idp']) | length == 0)
      - not fastrdp_mfa_nla_kdc_enforced | bool or fastrdp_identity_provider != 'ad'
        or fastrdp_mfa_nla_kdc_enforced_by_ad_policy | bool
      - fastrdp_mfa_reconnect_grace | string is match('^[0-9]+$')
      - fastrdp_mfa_reconnect_grace | int <= 3600
      - fastrdp_mfa_reconnect_grace_same_address | string | lower in ['true', 'false']
      - fastrdp_mfa_web_approval_timeout | string is match('^[0-9]+$')
      - fastrdp_mfa_web_approval_timeout | int >= 10 and fastrdp_mfa_web_approval_timeout | int <= 540
      - fastrdp_proxy_broker_timeout | string is match('^[0-9]+$') and fastrdp_proxy_broker_timeout | int >= 1
        and fastrdp_proxy_broker_timeout | int <= 600
      - fastrdp_mfa_mode not in ['web', 'push_or_web']
        or fastrdp_mfa_web_approval_timeout | int < fastrdp_proxy_broker_timeout | int
      - fastrdp_mfa_web_approval_max_auth_age | string is match('^[0-9]+$')
      - fastrdp_mfa_web_approval_max_auth_age | int <= 300
      - fastrdp_mfa_web_approval_single_pending | string | lower in ['true', 'false']
      - fastrdp_xrdp_autodetect_profile in ['lan', 'wan', 'broadband_high', 'satellite', 'broadband_low', 'modem', 'default']
      - fastrdp_lan_networks is sequence and fastrdp_lan_networks is not string
      # shape only; the broker parses them strictly (host bits set, prefix range) at start-up
      - fastrdp_lan_networks | map('string') | reject('match', '^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)(/[0-9]{1,3})?$') | list | length == 0
      - fastrdp_accept_remote_guard | string | lower in ['true', 'false']
      - fastrdp_tls_login_sources is sequence and fastrdp_tls_login_sources is not string
      # \Z, not $: a trailing newline would end the proxy.ini line
      - fastrdp_tls_login_sources | map('string') | reject('match', '^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)(/[0-9]{1,3})?\Z') | list | length == 0
    fail_msg: >-
      Check the site settings (docs/quickstart.md, roles/common/defaults/main.yml):
      fastrdp_realm and fastrdp_domain (a DNS domain name) are required; fastrdp_default_desktop,
      fastrdp_group_desktops and fastrdp_desktop_groups may only name desktops from
      fastrdp_desktops; fastrdp_mfa_mode is none, otp, push, otp_or_push, web or
      push_or_web; the privacyIDEA modes (all but none and web) need fastrdp_privacyidea_url,
      web and push_or_web need fastrdp_web_enabled;
      fastrdp_session_tgt is auto, off or required; fastrdp_session_tgt_groups maps group
      names to auto, "off" (quoted) or required; fastrdp_sssd_fully_qualified_names is
      true or false; fastrdp_gpu is auto, nvidia, mesa or none;
      fastrdp_termsrv_aliases are plain DNS names; fastrdp_mfa_nla_kdc_enforced needs
      fastrdp_mfa_nla_kdc_auth_indicators from passkey, pkinit, otp, radius, idp (never
      hardened), and on AD fastrdp_mfa_nla_kdc_enforced_by_ad_policy (docs/passkeys.md);
      fastrdp_mfa_reconnect_grace is whole seconds 0..3600 and
      fastrdp_mfa_reconnect_grace_same_address true or false (docs/auth-matrix.md);
      fastrdp_mfa_web_approval_timeout is whole seconds 10..540 and, with web approval, less
      than fastrdp_proxy_broker_timeout (whole seconds 1..600);
      fastrdp_mfa_web_approval_max_auth_age whole seconds 0..300 and
      fastrdp_mfa_web_approval_single_pending true or false (docs/auth-matrix.md#web-approval);
      fastrdp_xrdp_autodetect_profile is lan, wan, broadband_high, satellite, broadband_low,
      modem or default; fastrdp_lan_networks is a list of CIDRs (docs/performance.md);
      fastrdp_tls_login_sources is a list of addresses/CIDRs (docs/backends/web.md);
      fastrdp_accept_remote_guard is true or false (docs/windows-clients.md §3.11).
    quiet: true
