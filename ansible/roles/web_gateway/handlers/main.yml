---
# Also notified by the base role's package upgrade (apt_repo.yml), which runs on every host;
# this role's handlers are loaded even when site.yml skips the role (fastrdp_web_enabled
# false), and then there is no fastrdp-webgate.service to restart.
- name: Restart fastrdp-webgate
  ansible.builtin.systemd_service:
    name: fastrdp-webgate.service
    state: restarted
    daemon_reload: true
  when: fastrdp_web_enabled | bool

- name: Restart guacamole
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [fastrdp-guacd.service, fastrdp-guacamole.service]

# Socket first: a restarted socket is a new file, and only a restarted service gets it.
- name: Restart fastrdp-kdcproxy
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [fastrdp-kdcproxy.socket, fastrdp-kdcproxy.service]

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
