---
# fastrdp_web_enabled is decided here, not with a "when" in site.yml: a role skipped there
# has its handlers skipped too, and a gateway set up by an earlier run would stay up.
- name: Web gateway (fastrdp_web_enabled)
  ansible.builtin.import_tasks: web.yml
  when: fastrdp_web_enabled | bool

- name: No web gateway left from an earlier run
  ansible.builtin.import_tasks: web_absent.yml
  when: not fastrdp_web_enabled | bool
