---
# Browser access: Keycloak (OIDC) -> fastrdp-webgate -> Guacamole -> fastrdp proxy.
# fastrdp_web_public_url (webgate public_url, also on the proxy's waiting screen): role common
fastrdp_web_oidc_issuer: https://keycloak.lab.example.com/realms/lab
fastrdp_web_oidc_client_id: fastrdp-web
fastrdp_web_oidc_client_secret: "{{ vault_fastrdp_web_oidc_client_secret | default('') }}"
fastrdp_web_oidc_ca_src: ""
fastrdp_web_username_claim: preferred_username
# user@<domain> claims are accepted only for these domains; anything else is refused
fastrdp_web_strip_domains: ["{{ fastrdp_domain | lower }}"]
# MFA proof required from the IdP (see docs/web-access.md; passkeys: docs/passkeys.md).
# required_amr_any: any one listed value proves MFA, e.g. [otp, hwk, swk, mfa]; the
# webgate refuses single-factor values (pwd, kba, pin, user, wia, rba, geo).
fastrdp_web_required_acr: [mfa]
fastrdp_web_required_amr_any: []
fastrdp_web_desktops: "{{ fastrdp_desktops }}"
fastrdp_web_session_lifetime: 900   # webgate login only; RDP sessions are not affected
# The proxy as RDP clients reach it, for "Download .rdp file" on the chooser page
# (mstsc "full address"). Change it if clients connect through another name or a
# forwarded port; a DNS name, never an IP address (Windows then falls back to NTLM).
# The .rdp files ask for sound (audiomode:i:0) with fastrdp_audio and for the microphone
# (audiocapturemode:i:1) with fastrdp_audio and fastrdp_audio_input (docs/audio.md).
fastrdp_web_rdp_host: "{{ fastrdp_fqdn }}"
fastrdp_web_rdp_port: "{{ fastrdp_listen_port }}"
fastrdp_guacamole_version: 1.6.0
fastrdp_guacamole_image: "docker.io/guacamole/guacamole:{{ fastrdp_guacamole_version }}"
fastrdp_guacd_image: "docker.io/guacamole/guacd:{{ fastrdp_guacamole_version }}"
# Guacamole RDP parameters. Audio out is on (Guacamole's default); the microphone
# (enable-audio-input) follows fastrdp_audio_input unless set here (docs/web-access.md).
fastrdp_web_rdp_parameters:
  enable-font-smoothing: "true"
  color-depth: "32"

# ---------------------------------------------------------------- approval notifications
# Opt-in (docs/notifications.md): with fastrdp_mfa_mode web or push_or_web, users who
# turned them on at https://<fqdn>/web/notify get a notification when an RDP login of
# theirs waits for approval, linking to https://<fqdn>/web/approve (approving still
# takes the fresh MFA sign-in there). [] = off; ntfy and/or webpush.
fastrdp_web_notify_backends: []
# ntfy: the server's https:// URL; a token with write access to the topics fastrdp-*
# (vault.yml; "" = publish without a token, only for a server that allows it).
fastrdp_web_notify_ntfy_url: ""
fastrdp_web_notify_ntfy_token: "{{ vault_fastrdp_web_notify_ntfy_token | default('') }}"
# webpush: contact for the push services (RFC 8292). The VAPID key
# (/etc/fastrdp/webgate-vapid.pem) is generated once; replacing it invalidates every
# browser subscription.
fastrdp_web_notify_vapid_subject: "mailto:root@{{ fastrdp_fqdn }}"
# webpush: push services accepted besides the browsers' own (FCM, Mozilla, Apple, WNS),
# e.g. [ntfy.example.com] for your ntfy server as UnifiedPush distributor of IronFox or
# Fennec on Android without Google services. DNS names (and their subdomains), https on
# port 443 only. Only your own server: the gateway POSTs there for any signed-in user.
fastrdp_web_notify_webpush_extra_hosts: []
# At most N notifications per user within SECONDS ("N/SECONDS"); above that one alert
# without a link per window.
fastrdp_web_notify_rate_limit: "3/600"
# Tell the user when a notified login is denied or not approved in time.
fastrdp_web_notify_alert_on_deny: true
# The login's two-digit code (also on the waiting screen and the approval page).
fastrdp_web_notify_show_code: true

# ---------------------------------------------------------------- passkeys (Keycloak)
# Opt-in: configure Keycloak for passkeys on the web path (docs/passkeys.md, recipe A)
# through its admin REST API, from the controller (tasks/keycloak_passkeys.yml). false =
# Keycloak is never contacted. true sets, idempotently and without touching anything else:
# the realm's WebAuthn passwordless policy (UV + discoverable credential required,
# passkeys enabled), flow fastrdp_keycloak_mfa_flow WITHOUT a Cookie step, a client
# profile + policy (acr-condition -> auth-flow-enforcer, merged into the existing
# lists) and the client's ACR-to-LoA map. Run alone: site.yml --tags keycloak.
fastrdp_web_passkeys: false
# Keycloak base URL (no /realms/...) and realm; default: taken from the OIDC issuer.
fastrdp_keycloak_admin_url: "{{ fastrdp_web_oidc_issuer | regex_replace('/realms/[^/]+/?$', '') }}"
fastrdp_keycloak_realm: "{{ fastrdp_web_oidc_issuer | regex_replace('^.*/realms/([^/]+)/?$', '\\1') }}"
fastrdp_keycloak_client_id: "{{ fastrdp_web_oidc_client_id }}"
# Admin credentials. Preferred: a confidential client in fastrdp_keycloak_admin_realm with
# a service account holding realm-management roles manage-realm + manage-clients
# (client_credentials grant). Otherwise an admin user (password grant via admin-cli).
fastrdp_keycloak_admin_realm: master
fastrdp_keycloak_admin_client_id: admin-cli
fastrdp_keycloak_admin_client_secret: "{{ vault_fastrdp_keycloak_admin_client_secret | default('') }}"   # vault.yml
fastrdp_keycloak_admin_user: ""
fastrdp_keycloak_admin_password: "{{ vault_fastrdp_keycloak_admin_password | default('') }}"            # vault.yml
fastrdp_keycloak_ca_src: "{{ fastrdp_web_oidc_ca_src }}"   # PEM on the controller; "" = system trust store
# The forced flow and the level it proves. The acr value must be in fastrdp_web_required_acr.
fastrdp_keycloak_mfa_flow: fastrdp-mfa
fastrdp_keycloak_mfa_acr: mfa
fastrdp_keycloak_mfa_loa: 2
# Second factor after a password (ALTERNATIVEs): Keycloak authenticator ids, e.g. add the
# privacyIDEA provider's id. Never auth-cookie or conditional-user-configured.
fastrdp_keycloak_second_factors: [auth-otp-form, webauthn-authenticator]
fastrdp_web_passkeys_mediation: conditional   # conditional (autofill) | optional | required | silent | none
# Hardware-only passkeys: attestation "direct" and only these AAGUIDs (e.g. the YubiKey
# models in use; FIDO MDS or Yubico's list). Software/synced passkeys (iCloud, Google,
# Bitwarden, KeePassXC) are then refused at registration. Also import the vendors'
# attestation roots into Keycloak's truststore (server option truststore-paths), and
# delete passkeys registered earlier: the list is only checked at registration.
# Without hardware-only the role leaves attestation and the AAGUID list as the realm has
# them (an allow-list set in the admin console is kept); switching hardware-only off does
# not clear the list (docs/passkeys.md#hardware-only-policy-attestation-aaguids-verified--docs).
fastrdp_web_passkeys_hardware_only: false
fastrdp_web_passkeys_aaguids: []
# Close the enrolment gap (docs/passkeys.md#close-the-enrolment-gap-enrolling-a-factor-needs-mfa):
# the account console (client account-console) signs in through fastrdp_keycloak_mfa_flow
# too, so enrolling a passkey or OTP app there needs a passkey or password + second factor.
# Opt-in: users without any second factor then cannot use the account console (enrol their
# first factor another way). Off: each run warns while the gap is open; an override set
# earlier is never removed.
fastrdp_keycloak_account_console_mfa: false

# ---------------------------------------------------------------- KDC proxy (MS-KKDCP)
# Opt-in: python3-kdcproxy under gunicorn (unprivileged, systemd socket on
# /run/fastrdp-kdcproxy.sock) behind this nginx at https://<fastrdp_fqdn>/KdcProxy, so
# clients without a route to the KDCs (no VPN) can still do Kerberos NLA: FreeRDP
# /kerberos:kdc-url:<fqdn> plus krb5.conf "kdc = https://<fqdn>/KdcProxy", Windows via the
# GPO "Specify KDC proxy servers for Kerberos clients" (docs/web-access.md#kdc-proxy).
# Only fastrdp_realm is proxied, only to its KDCs (never DNS lookups for other realms).
# Exposure: anyone on the internet can then send pre-authentication attempts (password
# guessing) to the KDCs through it: account lockout policy and the rate limit matter.
fastrdp_web_kdcproxy: false
# KDCs as host or host:port (IPv6 as [addr]:port), e.g. [dc1.example.com, dc2.example.com:88].
# [] = the SRV records _kerberos._tcp.<realm in lower case>, looked up on the host at each
# run (re-run the playbook when the KDCs change). TCP only.
fastrdp_web_kdcproxy_kdcs: []
# Password changes (kpasswd, e.g. kinit with an expired password) through the proxy:
# SRV _kpasswd._tcp.<realm>, or port 464 of the listed KDCs. false = AS/TGS requests only.
fastrdp_web_kdcproxy_kpasswd: true
# nginx limit_req per client address: requests per minute and burst. One login takes
# about 3-6 requests (AS-REQ twice with pre-authentication, TGS-REQ for TERMSRV).
# Clients behind one NAT address share the limit.
fastrdp_web_kdcproxy_rate_per_minute: 60
fastrdp_web_kdcproxy_burst: 20
# Derived, normally not set: the servers kdcproxy.conf names (host:port). The listed KDCs
# (port 88 added) or the SRV records tasks/kdcproxy.yml looked up (fastrdp_kdcproxy_srv);
# kpasswd: the _kpasswd._tcp SRV records, else port 464 of the KDC hosts.
fastrdp_web_kdcproxy_kdc_servers: >-
  {{ (fastrdp_web_kdcproxy_kdcs | map('string') | map('regex_replace', '^([^:]+)$', '\1:88') | list)
     if fastrdp_web_kdcproxy_kdcs | length > 0
     else (fastrdp_kdcproxy_srv.stdout | default('{}', true) | from_json).kerberos | default([]) }}
fastrdp_web_kdcproxy_kpasswd_servers: >-
  {{ [] if not fastrdp_web_kdcproxy_kpasswd | bool
     else ((((fastrdp_kdcproxy_srv.stdout | default('{}', true) | from_json).kpasswd | default([]))
            if fastrdp_web_kdcproxy_kdcs | length == 0 else [])
           or (fastrdp_web_kdcproxy_kdc_servers | map('regex_replace', ':[0-9]+$', ':464') | unique | list)) }}
