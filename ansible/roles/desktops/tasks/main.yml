---
- name: Known desktops only
  ansible.builtin.assert:
    that: item in fastrdp_desktop_packages
    fail_msg: "Unknown desktop {{ item }}; known: {{ fastrdp_desktop_packages.keys() | join(', ') }}"
  loop: "{{ fastrdp_desktops }}"

- name: Desktop packages
  ansible.builtin.apt:
    name: "{{ fastrdp_desktop_common_packages + (fastrdp_desktops | map('extract', fastrdp_desktop_packages) | flatten) }}"
    state: present
    install_recommends: false

- name: Helper packages for wlroots desktops
  ansible.builtin.apt:
    name: "{{ fastrdp_wlroots_common_packages }}"
    state: present
    install_recommends: false
  when: fastrdp_desktops | intersect(fastrdp_wlroots_desktops) | length > 0

- name: Launcher directory for wlroots desktops
  ansible.builtin.file:
    path: /usr/libexec/fastrdp
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fastrdp_desktops | intersect(fastrdp_wlroots_desktops) | length > 0

- name: Launcher and clipboard bridge for wlroots desktops
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/session/libexec/{{ item }}"
    dest: "/usr/libexec/fastrdp/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [wlroots-in-x, clipboard-bridge]
  when: fastrdp_desktops | intersect(fastrdp_wlroots_desktops) | length > 0

- name: X session entries for wlroots desktops
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/session/xsessions/fastrdp-{{ item }}.desktop"
    dest: "/usr/share/xsessions/fastrdp-{{ item }}.desktop"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ fastrdp_desktops | intersect(fastrdp_wlroots_desktops) }}"

- name: X session files exist
  ansible.builtin.stat:
    path: "/usr/share/xsessions/{{ fastrdp_desktop_xsessions[item] }}.desktop"
  loop: "{{ fastrdp_desktops | select('in', fastrdp_desktop_xsessions) | list }}"
  register: fastrdp_xsession_files

- name: Every X11 desktop has its session file
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item }}: /usr/share/xsessions/{{ fastrdp_desktop_xsessions[item.item] }}.desktop missing"
    quiet: true
  loop: "{{ fastrdp_xsession_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: No screen lockers in remote sessions (the RDP client locks)
  ansible.builtin.apt:
    name: [light-locker, xscreensaver]
    state: absent
