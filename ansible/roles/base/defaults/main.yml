---
# How the fastrdp components get onto the host (all roles):
#   build = copy them from this checkout and compile on the host (default)
#   apt   = install the fastrdp-* packages from the APT repository (docs/packaging.md),
#           including fastrdp's own FreeRDP (fastrdp-freerdp3) and xrdp (fastrdp-xrdp)
fastrdp_install_method: build

# APT repository (fastrdp_install_method: apt)
fastrdp_apt_repo_url: https://linuxrrze.github.io/fast-rdp-server
# stable = release tags, testing = main branch
fastrdp_apt_channel: stable
# One suite per distro release (binaries are built per release): resolute-stable, trixie-testing, ...
fastrdp_apt_suite: "{{ ansible_facts.distribution_release }}-{{ fastrdp_apt_channel }}"
fastrdp_apt_key_url: "{{ fastrdp_apt_repo_url }}/fast-rdp-server-archive-keyring.asc"
# Pin the key file, e.g. "sha256:<hex>" (recommended; "" = trust the HTTPS download)
fastrdp_apt_key_checksum: ""
# present | latest (latest also upgrades the fastrdp packages on every run)
fastrdp_apt_package_state: present

# Derived, normally not set: subjectAltName of the self-signed front certificate
# (fastrdp_front_cert_src: ""): every name clients may type, i.e. the FQDN, the short
# name and fastrdp_termsrv_aliases. An existing /etc/fastrdp/front.crt is kept.
fastrdp_front_cert_san: >-
  {{ ([fastrdp_fqdn, fastrdp_hostname] + fastrdp_termsrv_aliases) | unique
     | map('regex_replace', '^', 'DNS:') | join(',') }}
