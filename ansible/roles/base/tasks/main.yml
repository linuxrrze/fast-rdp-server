---
- name: Supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('26.04', '>='))
        or (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 13)
    fail_msg: fastrdp phases 1-3 target Ubuntu 26.04+ and Debian 13+.

- name: Known install method
  ansible.builtin.assert:
    that: fastrdp_install_method in ['build', 'apt']
    fail_msg: "fastrdp_install_method must be build or apt, not {{ fastrdp_install_method }}"

- name: Base packages
  ansible.builtin.apt:
    name: [chrony, nftables, openssl, python3, ca-certificates, dbus-user-session, polkitd]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: APT repository with the fastrdp packages
  ansible.builtin.import_tasks: apt_repo.yml
  when: fastrdp_install_method == 'apt'

- name: Time sync (Kerberos needs it)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Group for broker socket clients (proxy, webgate)
  ansible.builtin.group:
    name: _fastrdp-broker
    system: true

- name: Proxy service account
  ansible.builtin.user:
    name: _fastrdp-proxy
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Config directory
  ansible.builtin.file:
    path: /etc/fastrdp
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Front-end TLS certificate (provided)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/fastrdp/{{ item.dest }}"
    owner: root
    group: _fastrdp-proxy
    mode: "{{ item.mode }}"
  loop:
    - {src: "{{ fastrdp_front_cert_src }}", dest: front.crt, mode: "0644"}
    - {src: "{{ fastrdp_front_key_src }}", dest: front.key, mode: "0640"}
  when: fastrdp_front_cert_src | length > 0
  notify: Restart fastrdp-proxy

- name: Front-end TLS certificate (self-signed, lab only)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:3072 -nodes -days 825
      -subj "/CN={{ fastrdp_fqdn }}" -addext "subjectAltName={{ fastrdp_front_cert_san }}"
      -addext "extendedKeyUsage=serverAuth"
      -keyout /etc/fastrdp/front.key -out /etc/fastrdp/front.crt
    creates: /etc/fastrdp/front.crt
  when: fastrdp_front_cert_src | length == 0

- name: Front-end key permissions
  ansible.builtin.file:
    path: /etc/fastrdp/front.key
    owner: root
    group: _fastrdp-proxy
    mode: "0640"

- name: Firewall - drop-in directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Firewall - only the proxy may reach back-end ports
  ansible.builtin.template:
    src: nftables-fastrdp.nft.j2
    dest: /etc/nftables.d/fastrdp.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Firewall - include drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: include "/etc/nftables.d/*.nft"
    insertafter: EOF
  notify: Reload nftables

- name: Keep back-end ports out of the ephemeral port range
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-fastrdp.conf
    content: |
      # Ansible managed (fast-rdp-server): local changes are overwritten
      # Back-end ports are allocated by fastrdp-brokerd, never by the kernel.
      net.ipv4.ip_local_reserved_ports = {{ fastrdp_xrdp_port }},{{ fastrdp_backend_port_range[0] }}-{{ fastrdp_backend_port_range[1] }}
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Firewall service
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true

# polkitd reloads rules.d by itself (inotify); before the distribution's rules (49/50-*,
# com.ubuntu.desktop.rules): the first rule with an answer wins.
- name: No power off, reboot, suspend or hibernate from RDP sessions (polkit)
  ansible.builtin.template:
    src: 40-fastrdp-power.rules.j2
    dest: /etc/polkit-1/rules.d/40-fastrdp-power.rules
    owner: root
    group: root
    mode: "0644"
  when: fastrdp_block_power_actions | bool

- name: No power rule when disabled (upstream polkit defaults)
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/40-fastrdp-power.rules
    state: absent
  when: not fastrdp_block_power_actions | bool

- name: Optional /proc hidepid
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^proc\s+/proc\s'
    line: "proc /proc proc defaults,hidepid=invisible 0 0"
  when: fastrdp_proc_hidepid | bool
  notify: Remount proc
