---
# fastrdp APT repository (fastrdp_install_method: apt), see docs/packaging.md.
- name: APT repository - known channel
  ansible.builtin.assert:
    that: fastrdp_apt_channel in ['stable', 'testing']
    fail_msg: "fastrdp_apt_channel must be stable or testing, not {{ fastrdp_apt_channel }}"

- name: APT repository - keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: APT repository - signing key
  ansible.builtin.get_url:
    url: "{{ fastrdp_apt_key_url }}"
    dest: /etc/apt/keyrings/fast-rdp-server.asc
    checksum: "{{ fastrdp_apt_key_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  register: fastrdp_apt_key

- name: APT repository - source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/fast-rdp-server.sources
    content: |
      # Ansible managed (fast-rdp-server): local changes are overwritten
      Types: deb
      URIs: {{ fastrdp_apt_repo_url }}
      Suites: {{ fastrdp_apt_suite }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/fast-rdp-server.asc
    owner: root
    group: root
    mode: "0644"
  register: fastrdp_apt_source

- name: APT repository - refresh package lists  # noqa: no-handler - the next roles install from it
  ansible.builtin.apt:
    update_cache: true
  when: fastrdp_apt_key is changed or fastrdp_apt_source is changed

# The roles come from the checkout, the packages from the repository: installed fastrdp
# packages older than these roles are upgraded here (later roles only install missing ones),
# so new roles never configure an old broker. The broker role checks the result.
- name: Installed fastrdp packages
  ansible.builtin.command:
    argv: >-
      {{ ['dpkg-query', '-W', '-f=${Package} ${Version} ${db:Status-Abbrev}\\n']
         + fastrdp_apt_own_packages + (fastrdp_apt_vendored_versions | list) }}
  register: fastrdp_installed_pkgs
  changed_when: false
  failed_when: fastrdp_installed_pkgs.rc > 1     # 1: some are not installed

- name: Upgrade fastrdp packages older than these roles ({{ fastrdp_roles_version }})
  vars:
    installed: >-
      {{ fastrdp_installed_pkgs.stdout_lines | map('split') | selectattr('2', 'defined')
         | selectattr('2', 'match', '^ii') | selectattr('0', 'in', fastrdp_apt_own_packages) | list }}
    # name -> upstream version without the ~<distro> / +git suffix
    versions: >-
      {{ dict(installed | map(attribute='0') | zip(installed | map(attribute='1') | map('regex_replace', '[~+].*$', ''))) }}
    older: >-
      {{ versions | dict2items | selectattr('value', 'version', fastrdp_roles_version, '<') | map(attribute='key') | list }}
  ansible.builtin.apt:
    name: "{{ older }}"
    state: latest
    only_upgrade: true
    update_cache: true
    cache_valid_time: 0
  when: older | length > 0
  notify: [Restart fastrdp-brokerd, Restart fastrdp-proxy]

# The vendored FreeRDP/xrdp packages have their own versions (packaging/*/debian/changelog
# of this checkout): a patch-only change bumps their revision, which the fastrdp packages'
# dependency ranges do not force.
- name: Upgrade vendored packages older than these roles
  vars:
    installed: >-
      {{ fastrdp_installed_pkgs.stdout_lines | map('split') | selectattr('2', 'defined')
         | selectattr('2', 'match', '^ii') | selectattr('0', 'in', fastrdp_apt_vendored_versions | list) | list }}
  ansible.builtin.apt:
    name: "{{ item.0 }}"
    state: latest
    only_upgrade: true
    update_cache: true
    cache_valid_time: 0
  loop: "{{ installed }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"
  when: (item.1 | regex_replace('~(deb|ubuntu)[0-9.]+$', '')) is version(fastrdp_apt_vendored_versions[item.0], '<')
  notify: [Restart fastrdp-proxy, Restart xrdp]
