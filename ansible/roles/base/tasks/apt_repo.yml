---
# fastrdp APT repository (fastrdp_install_method: apt), see docs/packaging.md.
- name: APT repository - known channel
  ansible.builtin.assert:
    that: fastrdp_apt_channel in ['stable', 'testing']
    fail_msg: "fastrdp_apt_channel must be stable or testing, not {{ fastrdp_apt_channel }}"

- name: APT repository - keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: APT repository - signing key
  ansible.builtin.get_url:
    url: "{{ fastrdp_apt_key_url }}"
    dest: /etc/apt/keyrings/fast-rdp-server.asc
    checksum: "{{ fastrdp_apt_key_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  register: fastrdp_apt_key

- name: APT repository - source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/fast-rdp-server.sources
    content: |
      # Ansible managed (fast-rdp-server): local changes are overwritten
      Types: deb
      URIs: {{ fastrdp_apt_repo_url }}
      Suites: {{ fastrdp_apt_suite }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/fast-rdp-server.asc
    owner: root
    group: root
    mode: "0644"
  register: fastrdp_apt_source

- name: APT repository - refresh package lists  # noqa: no-handler - the next roles install from it
  ansible.builtin.apt:
    update_cache: true
  when: fastrdp_apt_key is changed or fastrdp_apt_source is changed

# The roles come from the checkout, the packages from the repository: installed fastrdp
# packages older than these roles are upgraded here (later roles only install missing ones),
# so new roles never configure an old broker. A malformed changelog line must not turn
# into a garbage comparison.
- name: Versions of these roles are well-formed
  ansible.builtin.assert:
    that:
      - fastrdp_roles_version is match('^[0-9]+(\\.[0-9]+)+$')
      - fastrdp_apt_vendored_versions.values() | reject('match', '^[0-9][A-Za-z0-9.+~-]*-[A-Za-z0-9.+~]+$') | list == []
    fail_msg: >-
      Cannot read the versions of these roles from the checkout: fastrdp_roles_version
      '{{ fastrdp_roles_version }}' (debian/changelog), vendored {{ fastrdp_apt_vendored_versions }}
      (packaging/*/debian/changelog). Check the first line of these changelogs.
    quiet: true

# files/fastrdp-outdated-packages.sh: one line "own|vendored PACKAGE INSTALLED REQUIRED" per
# installed package that is older (own: release number against fastrdp_roles_version; vendored:
# dpkg --compare-versions against packaging/*/debian/changelog, without the ~<distro> suffix).
- name: Fastrdp packages older than these roles
  vars:
    fastrdp_outdated_cmd: >-
      fastrdp-outdated-packages.sh {{ ([fastrdp_roles_version] + fastrdp_apt_own_packages
         + (fastrdp_apt_vendored_versions.items() | map('join', '=') | list)) | map('quote') | join(' ') }}
  block:
    - name: Installed fastrdp packages older than these roles ({{ fastrdp_roles_version }})
      ansible.builtin.script: "{{ fastrdp_outdated_cmd }}"
      register: fastrdp_outdated_pkgs
      changed_when: false
      check_mode: false

    - name: Upgrade fastrdp packages older than these roles
      vars:
        older: "{{ fastrdp_outdated_pkgs.stdout_lines | map('split') | selectattr('0', 'defined') | selectattr('0', 'eq', 'own') | map(attribute='1') | list }}"
      ansible.builtin.apt:
        name: "{{ older }}"
        state: latest
        only_upgrade: true
        update_cache: true
        cache_valid_time: 0
      when: older | length > 0
      notify: [Restart fastrdp-brokerd, Restart fastrdp-proxy, Restart fastrdp-webgate]

    # The vendored FreeRDP/xrdp packages have their own versions (packaging/*/debian/changelog
    # of this checkout): a patch-only change bumps their revision, which the fastrdp packages'
    # dependency ranges do not force.
    - name: Upgrade vendored packages older than these roles
      ansible.builtin.apt:
        name: "{{ item.1 }}"
        state: latest
        only_upgrade: true
        update_cache: true
        cache_valid_time: 0
      loop: "{{ fastrdp_outdated_pkgs.stdout_lines | map('split') | selectattr('0', 'defined') | selectattr('0', 'eq', 'vendored') | list }}"
      loop_control:
        label: "{{ item.1 }} {{ item.2 }}"
      notify: [Restart fastrdp-proxy, Restart xrdp]

    # If the repository has nothing newer, stop here: newer roles would write settings the
    # installed packages reject. (Check mode upgrades nothing, so nothing to check.)
    - name: Installed fastrdp packages after the upgrade
      ansible.builtin.script: "{{ fastrdp_outdated_cmd }}"
      register: fastrdp_outdated_after
      changed_when: false
      when: fastrdp_outdated_pkgs.stdout_lines | map('split') | selectattr('0', 'defined') | list | length > 0 and not ansible_check_mode

    - name: Installed fastrdp packages are not older than these roles
      vars:
        still: "{{ fastrdp_outdated_after.stdout_lines | map('split') | selectattr('0', 'defined') | list }}"
      ansible.builtin.assert:
        that: still | length == 0
        fail_msg: >-
          Still older than these roles after the upgrade:
          {% for p in still %}{{ p[1] }} {{ p[2] }} (needs {{ p[3] }}){{ '.' if loop.last else ',' }} {% endfor %}
          The {{ fastrdp_apt_suite }} suite of {{ fastrdp_apt_repo_url }} has no newer version yet
          (release not published, or not live on GitHub Pages yet: the pages workflow of the
          repository waits up to 15 minutes for it and fails if it does not go live).
          Retry later, use channel testing for a checkout of main, or check out the tag of the
          installed version (git checkout v<version>).
        quiet: true
      when: fastrdp_outdated_after is not skipped
