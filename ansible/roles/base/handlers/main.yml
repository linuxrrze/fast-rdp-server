---
- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Apply sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-fastrdp.conf
  changed_when: true

- name: Remount proc
  ansible.builtin.command: mount -o remount /proc  # noqa: command-instead-of-module - remount only, fstab is managed by the task
  changed_when: true

- name: Restart fastrdp-proxy
  ansible.builtin.service:
    name: fastrdp-proxy
    state: restarted
  failed_when: false
