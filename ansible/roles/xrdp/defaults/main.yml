---
# Versions, checksums and patches: third_party/sources.yml + patches/{xrdp,xorgxrdp}/
# (shared with the fastrdp-xrdp package and CI). Rebuild when any of them changes.
fastrdp_xrdp_src_dir: /usr/local/src/fastrdp/vendor
fastrdp_xrdp_build_key: "{{ lookup('ansible.builtin.pipe', playbook_dir ~ '/../third_party/build-key.sh xrdp') }}"
# glamor = Xorg renders with the GPU (Mesa drivers). NVIDIA's GBM path is
# experimental in xorgxrdp; VirtualGL is the default there.
fastrdp_xorgxrdp_glamor: "{{ fastrdp_gpu_effective == 'mesa' or fastrdp_xorgxrdp_nvidia_glamor | bool }}"
fastrdp_xorgxrdp_nvidia_glamor: false
fastrdp_xorgxrdp_drm_device: /dev/dri/renderD128
# LAB ONLY patch for fastrdp_xorgxrdp_lab_gfxpro_no_tile_skip (roles/common, backlog A9)
fastrdp_xorgxrdp_lab_gfxpro_patch: "{{ playbook_dir }}/../patches/xorgxrdp-lab/0001-gfxpro-no-tile-skip.patch"
# H.264 encoder for xrdp sessions:
#   auto  = nvenc on NVIDIA, vaapi on Intel/AMD, x264 otherwise
#   vaapi | nvenc | qsv = FFmpeg hardware encoder (fastrdp patch, falls back to libx264
#                         if the GPU/driver is not usable at start-up)
#   x264  = upstream software encoder
fastrdp_xrdp_h264_encoder: auto
fastrdp_xrdp_h264_encoder_effective: >-
  {{ fastrdp_xrdp_h264_encoder if fastrdp_xrdp_h264_encoder != 'auto'
     else ('nvenc' if fastrdp_gpu_effective == 'nvidia'
           else ('vaapi' if fastrdp_gpu_effective == 'mesa' else 'x264')) }}
# FFmpeg rate control for the hardware encoders: constant quality on the LAN,
# capped bitrates (kbit/s) elsewhere, like the x264 profiles below.
fastrdp_ffmpeg_qp: 23
fastrdp_ffmpeg_gop: 300
# H.264 (x264) settings, see gfx.toml(5)
fastrdp_x264_preset: ultrafast
fastrdp_x264_fps: 60
fastrdp_xrdp_max_sessions: 100
# Disconnected sessions are kept (reconnect); kill after N minutes, 0 = never.
fastrdp_xrdp_disconnected_time_limit: 0
fastrdp_xrdp_build_packages: >-
  {{ lookup('ansible.builtin.pipe', playbook_dir ~ '/../third_party/build-xrdp.sh --deps').split()
     + ['curl', 'ca-certificates'] }}
fastrdp_xrdp_runtime_packages: [xserver-xorg-core, fuse3, dbus-x11, xauth]
# Audio in xrdp sessions (fastrdp_audio, roles/common; docs/audio.md): PipeWire with its
# xrdp module. pipewire-module-xrdp: Debian 13 main, Ubuntu 26.04 universe; it only
# suggests pipewire-bin (pw-cli, pw-metadata), which its loader script needs.
# pulseaudio-utils: pactl, with which the loader makes xrdp-sink/xrdp-source the defaults.
fastrdp_xrdp_audio_packages: [pipewire, pipewire-bin, wireplumber, pipewire-pulse, pipewire-module-xrdp, pulseaudio-utils]
