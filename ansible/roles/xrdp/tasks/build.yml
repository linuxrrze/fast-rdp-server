---
- name: Already built?
  ansible.builtin.stat:
    path: "{{ fastrdp_build_stamp }}"
  register: fastrdp_xrdp_stamp

- name: Build
  when: not fastrdp_xrdp_stamp.stat.exists
  block:
    - name: Build inputs (sources.yml, patches, build scripts)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ fastrdp_xrdp_src_dir }}/{{ item }}"
        mode: u=rwX,g=rX,o=rX
      loop: [third_party/, patches/xrdp/]

    - name: Fetch, patch, build and install xrdp + xorgxrdp (third_party/build-xrdp.sh)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          rm -rf build
          xrdp=$(third_party/fetch.sh xrdp build)
          xorgxrdp=$(third_party/fetch.sh xorgxrdp build)
          third_party/build-xrdp.sh "$xrdp" "$xorgxrdp"
          rm -rf build
        chdir: "{{ fastrdp_xrdp_src_dir }}"
        executable: /bin/bash
      environment:
        FASTRDP_XRDP_PREFIX: /usr/local
        FASTRDP_XRDP_UNITDIR: /etc/systemd/system
        FASTRDP_XRDP_FFMPEG: "{{ '1' if fastrdp_xrdp_h264_encoder_effective != 'x264' else '0' }}"
        FASTRDP_XORGXRDP_GLAMOR: "{{ '1' if fastrdp_xorgxrdp_glamor | bool else '0' }}"
      changed_when: true

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: true

    - name: Build stamp
      ansible.builtin.file:
        path: "{{ fastrdp_build_stamp }}"
        state: touch
        mode: "0644"
      notify: Restart xrdp
