---
- name: Already built?
  ansible.builtin.stat:
    path: "{{ fastrdp_build_stamp }}"
  register: fastrdp_xrdp_stamp

- name: Build
  when: not fastrdp_xrdp_stamp.stat.exists
  block:
    - name: Build inputs (sources.yml, patches, build scripts)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ fastrdp_xrdp_src_dir }}/{{ item }}"
        mode: u=rwX,g=rX,o=rX
      loop: [third_party/, patches/xrdp/, patches/xorgxrdp-lab/]

    - name: Fetch, patch, build and install xrdp + xorgxrdp (third_party/build-xrdp.sh)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          rm -rf build
          xrdp=$(third_party/fetch.sh xrdp build)
          xorgxrdp=$(third_party/fetch.sh xorgxrdp build)
          if [ "$LAB_GFXPRO_NO_TILE_SKIP" = 1 ]; then
              echo "LAB ONLY: xorgxrdp without the progressive tile skip (backlog A9)" >&2
              patch -d "$xorgxrdp" -p1 --forward --batch -i \
                  "$PWD/patches/xorgxrdp-lab/0001-gfxpro-no-tile-skip.patch"
          fi
          if [ "$LAB_GFXPRO_FILL_TILES" = 1 ]; then
              echo "LAB ONLY: xorgxrdp filling partial progressive tiles from the screen (backlog A9)" >&2
              patch -d "$xorgxrdp" -p1 --forward --batch -i \
                  "$PWD/patches/xorgxrdp-lab/0002-gfxpro-fill-partial-tiles.patch"
          fi
          third_party/build-xrdp.sh "$xrdp" "$xorgxrdp"
          rm -rf build
        chdir: "{{ fastrdp_xrdp_src_dir }}"
        executable: /bin/bash
      environment:
        FASTRDP_XRDP_PREFIX: /usr/local
        FASTRDP_XRDP_UNITDIR: /etc/systemd/system
        FASTRDP_XRDP_FFMPEG: "{{ '1' if fastrdp_xrdp_h264_encoder_effective != 'x264' else '0' }}"
        FASTRDP_XORGXRDP_GLAMOR: "{{ '1' if fastrdp_xorgxrdp_glamor | bool else '0' }}"
        LAB_GFXPRO_NO_TILE_SKIP: "{{ '1' if fastrdp_xorgxrdp_lab_gfxpro_no_tile_skip | bool else '0' }}"
        LAB_GFXPRO_FILL_TILES: "{{ '1' if fastrdp_xorgxrdp_lab_gfxpro_fill_tiles | bool else '0' }}"
      changed_when: true

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: true

    # one stamp per installed variant: a stamp left from an earlier variant (glamor,
    # FFmpeg, the LAB ONLY xorgxrdp) must not stand for the build installed now
    - name: Stamps of earlier builds
      ansible.builtin.find:
        paths: "{{ fastrdp_xrdp_src_dir }}"
        patterns: ".installed-xrdp-*"
        hidden: true
      register: fastrdp_xrdp_old_stamps

    - name: Stamps of earlier builds removed
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ fastrdp_xrdp_old_stamps.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Build stamp
      ansible.builtin.file:
        path: "{{ fastrdp_build_stamp }}"
        state: touch
        mode: "0644"
      notify: Restart xrdp
