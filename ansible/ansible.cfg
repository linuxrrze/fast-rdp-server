[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Run notified handlers (service restarts) even when a later task fails: otherwise the
# next run finds the files unchanged and never restarts (e.g. sssd kept realm join's config).
force_handlers = True

[privilege_escalation]
become = true
