---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 Marcel Ritter <marcel@linux-ng.de>
#
# Read-only preflight checks before site.yml (docs/quickstart.md). Uses the same inventory,
# vault and SSH/sudo settings as the deployment and changes nothing on the targets: only
# facts, read-only commands (getent, ss, sysfs, timedatectl), TCP probes and HTTP GETs.
#
#   cd ansible && ansible-playbook -i inventories/<name>/hosts.yml preflight.yml [--ask-vault-pass] [-K]
#   make preflight INVENTORY=<name>
#
# Prints PASS/WARN/FAIL per check with the fix, and fails the host if any check FAILs.
- name: Preflight checks for fastrdp hosts (read-only)
  hosts: rdp_servers
  become: false
  gather_facts: true
  vars:
    # Role defaults are not loaded in this play: read them, so inventory values still win.
    preflight_role_defaults: >-
      {{ query('ansible.builtin.file', *(['common', 'base', 'gpu', 'identity', 'mfa_privacyidea', 'web_gateway', 'xrdp']
         | map('regex_replace', '^(.*)$', playbook_dir ~ '/roles/\1/defaults/main.yml')))
         | map('ansible.builtin.from_yaml') | list | ansible.builtin.combine }}
    # No usable role default (roles/common/tasks/main.yml refuses them empty).
    preflight_required_vars: [fastrdp_realm, fastrdp_domain]
    preflight_realm: "{{ fastrdp_realm | default('') }}"
    preflight_domain: "{{ fastrdp_domain | default('') | lower }}"
    # The name clients connect to: fastrdp_fqdn, else the same default as roles/common
    # (inventory name if it is an FQDN, else the fqdn fact); compared with hostname -f below.
    preflight_fqdn: >-
      {{ fastrdp_fqdn | default((inventory_hostname if inventory_hostname is match('^(?=.*[A-Za-z])[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$')
      else ansible_facts.fqdn) | lower) | lower }}
    preflight_idp: "{{ fastrdp_identity_provider | default(preflight_role_defaults.fastrdp_identity_provider) }}"
    preflight_desktops: "{{ fastrdp_desktops | default(preflight_role_defaults.fastrdp_desktops) }}"
    preflight_gpu: "{{ fastrdp_gpu | default('auto') }}"
    preflight_mfa_mode: "{{ fastrdp_mfa_mode | default('none') }}"
    # MFA modes that use privacyIDEA (web: approval on the web gateway only)
    preflight_pi_needed: "{{ preflight_mfa_mode in ['otp', 'push', 'otp_or_push', 'push_or_web'] }}"
    preflight_kdc_enforced: >-
      {{ (fastrdp_mfa_nla_kdc_enforced | default(preflight_role_defaults.fastrdp_mfa_nla_kdc_enforced) | bool)
         and preflight_mfa_mode != 'none' }}
    preflight_kdc_evidence: "{{ fastrdp_mfa_kdc_evidence_as_mfa | default(preflight_role_defaults.fastrdp_mfa_kdc_evidence_as_mfa) }}"
    # fastrdp-freerdp3 with patches/freerdp/0005 (the acceptor keeps the KDC evidence of the
    # ticket); older packages never pass it to the broker
    preflight_kdc_evidence_min_freerdp: 3.32.2-4
    preflight_listen_port: "{{ fastrdp_listen_port | default(3389) | int }}"
    preflight_xrdp_port: "{{ fastrdp_xrdp_port | default(3390) | int }}"
    preflight_port_range: "{{ fastrdp_backend_port_range | default([33900, 34899]) }}"
    preflight_cert_src: "{{ fastrdp_front_cert_src | default('') }}"
    preflight_key_src: "{{ fastrdp_front_key_src | default('') }}"
    preflight_install_method: "{{ fastrdp_install_method | default(preflight_role_defaults.fastrdp_install_method) }}"
    preflight_apt_repo_url: "{{ fastrdp_apt_repo_url | default(preflight_role_defaults.fastrdp_apt_repo_url) }}"
    preflight_apt_channel: "{{ fastrdp_apt_channel | default(preflight_role_defaults.fastrdp_apt_channel) }}"
    # Same expressions as the base role defaults (fastrdp_apt_suite, fastrdp_apt_key_url).
    preflight_apt_suite: "{{ fastrdp_apt_suite | default(ansible_facts.distribution_release ~ '-' ~ preflight_apt_channel) }}"
    preflight_apt_key_url: "{{ fastrdp_apt_key_url | default(preflight_apt_repo_url ~ '/fast-rdp-server-archive-keyring.asc') }}"
    preflight_web_enabled: "{{ fastrdp_web_enabled | default(preflight_role_defaults.fastrdp_web_enabled) | bool }}"
    preflight_web_issuer: "{{ fastrdp_web_oidc_issuer | default(preflight_role_defaults.fastrdp_web_oidc_issuer) | regex_replace('/+$', '') }}"
    preflight_web_ca_src: "{{ fastrdp_web_oidc_ca_src | default(preflight_role_defaults.fastrdp_web_oidc_ca_src) }}"
    preflight_web_secret: "{{ fastrdp_web_oidc_client_secret | default(vault_fastrdp_web_oidc_client_secret | default('')) }}"
    preflight_web_required_acr: "{{ fastrdp_web_required_acr | default(preflight_role_defaults.fastrdp_web_required_acr) }}"
    # Ansible configures Keycloak's MFA flow for acr=mfa (web_gateway, tasks/keycloak_passkeys.yml)
    preflight_web_passkeys: "{{ fastrdp_web_passkeys | default(preflight_role_defaults.fastrdp_web_passkeys) | bool }}"
    preflight_keycloak_admin_secret: >-
      {{ fastrdp_keycloak_admin_client_secret | default(vault_fastrdp_keycloak_admin_client_secret | default('')) }}
    preflight_keycloak_admin_user: "{{ fastrdp_keycloak_admin_user | default('') }}"
    preflight_keycloak_admin_password: >-
      {{ fastrdp_keycloak_admin_password | default(vault_fastrdp_keycloak_admin_password | default('')) }}
    preflight_kdcproxy: "{{ fastrdp_web_kdcproxy | default(preflight_role_defaults.fastrdp_web_kdcproxy) | bool }}"
    preflight_kdcproxy_kdcs: "{{ fastrdp_web_kdcproxy_kdcs | default(preflight_role_defaults.fastrdp_web_kdcproxy_kdcs) }}"
    preflight_kdcproxy_kpasswd: "{{ fastrdp_web_kdcproxy_kpasswd | default(preflight_role_defaults.fastrdp_web_kdcproxy_kpasswd) | bool }}"
    preflight_pi_url: "{{ fastrdp_privacyidea_url | default('') | regex_replace('/+$', '') }}"
    preflight_pi_ca_src: "{{ fastrdp_privacyidea_ca_src | default('') }}"
    preflight_pi_verify: "{{ fastrdp_privacyidea_verify_tls | default(preflight_role_defaults.fastrdp_privacyidea_verify_tls) | bool }}"
    preflight_keytab_src: "{{ fastrdp_termsrv_keytab_src | default(preflight_role_defaults.fastrdp_termsrv_keytab_src) }}"
    preflight_render_world: "{{ fastrdp_render_nodes_world_accessible | default(preflight_role_defaults.fastrdp_render_nodes_world_accessible) | bool }}"
    preflight_drm_device: "{{ fastrdp_xorgxrdp_drm_device | default(preflight_role_defaults.fastrdp_xorgxrdp_drm_device) }}"
    preflight_override_homedir: "{{ fastrdp_sssd_override_homedir | default(preflight_role_defaults.fastrdp_sssd_override_homedir) }}"
    preflight_autofs: "{{ fastrdp_autofs | default(preflight_role_defaults.fastrdp_autofs) }}"
    preflight_smb_homes: "{{ fastrdp_smb_krb5_homes | default(preflight_role_defaults.fastrdp_smb_krb5_homes) | bool }}"
    preflight_smb_mounts: "{{ fastrdp_smb_mounts | default(preflight_role_defaults.fastrdp_smb_mounts) }}"
    # Rough sizing of the server itself; sessions need more (detail line of the check).
    preflight_heavy_desktops: "{{ preflight_desktops | intersect(['gnome', 'plasma', 'plasma-x11', 'cinnamon']) | length > 0 }}"
    preflight_min_ram_mb: "{{ 4096 if preflight_heavy_desktops else 2048 }}"
    preflight_rec_ram_mb: "{{ 16384 if preflight_heavy_desktops else 8192 }}"
    preflight_min_vcpus: 2
    preflight_rec_vcpus: "{{ 8 if preflight_heavy_desktops else 4 }}"
    preflight_min_disk_gb: "{{ 10 if preflight_install_method == 'build' else 5 }}"
  tasks:
    - name: Start with an empty report
      ansible.builtin.set_fact:
        preflight_results: []

    # ------------------------------------------------------------------ inventory
    - name: Result - required inventory variables
      vars:
        missing: >-
          {{ ((preflight_required_vars
               + (['fastrdp_privacyidea_url'] if preflight_pi_needed else []))
              | difference(query('ansible.builtin.varnames', '^fastrdp_')))
             + (['vault_fastrdp_join_password (vault.yml)']
                if preflight_idp in ['ad', 'ipa'] and vault_fastrdp_join_password | default('') | length == 0
                   and fastrdp_join_password | default(vault_fastrdp_join_password | default('')) | length == 0 else [])
             | sort }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'inventory variables',
             'status': 'FAIL' if missing else 'PASS',
             'detail': ('missing: ' ~ missing | join(', ')) if missing else 'all required variables set',
             'fix': 'run scripts/fastrdp-setup, or add them to group_vars (see inventories/lab)'}] }}

    - name: Result - identity settings
      vars:
        problems: >-
          {{ ([] if preflight_idp in ['ad', 'ipa', 'none'] else ['fastrdp_identity_provider must be ad, ipa or none'])
             + ([] if preflight_realm == preflight_realm | upper else ['fastrdp_realm should be upper case'])
             + (['AD realm must be the DNS domain in upper case (' ~ preflight_domain | upper ~ ')']
                if preflight_idp == 'ad' and preflight_realm != preflight_domain | upper else [])
             + (['join password is empty: is vault.yml loaded (--ask-vault-pass)?']
                if preflight_idp in ['ad', 'ipa'] and fastrdp_join_password | default(vault_fastrdp_join_password | default('')) | length == 0 else [])
             + (['fastrdp_default_desktop is not in fastrdp_desktops']
                if fastrdp_default_desktop | default(preflight_role_defaults.fastrdp_default_desktop) not in preflight_desktops else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'identity/desktop settings',
             'status': 'FAIL' if problems else 'PASS',
             'detail': problems | join('; ') if problems else preflight_idp ~ ' realm ' ~ preflight_realm,
             'fix': 'correct group_vars/all/main.yml (or vault.yml)'}] }}

    # ------------------------------------------------------------------ OS
    - name: Result - operating system
      vars:
        supported: >-
          {{ (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('26.04', '>='))
             or (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 13) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'operating system',
             'status': 'PASS' if supported else 'FAIL',
             'detail': ansible_facts.distribution ~ ' ' ~ ansible_facts.distribution_version ~ ' (' ~ ansible_facts.distribution_release ~ ', '
                       ~ ansible_facts.architecture ~ ')',
             'fix': 'install Ubuntu 26.04 or Debian 13 (amd64)'}] }}

    # sudo-rs (Ubuntu 26.04's default sudo) does not show Ansible's password prompt: with -K the
    # task times out (reported as unreachable). Classic sudo is installed next to it as sudo.ws.
    - name: Which sudo is installed (no privileges needed)
      ansible.builtin.command: sudo --version
      register: preflight_sudo_version
      changed_when: false
      failed_when: false

    - name: Look for classic sudo next to sudo-rs
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: preflight_sudo_ws

    - name: Run a no-op command as root
      ansible.builtin.command: /usr/bin/true
      become: true
      changed_when: false
      register: preflight_become
      ignore_errors: true         # evaluated below; a FAIL line instead of an aborted play
      ignore_unreachable: true    # a privilege escalation timeout counts as unreachable

    - name: Result - sudo
      vars:
        become_failed: "{{ preflight_become.failed | default(false) or preflight_become.unreachable | default(false) }}"
        sudo_rs: "{{ (preflight_sudo_version.stdout | default('')) is search('sudo-rs') }}"
        sudo_exe: "{{ ansible_become_exe | default('sudo') }}"
        hints: >-
          {{ (['sudo is sudo-rs, which never shows the password prompt Ansible waits for: set ansible_become_exe: sudo.ws (classic sudo) in hosts.yml'
               ~ ('' if preflight_sudo_ws.stat.exists | default(false) else ' (install the sudo package first)')]
              if sudo_rs and sudo_exe == 'sudo' else [])
             + ['pass the sudo password: make preflight/deploy ... ANSIBLE_ARGS=-K (ansible-playbook -K)',
                'or allow the SSH user passwordless sudo'] }}
      ansible.builtin.set_fact:
        preflight_become_failed: "{{ become_failed }}"
        preflight_results: >-
          {{ preflight_results + [{'check': 'sudo',
             'status': 'FAIL' if become_failed else 'PASS',
             'detail': ((preflight_become.msg | default('become failed') | split() | join(' ') | truncate(160)) if become_failed else 'become works')
                       ~ (' (' ~ ((preflight_sudo_version.stdout_lines | default([])) + ['no sudo found']) | first ~ ', ansible_become_exe ' ~ sudo_exe ~ ')'),
             'fix': hints | join('; ') if become_failed else ''}] }}

    # ------------------------------------------------------------------ name and DNS
    - name: The host's own name (hostname -f)
      ansible.builtin.command: hostname -f
      register: preflight_hostname_f
      changed_when: false
      failed_when: false

    - name: Resolve the FQDN on the target (NSS, as Kerberos and sssd see it)
      ansible.builtin.command: getent ahosts {{ preflight_fqdn }}
      register: preflight_fwd
      changed_when: false
      failed_when: false

    - name: Resolve the FQDN from the admin machine (as clients see it)
      ansible.builtin.command: getent ahosts {{ preflight_fqdn }}
      register: preflight_fwd_ctl
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: Result - FQDN and forward DNS
      vars:
        addrs: "{{ preflight_fwd.stdout_lines | map('split') | map('first') | unique | list }}"
        nonloop: "{{ addrs | reject('match', '^(127\\.|::1$)') | list }}"
        own: "{{ ansible_facts.all_ipv4_addresses | default([]) + ansible_facts.all_ipv6_addresses | default([]) }}"
        host_f: "{{ (preflight_hostname_f.stdout | default('')) | trim | lower }}"
        fact: "{{ ansible_facts.fqdn | lower }}"
        problems: >-
          {{ (['hostname is not fully qualified (' ~ preflight_fqdn ~ ')'] if '.' not in preflight_fqdn else [])
             + (['the RDP name is the bare domain ' ~ preflight_domain ~ ' (TERMSRV/' ~ preflight_domain ~ ')']
                if preflight_fqdn == preflight_domain else [])
             + (['clients will connect to ' ~ preflight_fqdn ~ ' (inventory name), but the host calls itself '
                 ~ (host_f or '?') ~ ' (hostname -f)'] if host_f != preflight_fqdn else [])
             + (['the fqdn fact of Ansible (reverse lookup of the host name) is ' ~ fact ~ ', not ' ~ preflight_fqdn
                 ~ ': a PTR record or /etc/hosts line gives the wrong name'] if fact != preflight_fqdn else [])
             + (['FQDN does not resolve on the host'] if preflight_fwd.rc != 0 else [])
             + (['FQDN resolves only to loopback ' ~ addrs | join(',')] if preflight_fwd.rc == 0 and not nonloop else [])
             + (['FQDN does not resolve from the admin machine'] if preflight_fwd_ctl.rc != 0 else []) }}
        warnings: >-
          {{ (['FQDN is not in the realm domain ' ~ preflight_domain]
                if preflight_idp in ['ad', 'ipa'] and not preflight_fqdn.endswith('.' ~ preflight_domain) else [])
             + (['short name ' ~ ansible_facts.hostname ~ ' is longer than 15 characters (AD truncates the computer account)']
                if preflight_idp == 'ad' and ansible_facts.hostname | length > 15 else [])
             + (['FQDN resolves to ' ~ nonloop | join(',') ~ ', which is not an address of this host (NAT?)']
                if nonloop and not (nonloop | intersect(own)) else []) }}
      ansible.builtin.set_fact:
        preflight_first_ip: "{{ nonloop | first | default('') }}"
        preflight_results: >-
          {{ preflight_results + [{'check': 'FQDN / forward DNS',
             'status': 'FAIL' if problems else ('WARN' if warnings else 'PASS'),
             'detail': (problems + warnings) | join('; ') if (problems + warnings) else preflight_fqdn ~ ' -> ' ~ addrs | join(','),
             'fix': 'set the hostname to the FQDN (hostnamectl set-hostname ' ~ preflight_fqdn ~ '), add an A/AAAA record '
                    ~ 'and a PTR record for it, and replace a 127.0.1.1 line in /etc/hosts by "<address> '
                    ~ preflight_fqdn ~ ' <short name>" (or set fastrdp_fqdn)'}] }}

    - name: Reverse lookup of the host address
      ansible.builtin.command: getent hosts {{ preflight_first_ip }}
      register: preflight_rev
      changed_when: false
      failed_when: false
      when: preflight_first_ip | length > 0

    - name: Result - reverse DNS
      vars:
        names: "{{ (preflight_rev.stdout | default('')).split()[1:] | map('lower') | list }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'reverse DNS',
             'status': 'SKIP' if not preflight_first_ip else ('PASS' if preflight_fqdn | lower in names else 'WARN'),
             'detail': 'no address to check' if not preflight_first_ip
                       else preflight_first_ip ~ ' -> ' ~ (names | join(',') if names else 'no PTR record'),
             'fix': 'add a PTR record ' ~ preflight_first_ip ~ ' -> ' ~ preflight_fqdn
                    ~ ' (Kerberos here does not need it, but FreeIPA and some clients do)'}] }}

    # ------------------------------------------------------------------ time
    - name: Read clock and NTP state
      ansible.builtin.command: timedatectl show -p NTPSynchronized --value
      register: preflight_ntp
      changed_when: false
      failed_when: false

    - name: Read the target clock
      ansible.builtin.command: date +%s
      register: preflight_epoch
      changed_when: false

    - name: Result - time
      vars:
        skew: "{{ ((preflight_epoch.stdout | int) - (now().timestamp() | int)) | abs }}"
        synced: "{{ preflight_ntp.stdout | trim == 'yes' }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'time sync',
             'status': 'FAIL' if skew | int > 300 else ('WARN' if skew | int > 60 or not synced else 'PASS'),
             'detail': 'offset to the admin machine ' ~ skew ~ ' s, NTP synchronized: ' ~ (preflight_ntp.stdout | trim or 'unknown'),
             'fix': 'Kerberos allows 5 min skew: set the clock and point chrony at your DCs/NTP servers '
                    ~ '(the playbook installs and enables chrony)'}] }}

    # ------------------------------------------------------------------ Kerberos / directory
    - name: Look up KDC and LDAP SRV records and probe them
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          lookup() {
              if command -v dig >/dev/null 2>&1; then dig +short +time=3 +tries=1 SRV "$1"
              elif command -v host >/dev/null 2>&1; then host -W 3 -t SRV "$1"
              elif command -v resolvectl >/dev/null 2>&1; then resolvectl query --legend=no -t SRV "$1" 2>/dev/null
              elif command -v nslookup >/dev/null 2>&1; then nslookup -type=SRV "$1"
              else echo NOTOOL; fi
          }
          for spec in $SRV_SPECS; do
              name=${spec%%=*}
              out=$(lookup "$name")
              if [ "$out" = NOTOOL ]; then echo "NOTOOL $name"; continue; fi
              # "<prio> <weight> <port> <target>" in the output of every tool
              recs=$(grep -oE '[0-9]+ [0-9]+ [0-9]+ [A-Za-z0-9._-]+' <<<"$out" | head -n 5 || true)
              if [ -z "$recs" ]; then echo "NONE $name"; continue; fi
              while read -r _ _ port target; do
                  target=${target%.}
                  if timeout 3 bash -c "exec 3<>/dev/tcp/$target/$port" 2>/dev/null; then st=open; else st=closed; fi
                  echo "SRV $name $target $port $st"
              done <<<"$recs"
          done
      environment:
        SRV_SPECS: >-
          _kerberos._tcp.{{ preflight_domain }}{{ (' _ldap._tcp.' ~ preflight_domain) if preflight_idp in ['ad', 'ipa'] else '' }}
      register: preflight_srv
      changed_when: false
      failed_when: false
      when: preflight_domain | length > 0

    - name: Result - Kerberos KDC and directory
      vars:
        out: "{{ preflight_srv.stdout_lines | default([]) }}"
        kdc_all: "{{ out | select('match', '^SRV _kerberos') | list }}"
        kdc_open: "{{ kdc_all | select('search', ' open$') | list }}"
        ldap_all: "{{ out | select('match', '^SRV _ldap') | list }}"
        ldap_open: "{{ ldap_all | select('search', ' open$') | list }}"
        notool: "{{ out | select('match', '^NOTOOL') | list | length > 0 }}"
        problems: >-
          {{ (['no _kerberos._tcp.' ~ preflight_domain ~ ' SRV records'] if not kdc_all and not notool else [])
             + (['no KDC reachable on TCP ' ~ kdc_all | map('split') | map(attribute=2) | join(',')] if kdc_all and not kdc_open else [])
             + (['no _ldap._tcp SRV records'] if preflight_idp in ['ad', 'ipa'] and not ldap_all and not notool else [])
             + (['no LDAP server reachable'] if ldap_all and not ldap_open else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'realm / KDC',
             'status': 'SKIP' if not preflight_domain else ('FAIL' if problems else ('WARN' if notool else 'PASS')),
             'detail': 'fastrdp_domain not set' if not preflight_domain else
                       (problems | join('; ') if problems else
                       ('no SRV lookup tool (dig/host/resolvectl/nslookup) on the host' if notool else
                       'KDC ' ~ kdc_open | map('split') | map(attribute=2) | unique | join(',')
                       ~ ((', LDAP ' ~ ldap_open | map('split') | map(attribute=2) | unique | join(',')) if ldap_open else ''))),
             'fix': 'krb5.conf finds KDCs via DNS SRV only: use the AD/IPA DNS servers as the host resolver '
                    ~ '(or add _kerberos._tcp SRV records), and open TCP 88 (and 389) to the KDCs'}] }}

    - name: Look for an existing TERMSRV keytab and sssd.conf (provider none)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/fastrdp/termsrv.keytab, /etc/sssd/sssd.conf]
      become: true
      register: preflight_none_files
      when:
        - preflight_idp == 'none'
        - not preflight_become_failed | default(false)

    - name: Result - keytab and sssd.conf for provider none
      vars:
        on_host: "{{ preflight_none_files.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists')
                     | map(attribute='item') | list }}"
        keytab_ok: "{{ (preflight_keytab_src | length > 0 and preflight_keytab_src is file) or '/etc/fastrdp/termsrv.keytab' in on_host }}"
        sssd_ok: "{{ '/etc/sssd/sssd.conf' in on_host }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'keytab / sssd.conf',
             'status': 'PASS' if keytab_ok and sssd_ok else ('WARN' if preflight_become_failed | default(false) else 'FAIL'),
             'detail': 'TERMSRV keytab ' ~ ('found' if keytab_ok else 'missing (fastrdp_termsrv_keytab_src or /etc/fastrdp/termsrv.keytab)')
                       ~ ', /etc/sssd/sssd.conf ' ~ ('found' if sssd_ok else 'missing')
                       ~ (' (files on the host not checked: sudo failed)' if preflight_become_failed | default(false) else ''),
             'fix': 'provider none: create TERMSRV/' ~ preflight_fqdn ~ ' in your KDC, export the keytab and set '
                    ~ 'fastrdp_termsrv_keytab_src; install an sssd.conf for your LDAP'}] }}
      when: preflight_idp == 'none'

    # ------------------------------------------------------------------ home directories
    # The broker refuses logins whose home has a missing parent (e.g. the directory says
    # /autofs/srv/home/<user> and autofs is not set up) and creates only a missing last
    # component. Samples fastrdp_preflight_user (inventory or -e) and the join account,
    # never enumerates the directory; stat as the SSH user with a time limit (hung NFS).
    - name: Look at the home directories the directory reports
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          export LC_ALL=C
          # probe PATH: OK, NOTDIR, or MISSING/HUNG/NOACCESS and the first such path component
          probe() {
              local rest=${1#/} prefix="" part out="directory" rc
              while [ -n "$rest" ]; do
                  part=${rest%%/*}
                  if [ "$part" = "$rest" ]; then rest=""; else rest=${rest#*/}; fi
                  [ -n "$part" ] || continue
                  prefix="$prefix/$part"
                  out=$(timeout 5 stat -L -c %F -- "$prefix" 2>&1); rc=$?
                  if [ "$rc" -eq 124 ]; then printf 'HUNG\t%s\n' "$prefix"; return; fi
                  if [ "$rc" -ne 0 ]; then
                      case $out in
                          *"No such file"*) printf 'MISSING\t%s\n' "$prefix" ;;
                          *) printf 'NOACCESS\t%s\n' "$prefix" ;;
                      esac
                      return
                  fi
              done
              if [ "$out" = directory ]; then printf 'OK\t%s\n' "$1"; else printf 'NOTDIR\t%s\n' "$1"; fi
          }
          is_autofs() {
              awk -v p="$1" '{ for (i = 7; i <= NF; i++) if ($i == "-") { if ($(i + 1) == "autofs" && $5 == p) f = 1; break } }
                  END { exit !f }' /proc/self/mountinfo
          }
          below_roots() {   # below_roots DIR: DIR is a root of CREATE_ROOTS or below one
              local root
              for root in $CREATE_ROOTS; do
                  case $1/ in "$root"/*) return 0 ;; esac
              done
              return 1
          }
          sample() {   # sample USER SEVERITY-WHEN-BROKEN
              local u=$1 sev=$2 entry home state path
              if ! entry=$(getent passwd "$u"); then
                  [ "$sev" = FAIL ] && echo "WARN fastrdp_preflight_user $u not found (host not joined yet?): homes not sampled"
                  return
              fi
              home=$(cut -d: -f6 <<<"$entry")
              IFS=$'\t' read -r state path < <(probe "$home")
              case $state in
                  OK) echo "INFO $u: $home exists" ;;
                  NOTDIR) echo "$sev $u: home $home is not a directory" ;;
                  HUNG) echo "WARN $u: stat $path did not answer within 5 s (hung NFS server or automount?)" ;;
                  NOACCESS) echo "INFO $u: $path not readable as $(id -un) (fine for Kerberized NFS homes)" ;;
                  MISSING)
                      if [ "$path" = "$home" ]; then
                          if is_autofs "$(dirname "$home")"; then
                              echo "WARN $u: $home missing below the automount point $(dirname "$home") (no map entry?)"
                          elif ! below_roots "$(dirname "$home")"; then
                              echo "WARN $u: $home missing, outside fastrdp_home_create_roots (${CREATE_ROOTS:-none}): refused until it exists"
                          else
                              echo "INFO $u: $home missing; the broker creates it at the first login"
                          fi
                      elif [ -n "$OVERRIDE" ]; then
                          echo "INFO $u: directory home $home has no $path here; fastrdp_sssd_override_homedir replaces it"
                      elif [ "$AUTOFS" != none ]; then
                          echo "WARN $u: home $home: $path does not exist yet; fastrdp_autofs: $AUTOFS sets up autofs, check again after the deployment"
                      else
                          echo "$sev $u: home $home: $path does not exist (automount not set up?); the broker refuses logins of such users"
                      fi ;;
              esac
          }
          [ -n "$TEST_USER" ] && sample "$TEST_USER" FAIL
          [ -n "$JOIN_USER" ] && [ "$JOIN_USER" != "$TEST_USER" ] && sample "$JOIN_USER" WARN
          if [ -n "$OVERRIDE" ]; then
              static=${OVERRIDE%%\%*}
              static=${static%/*}
              IFS=$'\t' read -r state path < <(probe "${static:-/}")
              case $state in
                  OK) echo "INFO override_homedir $OVERRIDE: $static exists" ;;
                  HUNG) echo "WARN override_homedir: stat $path did not answer within 5 s" ;;
                  NOACCESS) echo "INFO override_homedir: $path not readable as $(id -un)" ;;
                  *) echo "FAIL fastrdp_sssd_override_homedir $OVERRIDE: $path does not exist (or is no directory)" ;;
              esac
              below_roots "${static:-/}" \
                  || echo "WARN override_homedir $OVERRIDE outside fastrdp_home_create_roots (${CREATE_ROOTS:-none}): not created"
              case ${OVERRIDE#"$static"/} in
                  */*) echo "WARN fastrdp_sssd_override_homedir $OVERRIDE: the broker creates only the last component; create the directories above it" ;;
              esac
          fi
          [ -z "$TEST_USER$OVERRIDE" ] && echo "INFO no user sampled (set fastrdp_preflight_user to a directory user)"
          exit 0
      environment:
        TEST_USER: "{{ fastrdp_preflight_user | default('') }}"
        JOIN_USER: "{{ (fastrdp_join_user | default(preflight_role_defaults.fastrdp_join_user)) if preflight_idp in ['ad', 'ipa'] else '' }}"
        OVERRIDE: "{{ preflight_override_homedir }}"
        AUTOFS: "{{ preflight_autofs }}"
        CREATE_ROOTS: "{{ fastrdp_home_create_roots | default(preflight_role_defaults.fastrdp_home_create_roots) | join(' ') }}"
      register: preflight_homes
      changed_when: false
      failed_when: false

    - name: Result - home directories
      vars:
        out: "{{ preflight_homes.stdout_lines | default([]) }}"
        errs: "{{ out | select('match', '^FAIL ') | map('regex_replace', '^FAIL ', '') | list }}"
        warns: "{{ out | select('match', '^WARN ') | map('regex_replace', '^WARN ', '') | list }}"
        infos: "{{ out | select('match', '^INFO ') | map('regex_replace', '^INFO ', '') | list }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'home directories',
             'status': 'FAIL' if errs else ('WARN' if warns else 'PASS'),
             'detail': ((errs + warns) if (errs + warns) else infos) | join('; ')
                       or 'not checked: ' ~ (preflight_homes.stderr | default('no output') | truncate(120)),
             'fix': 'set up the automounter (fastrdp_autofs: sssd for directory maps, or files) so the home paths '
                    ~ 'from the directory exist, or use local homes (fastrdp_sssd_override_homedir: /home/%u); '
                    ~ 'docs/nfs-kerberos-homes.md#where-homes-are'}] }}

    # ------------------------------------------------------------------ SMB homes
    # fastrdp_smb_krb5_homes: cifs.upcall falls back to GSSAPI (gssproxy) since cifs-utils
    # 7.0; the file servers must resolve by the name of their cifs/ principal.
    - name: Look at the SMB client packages and file servers
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          ver() { apt-cache policy "$1" 2>/dev/null | awk -v k="$2:" '$1 == k { print $2; exit }'; }
          v=$(ver cifs-utils Installed)
          [ -z "$v" ] || [ "$v" = "(none)" ] && v=$(ver cifs-utils Candidate)
          if [ -z "$v" ] || [ "$v" = "(none)" ]; then
              echo "FAIL cifs-utils not available from the configured APT sources"
          elif ! dpkg --compare-versions "$v" ge 2:7.0; then
              echo "FAIL cifs-utils $v: cifs.upcall has no GSSAPI fallback (needs 7.0 or later)"
          elif [ "$v" = "2:7.4-1+deb13u1" ]; then
              # CVE-2026-12505 fix without its follow-up "fix regression with krb5 + creduid"
              echo "WARN cifs-utils $v takes the uid from the process that triggers the upcall," \
                  "not from the key: reconnects by kernel threads may use root's credentials"
          else
              echo "INFO cifs-utils $v"
          fi
          g=$(ver gssproxy Candidate)
          [ -z "$g" ] || [ "$g" = "(none)" ] && echo "FAIL gssproxy not available from the configured APT sources"
          for s in $SERVERS; do
              if getent ahosts "$s" >/dev/null 2>&1; then
                  echo "INFO $s resolves"
              else
                  echo "FAIL file server $s does not resolve on the host"
              fi
          done
          [ "$FQN" = "true" ] && echo "WARN fastrdp_sssd_fully_qualified_names: gssproxy impersonates <user@domain>@<realm>; test it, or use short names"
          exit 0
      environment:
        SERVERS: "{{ preflight_smb_mounts | map(attribute='what', default='') | map('regex_replace', '^//([^/]+)/.*$', '\\1') | unique | join(' ') }}"
        FQN: "{{ fastrdp_sssd_fully_qualified_names | default(preflight_role_defaults.fastrdp_sssd_fully_qualified_names) | string | lower }}"
      register: preflight_smb
      changed_when: false
      failed_when: false
      when: preflight_smb_homes

    - name: Result - SMB homes
      vars:
        out: "{{ preflight_smb.stdout_lines | default([]) }}"
        errs: "{{ out | select('match', '^FAIL ') | map('regex_replace', '^FAIL ', '') | list }}"
        warns: "{{ out | select('match', '^WARN ') | map('regex_replace', '^WARN ', '') | list }}"
        infos: "{{ out | select('match', '^INFO ') | map('regex_replace', '^INFO ', '') | list }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'SMB homes',
             'status': 'FAIL' if errs else ('WARN' if warns else 'PASS'),
             'detail': ((errs + warns) if (errs + warns) else infos) | join('; ')
                       or 'not checked: ' ~ (preflight_smb.stderr | default('no output') | truncate(120)),
             'fix': 'cifs-utils 7.0 or later (Debian 13, Ubuntu 26.04), file servers by FQDN in DNS; the delegation '
                    ~ 'to cifs/<server> is set in the directory: docs/smb-kerberos-homes.md'}] }}
      when: preflight_smb_homes

    # ------------------------------------------------------------------ ports
    - name: List listening TCP ports (/proc/net, no iproute2 needed)
      ansible.builtin.command:
        argv: [awk, 'FNR > 1 && $4 == "0A" { split($2, a, ":"); print a[2] }', /proc/net/tcp, /proc/net/tcp6]
      register: preflight_ss
      changed_when: false
      failed_when: false

    - name: Which related services are running
      ansible.builtin.service_facts:

    - name: Result - ports
      vars:
        listening: "{{ preflight_ss.stdout_lines | map('int', base=16) | unique | list }}"
        services: "{{ ansible_facts.services | default({}) }}"
        active: >-
          {{ ['fastrdp-proxy', 'xrdp', 'nginx']
             | select('in', services | dict2items | selectattr('value.state', 'eq', 'running')
                            | map(attribute='key') | map('regex_replace', '\.service$', '') | list) | list }}
        ports: >-
          {{ [{'port': preflight_listen_port | int, 'owner': 'fastrdp-proxy', 'what': 'RDP'},
              {'port': preflight_xrdp_port | int, 'owner': 'xrdp', 'what': 'xrdp (loopback)'}]
             + ([{'port': 443, 'owner': 'nginx', 'what': 'web HTTPS'}, {'port': 80, 'owner': 'nginx', 'what': 'web HTTP'}]
                if preflight_web_enabled else []) }}
        busy: >-
          {{ ports | selectattr('port', 'in', listening) | rejectattr('owner', 'in', active) | list }}
        stock_xrdp: "{{ 'xrdp' in active and preflight_listen_port | int in busy | map(attribute='port') | list }}"
        in_range: >-
          {{ listening | select('ge', preflight_port_range[0] | int) | select('le', preflight_port_range[1] | int) | list }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'ports',
             'status': 'FAIL' if busy else ('WARN' if in_range else 'PASS'),
             'detail': ('in use: ' ~ busy | map(attribute='port') | join(',') ~ (' (stock xrdp on the RDP port)' if stock_xrdp else ''))
                       if busy else (('free: ' ~ ports | map(attribute='port') | join(','))
                       ~ ((', listeners in the back-end range: ' ~ in_range | join(',')) if in_range else '')),
             'fix': ('apt purge xrdp (the playbook installs its own) or ' if stock_xrdp else '')
                    ~ 'find the owner with: sudo ss -ltnp; stop it or change fastrdp_listen_port/fastrdp_backend_port_range'}] }}

    # ------------------------------------------------------------------ GPU
    - name: Read GPUs and render nodes (sysfs, /dev/dri)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          for d in /sys/bus/pci/devices/*; do
              [ -r "$d/class" ] || continue
              case $(cat "$d/class") in 0x0300*|0x0302*) echo "GPU $(cat "$d/vendor") ${d##*/}";; esac
          done
          for n in /dev/dri/renderD*; do [ -e "$n" ] && echo "NODE $(stat -c '%n %a %G' "$n")"; done
          command -v nvidia-smi >/dev/null 2>&1 && echo "NVIDIA_SMI yes"
          command -v mokutil >/dev/null 2>&1 && echo "SB $(mokutil --sb-state 2>/dev/null | head -n 1)"
          grep -rhsE '^[^#]*(non-free)' /etc/apt/sources.list /etc/apt/sources.list.d/ >/dev/null && echo "NONFREE yes"
          exit 0
      register: preflight_gpu_raw
      changed_when: false

    - name: Result - GPU
      vars:
        out: "{{ preflight_gpu_raw.stdout_lines }}"
        vendors: "{{ out | select('match', '^GPU ') | map('split') | map(attribute=1) | list }}"
        nodes: "{{ out | select('match', '^NODE ') | map('split') | list }}"
        detected: >-
          {{ 'nvidia' if '0x10de' in vendors else ('mesa' if '0x8086' in vendors or '0x1002' in vendors else 'none') }}
        effective: "{{ detected if preflight_gpu == 'auto' else preflight_gpu }}"
        secure_boot: "{{ out | select('match', '^SB .*enabled') | list | length > 0 }}"
        problems: >-
          {{ (['fastrdp_gpu is nvidia but no NVIDIA GPU was found'] if preflight_gpu == 'nvidia' and detected != 'nvidia' else [])
             + (['fastrdp_gpu is mesa but no Intel/AMD GPU was found'] if preflight_gpu == 'mesa' and '0x8086' not in vendors
                and '0x1002' not in vendors else [])
             + (['no render node ' ~ preflight_drm_device ~ ' (GPU driver not loaded)']
                if effective == 'mesa' and preflight_drm_device not in nodes | map(attribute=1) | list else []) }}
        warnings: >-
          {{ (['NVIDIA driver not installed yet: the playbook installs it, then reboot'] if effective == 'nvidia'
              and out | select('match', '^NVIDIA_SMI') | list | length == 0 else [])
             + (['Secure Boot is on: the NVIDIA kernel module must be signed/enrolled (MOK)'] if effective == 'nvidia' and secure_boot else [])
             + (['Debian: enable the non-free component for nvidia-driver'] if effective == 'nvidia' and ansible_facts.distribution == 'Debian'
                and out | select('match', '^NONFREE') | list | length == 0 else [])
             + (['render nodes are not world-accessible and fastrdp_render_nodes_world_accessible is false: sessions cannot use the GPU']
                if effective != 'none' and not preflight_render_world and nodes | rejectattr('2', 'match', '.*6$') | list else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'GPU',
             'status': 'FAIL' if problems else ('WARN' if warnings else 'PASS'),
             'detail': 'requested ' ~ preflight_gpu ~ ', detected ' ~ detected ~ ' -> ' ~ effective
                       ~ (', render nodes: ' ~ nodes | map('join', ' ') | map('regex_replace', '^NODE ', '') | join('; ') if nodes else ', no render nodes')
                       ~ (('; ' ~ (problems + warnings) | join('; ')) if (problems + warnings) else ''),
             'fix': 'set fastrdp_gpu to auto/none, or install/load the GPU driver; the gpu role makes render nodes 0666'}] }}

    # ------------------------------------------------------------------ resources
    - name: Free space on /
      ansible.builtin.command: df -Pk /
      register: preflight_df
      changed_when: false

    - name: Result - CPU, RAM and disk
      vars:
        ram: "{{ ansible_facts.memtotal_mb | int }}"
        cpus: "{{ ansible_facts.processor_vcpus | default(ansible_facts.processor_cores) | int }}"
        disk_gb: "{{ ((preflight_df.stdout_lines[-1].split()[3] | int) / 1024 / 1024) | round(1) }}"
        per_user_mb: "{{ 2048 if preflight_heavy_desktops else 1024 }}"
        users: "{{ [((ram | int) - 2048) // ([per_user_mb | int, 1] | max), 0] | max }}"
        fail: >-
          {{ ram | int < preflight_min_ram_mb | int or cpus | int < preflight_min_vcpus | int
             or disk_gb | float < preflight_min_disk_gb | float }}
        warn: "{{ ram | int < preflight_rec_ram_mb | int or cpus | int < preflight_rec_vcpus | int }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'CPU / RAM / disk',
             'status': 'FAIL' if fail else ('WARN' if warn else 'PASS'),
             'detail': cpus ~ ' vCPU, ' ~ ram ~ ' MiB RAM, ' ~ disk_gb ~ ' GiB free on / (minimum ' ~ preflight_min_vcpus ~ ' vCPU, '
                       ~ preflight_min_ram_mb ~ ' MiB, ' ~ preflight_min_disk_gb ~ ' GiB; recommended ' ~ preflight_rec_vcpus
                       ~ ' vCPU, ' ~ preflight_rec_ram_mb ~ ' MiB); rough capacity ~' ~ users ~ ' concurrent sessions of '
                       ~ preflight_desktops | join('/'),
             'fix': 'add vCPUs/RAM/disk, or offer lighter desktops (xfce, lxqt, mate)'}] }}

    # ------------------------------------------------------------------ external services
    - name: Probe privacyIDEA from the host
      ansible.builtin.uri:
        url: "{{ preflight_pi_url }}/healthz/"
        method: GET
        validate_certs: "{{ preflight_pi_verify and preflight_pi_ca_src | length == 0 }}"
        timeout: 10
      register: preflight_pi
      failed_when: false
      when: preflight_pi_needed and preflight_pi_url | length > 0

    - name: Result - privacyIDEA
      vars:
        problems: >-
          {{ (['fastrdp_privacyidea_url not set'] if not preflight_pi_url else [])
             + (['/healthz/ answered ' ~ (preflight_pi.status | default(-1)) ~ ' ' ~ (preflight_pi.msg | default('') | truncate(80))]
                if preflight_pi_url and preflight_pi.status | default(-1) != 200 else [])
             + (['CA file ' ~ preflight_pi_ca_src ~ ' not found on the admin machine']
                if preflight_pi_ca_src and preflight_pi_ca_src is not file else [])
             + (['service password empty (vault loaded?)'] if fastrdp_privacyidea_service_user | default('') | length > 0
                and fastrdp_privacyidea_service_password | default(vault_fastrdp_privacyidea_service_password | default('')) | length == 0 else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'privacyIDEA',
             'status': 'FAIL' if problems else 'PASS',
             'detail': problems | join('; ') if problems else preflight_pi_url ~ ' healthy'
                       ~ (' (TLS not verified here: CA is checked from the controller copy at deploy time)' if preflight_pi_ca_src else ''),
             'fix': 'check URL, firewall/proxy from the host to privacyIDEA, and fastrdp_privacyidea_ca_src'}] }}
      when: preflight_pi_needed

    - name: Result - MFA web approval
      vars:
        approval_timeout: >-
          {{ fastrdp_mfa_web_approval_timeout | default(preflight_role_defaults.fastrdp_mfa_web_approval_timeout) }}
        proxy_timeout: "{{ fastrdp_proxy_broker_timeout | default(preflight_role_defaults.fastrdp_proxy_broker_timeout) }}"
        # the broker's [broker] session_start_timeout (config.py, not rendered): the session
        # start follows the approval within the same proxy wait (same rule as roles/common)
        session_start: 90
        problems: >-
          {{ (['fastrdp_web_enabled is false (the approval page is on the web gateway)'] if not preflight_web_enabled else [])
             + (['fastrdp_mfa_web_approval_timeout (' ~ approval_timeout ~ ') is not whole seconds 10..510']
                if approval_timeout | string is not match('^[0-9]+$') or approval_timeout | int < 10
                   or approval_timeout | int > 510 else [])
             + (['fastrdp_proxy_broker_timeout (' ~ proxy_timeout ~ ') is not whole seconds 1..600']
                if proxy_timeout | string is not match('^[0-9]+$') or proxy_timeout | int < 1
                   or proxy_timeout | int > 600 else [])
             + (['fastrdp_mfa_web_approval_timeout (' ~ approval_timeout ~ ' s) + ' ~ session_start
                 ~ ' s session start exceeds fastrdp_proxy_broker_timeout (' ~ proxy_timeout ~ ' s)']
                if approval_timeout | int + session_start | int > proxy_timeout | int else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'MFA web approval',
             'status': 'FAIL' if problems else 'PASS',
             'detail': problems | join('; ') if problems else 'RDP logins wait up to ' ~ approval_timeout
                       ~ ' s for approval on /web/approve (proxy waits ' ~ proxy_timeout ~ ' s, '
                       ~ session_start ~ ' s of it for the session start)',
             'fix': 'fastrdp_web_enabled: true; fastrdp_proxy_broker_timeout at least fastrdp_mfa_web_approval_timeout + '
                    ~ session_start ~ ' (the session start after the approval), at most 600 (docs/auth-matrix.md#web-approval)'}] }}
      when: preflight_mfa_mode in ['web', 'push_or_web', 'code_or_web']

    - name: Probe the OIDC issuer from the host
      ansible.builtin.uri:
        url: "{{ preflight_web_issuer }}/.well-known/openid-configuration"
        method: GET
        validate_certs: "{{ preflight_web_ca_src | length == 0 }}"
        return_content: true
        timeout: 10
      register: preflight_oidc
      failed_when: false
      when: preflight_web_enabled

    - name: Result - web access (Keycloak/OIDC)
      vars:
        issuer: "{{ (preflight_oidc.json | default({})).issuer | default('') }}"
        problems: >-
          {{ (['discovery answered ' ~ (preflight_oidc.status | default(-1)) ~ ' ' ~ (preflight_oidc.msg | default('') | truncate(80))]
              if preflight_oidc.status | default(-1) != 200 else [])
             + (['issuer in discovery is ' ~ issuer ~ ', expected ' ~ preflight_web_issuer]
                if preflight_oidc.status | default(-1) == 200 and issuer != preflight_web_issuer else [])
             + (['OIDC client secret empty (vault_fastrdp_web_oidc_client_secret; vault loaded?)'] if not preflight_web_secret else [])
             + (['CA file ' ~ preflight_web_ca_src ~ ' not found on the admin machine']
                if preflight_web_ca_src and preflight_web_ca_src is not file else []) }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'web / OIDC',
             'status': 'FAIL' if problems else 'PASS',
             'detail': problems | join('; ') if problems else preflight_web_issuer ~ ' discovery ok',
             'fix': 'fastrdp_web_oidc_issuer must be the realm URL exactly as Keycloak reports it; see docs/web-access.md'}] }}
      when: preflight_web_enabled

    # The webgate accepts only ID tokens with acr in fastrdp_web_required_acr (mfa). Keycloak
    # issues acr=mfa only with a level-2 step for it; the client's ACR map alone gives acr 1.
    # Without admin credentials only the discovery document can be read: its
    # acr_values_supported lists the realm-level ACR map and the LoA levels of the realm's
    # browser flow (["0", "1"] without step-up conditions; Keycloak 26, OIDCWellKnownProvider).
    # The client's ACR map and a client policy forcing a flow (recipe A) do not appear there.
    - name: Result - Keycloak MFA for acr=mfa
      vars:
        advertised: "{{ (preflight_oidc.json | default({})).acr_values_supported | default([]) | map('string') | list }}"
        step_up: >-
          {{ advertised | select('in', preflight_web_required_acr | map('string') | list) | list
             + advertised | select('match', '^[0-9]+$') | map('int') | select('ge', 2) | map('string') | list }}
        refused: "every web sign-in{{ ' and every RDP login approval' if preflight_mfa_mode in ['web', 'push_or_web', 'code_or_web'] else '' }}"
        admin_login: >-
          {{ preflight_keycloak_admin_secret | length > 0
             or (preflight_keycloak_admin_user | length > 0 and preflight_keycloak_admin_password | length > 0) }}
        status: >-
          {{ 'INFO' if preflight_web_required_acr | length == 0
             else ('FAIL' if not admin_login else 'PASS') if preflight_web_passkeys
             else 'PASS' if step_up | length > 0 else 'WARN' }}
        detail: >-
          {{ 'fastrdp_web_required_acr is empty: the webgate checks amr (fastrdp_web_required_amr_any) instead'
             if preflight_web_required_acr | length == 0
             else ('fastrdp_web_passkeys needs Keycloak admin credentials (vault loaded?)' if not admin_login
                   else 'fastrdp_web_passkeys: the deployment configures the MFA flow for acr='
                        ~ preflight_web_required_acr | join(',') ~ ' (users need a passkey or second factor registered)')
             if preflight_web_passkeys
             else 'Keycloak advertises step-up (acr_values_supported: ' ~ advertised | join(', ')
                  ~ "); the client's ACR map (mfa -> 2) is not visible here" if step_up | length > 0
             else 'cannot read acr_values_supported (discovery failed): make sure Keycloak enforces MFA for acr='
                  ~ preflight_web_required_acr | join(',') ~ ', otherwise ' ~ refused ~ ' is refused'
             if preflight_oidc.status | default(-1) != 200
             else 'fastrdp_web_passkeys is false and Keycloak advertises acr_values_supported ['
                  ~ advertised | join(', ') ~ "] only (no level-2 step in the realm's browser flow; a client policy "
                  ~ 'is not visible here): make sure Keycloak enforces MFA for acr=' ~ preflight_web_required_acr | join(',')
                  ~ ', otherwise ' ~ refused ~ " is refused (log: acr '1' does not prove MFA)" }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'Keycloak MFA for acr=mfa', 'status': status, 'detail': detail,
             'fix': 'fastrdp_web_passkeys: true with Keycloak admin credentials (vault_fastrdp_keycloak_admin_client_secret, '
                    ~ 'or fastrdp_keycloak_admin_user + vault_fastrdp_keycloak_admin_password), or a level-2 (MFA) step '
                    ~ 'for acr=mfa in Keycloak (docs/web-access.md#keycloak-setup)'}] }}
      when: preflight_web_enabled

    # ------------------------------------------------------------------ KDC proxy
    # fastrdp_web_kdcproxy: the web gateway forwards MS-KKDCP requests to the realm's KDCs
    # over TCP, from this host: the packages must be installable and the KDCs reachable.
    - name: Look at the KDC proxy packages and probe the KDCs from the host
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          cand() { apt-cache policy "$1" 2>/dev/null | awk '$1 == "Candidate:" { print $2; exit }'; }
          for p in python3-kdcproxy gunicorn; do
              c=$(cand "$p")
              if [ -z "$c" ] || [ "$c" = "(none)" ]; then
                  echo "FAIL $p not available from the configured APT sources (Ubuntu: universe)"
              fi
          done
          lookup() {
              if command -v dig >/dev/null 2>&1; then dig +short +time=3 +tries=1 SRV "$1"
              elif command -v host >/dev/null 2>&1; then host -W 3 -t SRV "$1"
              elif command -v resolvectl >/dev/null 2>&1; then resolvectl query --legend=no -t SRV "$1" 2>/dev/null
              elif command -v nslookup >/dev/null 2>&1; then nslookup -type=SRV "$1"
              else echo NOTOOL; fi
          }
          # "<prio> <weight> <port> <target>" in the output of every tool -> host:port
          srv() {
              local out
              out=$(lookup "$1")
              if [ "$out" = NOTOOL ]; then echo NOTOOL; return; fi
              grep -oE '[0-9]+ [0-9]+ [0-9]+ [A-Za-z0-9._-]+' <<<"$out" | head -n 10 \
                  | while read -r _ _ port target; do echo "${target%.}:$port"; done
          }
          probe() {
              local host=${1%:*} port=${1##*:}
              timeout 3 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null
          }
          kdcs=() kp=()
          if [ -n "$KDCS" ]; then
              for k in $KDCS; do
                  case $k in *:*) ;; *) k=$k:88 ;; esac
                  kdcs+=("$k") kp+=("${k%:*}:464")
              done
          else
              mapfile -t kdcs < <(srv "_kerberos._tcp.$REALM")
              mapfile -t kp < <(srv "_kpasswd._tcp.$REALM")
              if [ "${kdcs[*]}" = NOTOOL ]; then
                  echo "WARN no SRV lookup tool (dig/host/resolvectl/nslookup) on the host: KDCs not probed"
                  kdcs=() kp=()
              elif [ ${#kdcs[@]} -eq 0 ]; then
                  echo "FAIL no _kerberos._tcp.$REALM SRV records on the host: set fastrdp_web_kdcproxy_kdcs"
              elif [ ${#kp[@]} -eq 0 ]; then
                  for k in "${kdcs[@]}"; do kp+=("${k%:*}:464"); done
              fi
          fi
          open=0
          for k in "${kdcs[@]}"; do
              if probe "$k"; then open=$((open + 1)); echo "INFO KDC $k"; else echo "WARN KDC $k not reachable on TCP"; fi
          done
          [ ${#kdcs[@]} -gt 0 ] && [ "$open" -eq 0 ] && echo "FAIL none of the KDCs is reachable on TCP from the host"
          if [ "$KPASSWD" = true ]; then
              for k in "${kp[@]}"; do
                  probe "$k" || echo "WARN kpasswd $k not reachable on TCP (password changes through the proxy)"
              done
          fi
          exit 0
      environment:
        REALM: "{{ preflight_realm | lower }}"
        KDCS: "{{ preflight_kdcproxy_kdcs | map('string') | join(' ') }}"
        KPASSWD: "{{ preflight_kdcproxy_kpasswd | string | lower }}"
      register: preflight_kdcproxy_probe
      changed_when: false
      failed_when: false
      when: preflight_kdcproxy and preflight_web_enabled and preflight_realm | length > 0

    - name: Result - KDC proxy
      vars:
        out: "{{ preflight_kdcproxy_probe.stdout_lines | default([]) }}"
        errs: >-
          {{ (['fastrdp_web_kdcproxy needs fastrdp_web_enabled: true (it runs behind the web gateway)'] if not preflight_web_enabled else [])
             + (['fastrdp_realm not set'] if not preflight_realm else [])
             + (out | select('match', '^FAIL ') | map('regex_replace', '^FAIL ', '') | list) }}
        warns: "{{ out | select('match', '^WARN ') | map('regex_replace', '^WARN ', '') | list }}"
        infos: "{{ out | select('match', '^INFO ') | map('regex_replace', '^INFO ', '') | list }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'KDC proxy',
             'status': 'FAIL' if errs else ('WARN' if warns else 'PASS'),
             'detail': ((errs + warns) if (errs + warns) else infos) | join('; ')
                       or 'not checked: ' ~ (preflight_kdcproxy_probe.stderr | default('no output') | truncate(120)),
             'fix': 'open TCP 88 (and 464 for kpasswd) from this host to the KDCs, or list them in fastrdp_web_kdcproxy_kdcs; '
                    ~ 'Ubuntu needs universe for python3-kdcproxy and gunicorn; docs/web-access.md#kdc-proxy'}] }}
      when: preflight_kdcproxy

    # ------------------------------------------------------------------ KDC-enforced NLA MFA
    # fastrdp_mfa_nla_kdc_enforced: the broker skips privacyIDEA for Kerberos NLA logins, so
    # TERMSRV/<fqdn> must carry FreeIPA authentication indicators (passkey/pkinit). Read
    # with the join account into a throw-away ccache; needs an enrolled host (ipa CLI).
    - name: Read the TERMSRV authentication indicators (FreeIPA)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          if ! command -v ipa >/dev/null 2>&1 || [ ! -r /etc/ipa/default.conf ]; then echo NOTENROLLED; exit 0; fi
          if [ -z "$JOIN_PW" ]; then echo NOPASSWORD; exit 0; fi
          dir=$(mktemp -d)
          export KRB5CCNAME="FILE:$dir/cc"
          trap 'kdestroy -q 2>/dev/null; rm -rf "$dir"' EXIT
          if ! echo "$JOIN_PW" | kinit "$JOIN_USER" >/dev/null 2>&1; then echo NOKINIT; exit 0; fi
          if ! out=$(ipa service-show "TERMSRV/$FQDN" --raw 2>/dev/null); then echo NOSERVICE; exit 0; fi
          awk 'tolower($1) == "krbprincipalauthind:" {print "IND " tolower($2)}' <<<"$out"
          echo DONE
      environment:
        JOIN_USER: "{{ fastrdp_join_user | default(preflight_role_defaults.fastrdp_join_user) }}"
        JOIN_PW: "{{ fastrdp_join_password | default(vault_fastrdp_join_password | default('')) }}"
        FQDN: "{{ preflight_fqdn }}"
      register: preflight_authind
      changed_when: false
      failed_when: false
      no_log: true
      when: preflight_kdc_enforced and preflight_idp == 'ipa'

    - name: Result - KDC-enforced MFA for NLA
      vars:
        out: "{{ preflight_authind.stdout_lines | default([]) }}"
        have: "{{ out | select('match', '^IND ') | map('regex_replace', '^IND ', '') | list }}"
        allowed: "{{ fastrdp_mfa_nla_kdc_auth_indicators | default(preflight_role_defaults.fastrdp_mfa_nla_kdc_auth_indicators) }}"
        by_ad_policy: "{{ fastrdp_mfa_nla_kdc_enforced_by_ad_policy | default(preflight_role_defaults.fastrdp_mfa_nla_kdc_enforced_by_ad_policy) | bool }}"
        set_by_role: "{{ fastrdp_mfa_nla_kdc_set_auth_ind | default(preflight_role_defaults.fastrdp_mfa_nla_kdc_set_auth_ind) | bool }}"
        state: >-
          {{ 'AD' if preflight_idp == 'ad' else ('NONE' if preflight_idp != 'ipa'
             else (out | select('match', '^(NOTENROLLED|NOPASSWORD|NOKINIT|NOSERVICE)$') | first | default('DONE'))) }}
        problems: >-
          {{ (['AD has no authentication indicators; set fastrdp_mfa_nla_kdc_enforced_by_ad_policy only if an AD policy '
               ~ 'guarantees strong logon for every account that may log in'] if state == 'AD' and not by_ad_policy else [])
             + (['TERMSRV/' ~ preflight_fqdn ~ ' has no authentication indicators: any password TGT gets a ticket'
                 ~ (' (the identity role sets them)' if set_by_role else '')] if state == 'DONE' and not have else [])
             + (['TERMSRV/' ~ preflight_fqdn ~ ' also accepts ' ~ have | difference(allowed) | join(', ')
                 ~ ' (not in fastrdp_mfa_nla_kdc_auth_indicators)'] if state == 'DONE' and have | difference(allowed) else []) }}
        warnings: >-
          {{ (['host not enrolled in FreeIPA yet: the identity role sets and checks the indicators at deploy']
              if state == 'NOTENROLLED' else [])
             + (['no join password (vault loaded?): indicators not read'] if state == 'NOPASSWORD' else [])
             + (['kinit as the join account failed: indicators not read'] if state == 'NOKINIT' else [])
             + (['TERMSRV/' ~ preflight_fqdn ~ ' does not exist yet: the identity role creates it'] if state == 'NOSERVICE' else [])
             + (['AD: not verifiable here; you assert an AD policy enforces strong logon'] if state == 'AD' and by_ad_policy else [])
             + (['provider none: not verifiable here; your KDC must require passkey/PKINIT for TERMSRV '
                 ~ '(MIT: kadmin set_string TERMSRV/' ~ preflight_fqdn ~ ' require_auth "pkinit")'] if state == 'NONE' else []) }}
        fixable: "{{ set_by_role and fastrdp_join_password | default(vault_fastrdp_join_password | default('')) | length > 0 }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'KDC-enforced NLA MFA',
             'status': ('WARN' if fixable and state == 'DONE' else 'FAIL') if problems else ('WARN' if warnings else 'PASS'),
             'detail': (problems + warnings) | join('; ') if (problems + warnings)
                       else 'TERMSRV/' ~ preflight_fqdn ~ ' requires ' ~ have | join(' or '),
             'fix': 'ipa service-mod TERMSRV/' ~ preflight_fqdn ~ ' '
                    ~ allowed | map('regex_replace', '^', '--auth-ind=') | join(' ')
                    ~ ' (or let the identity role do it), or set fastrdp_mfa_nla_kdc_enforced: false; docs/passkeys.md'}] }}
      when: preflight_kdc_enforced

    # ------------------------------------------------------------------ KDC evidence as MFA
    # fastrdp_mfa_kdc_evidence_as_mfa: the proxy's FreeRDP must pass the ticket's evidence on
    # (fastrdp-freerdp3 >= 3.32.2-4, patch 0005), and which SIDs appear depends on the DC
    # software. Read-only: dpkg/apt-cache, and an anonymous LDAP rootDSE read (vendorName:
    # Samba says so, Microsoft AD has none) when ldapsearch is installed.
    - name: Read the FreeRDP version and the DC software (KDC evidence)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          if [ "$METHOD" = apt ]; then
              # shellcheck disable=SC2016
              inst=$(dpkg-query -W -f='${Status} ${Version}\n' fastrdp-freerdp3 2>/dev/null | awk '$3 == "installed" { print $4 }')
              cand=$(apt-cache policy fastrdp-freerdp3 2>/dev/null | awk '$1 == "Candidate:" { print $2; exit }')
              [ "$cand" = "(none)" ] && cand=
              new_enough() { [ -n "$1" ] && dpkg --compare-versions "$1" ge "$MIN"; }
              if new_enough "$inst"; then
                  echo "PASS fastrdp-freerdp3 $inst installed"
              elif new_enough "$cand"; then
                  echo "PASS fastrdp-freerdp3 $cand available (installed: ${inst:-none}), deploy installs it"
              elif [ -n "$inst$cand" ]; then
                  echo "FAIL fastrdp-freerdp3 installed ${inst:-none}, available ${cand:-none}: older than $MIN" \
                       "(patch 0005), the KDC evidence never reaches the broker"
              else
                  echo "WARN fastrdp-freerdp3 neither installed nor in the host's APT sources yet:" \
                       "deploy must install $MIN or newer from the fastrdp repository"
              fi
          fi
          if [ "$IDP" = ad ] && [ -n "$DOMAIN" ]; then
              if ! command -v ldapsearch >/dev/null 2>&1; then
                  echo "DC unknown"
              elif ! out=$(timeout 6 ldapsearch -x -LLL -H "ldap://$DOMAIN" -o nettimeout=3 -l 3 -s base -b "" vendorName 2>/dev/null) \
                      || ! grep -q '^dn:' <<<"$out"; then
                  echo "DC unknown"
              elif grep -qi '^vendorName:.*samba' <<<"$out"; then
                  echo "DC samba"
              else
                  echo "DC windows"
              fi
          fi
          exit 0
      environment:
        METHOD: "{{ preflight_install_method }}"
        MIN: "{{ preflight_kdc_evidence_min_freerdp }}"
        IDP: "{{ preflight_idp }}"
        DOMAIN: "{{ preflight_domain }}"
      register: preflight_kdc_evidence_probe
      changed_when: false
      failed_when: false
      when: preflight_kdc_evidence | length > 0

    - name: Result - MFA from KDC evidence
      vars:
        out: "{{ preflight_kdc_evidence_probe.stdout_lines | default([]) }}"
        is_list: "{{ preflight_kdc_evidence is sequence and preflight_kdc_evidence is not string }}"
        items: "{{ preflight_kdc_evidence | map('string') | list if is_list else [] }}"
        # same item syntax and refusals as roles/common (and the broker's config.py)
        malformed: >-
          {{ items | reject('match', '^(ind:[!-~]{1,64}|sid:S-1-[0-9]{1,15}(-[0-9]{1,10}){1,15})\Z') | list }}
        refused: >-
          {{ items | select('match', '^(ind:hardened|sid:S-1-18-[12]|sid:S-1-1-0|sid:S-1-5-11|sid:S-1-5-32-545|sid:S-1-5-21-.*-513)\Z') | list }}
        indicators: "{{ items | select('match', '^ind:') | list }}"
        fresh: "{{ 'sid:S-1-18-3' in items }}"
        dc: "{{ out | select('match', '^DC ') | map('regex_replace', '^DC ', '') | first | default('unknown') }}"
        series: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../patches/freerdp/series', errors='ignore') | default('', true) }}"
        problems: >-
          {{ ([] if is_list else ['fastrdp_mfa_kdc_evidence_as_mfa must be a list'])
             + (['malformed: ' ~ malformed | join(', ') ~ ' (ind:<indicator> or sid:S-1-...)'] if malformed else [])
             + (['in the tickets of password logons too, no second factor: ' ~ refused | join(', ')] if refused else [])
             + (['fastrdp_realm is empty: the broker needs [auth] realms for KDC evidence'] if not preflight_realm else [])
             + (out | select('match', '^FAIL ') | map('regex_replace', '^FAIL ', '') | list)
             + (['patches/freerdp/series of this checkout has no 0005 (KDC evidence): the built FreeRDP never passes it on']
                if preflight_install_method == 'build' and series is not search('(?m)^0005-') else []) }}
        warnings: >-
          {{ (out | select('match', '^WARN ') | map('regex_replace', '^WARN ', '') | list)
             + (['fastrdp_mfa_mode is none: the evidence has no effect'] if preflight_mfa_mode == 'none' else [])
             + (['fastrdp_mfa_nla_kdc_enforced is on: it decides first, the evidence decides nothing'] if preflight_kdc_enforced else [])
             + (['AD KDCs issue no authentication indicators: ' ~ indicators | join(', ') ~ ' never match']
                if preflight_idp == 'ad' and indicators else [])
             + (['Samba AD DC: only sid:S-1-18-3 can appear (no S-1-18-4/-5/-6, no AMA groups), and it is not hardware-bound '
                 ~ '(a certificate in software gets it too)'] if preflight_idp == 'ad' and dc == 'samba' else [])
             + (['Microsoft AD adds sid:S-1-18-3 only with the DC policy "KDC support for PKInit Freshness Extension" '
                 ~ '(off by default), and it is not hardware-bound'] if preflight_idp == 'ad' and dc == 'windows' and fresh else [])
             + (['DC software not detected (needs ldapsearch and an anonymous rootDSE read): Samba AD adds only sid:S-1-18-3, '
                 ~ 'Microsoft AD adds it only with the DC policy "KDC support for PKInit Freshness Extension"; '
                 ~ 'it is not hardware-bound'] if preflight_idp == 'ad' and dc == 'unknown' else []) }}
        version: >-
          {{ (out | select('match', '^PASS ') | map('regex_replace', '^PASS ', '') | first | default(''))
             if preflight_install_method == 'apt' else 'built from this checkout with patches/freerdp/0005' }}
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'MFA from KDC evidence',
             'status': ('FAIL' if problems else ('WARN' if warnings else 'PASS')) if items or not is_list else 'INFO',
             'detail': ((problems + warnings) | join('; ') if (problems + warnings)
                        else 'Kerberos NLA logins with ' ~ items | join(' or ') ~ ' skip the second factor; ' ~ version)
                       if items or not is_list else 'not used (fastrdp_mfa_kdc_evidence_as_mfa empty)',
             'fix': 'fastrdp_mfa_kdc_evidence_as_mfa: items ind:<indicator> (FreeIPA ind:pkinit, ind:passkey) or sid:S-1-... '
                    ~ '(AD sid:S-1-18-4, sid:S-1-18-3, an AMA group); fastrdp-freerdp3 >= ' ~ preflight_kdc_evidence_min_freerdp
                    ~ '; docs/passkeys.md#kdc-evidence-per-login'}] }}

    - name: Probe the APT repository from the host
      ansible.builtin.uri:
        url: "{{ item }}"
        method: GET
        timeout: 10
      loop:
        - "{{ preflight_apt_repo_url }}/dists/{{ preflight_apt_suite }}/InRelease"
        - "{{ preflight_apt_key_url }}"
      register: preflight_apt
      failed_when: false
      when: preflight_install_method == 'apt'

    - name: Result - install method
      vars:
        bad: "{{ preflight_apt.results | default([]) | rejectattr('status', 'defined') | list
                 + (preflight_apt.results | default([]) | selectattr('status', 'defined') | rejectattr('status', 'eq', 200) | list) }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'install method',
             'status': ('FAIL' if bad else 'PASS') if preflight_install_method == 'apt' else 'PASS',
             'detail': ('apt: ' ~ (bad | map(attribute='item') | join(', ') ~ ' not reachable' if bad else 'suite ' ~ preflight_apt_suite ~ ' found'))
                       if preflight_install_method == 'apt' else 'build: FreeRDP and xrdp are compiled on the host (10-20 min first run)',
             'fix': 'the repository may not be published for ' ~ preflight_apt_suite ~ ' yet: use fastrdp_install_method: build, '
                    ~ 'or fastrdp_apt_channel: testing; check HTTPS from the host'}] }}

    - name: Check the RDP certificate on the admin machine
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          cert=$PREFLIGHT_CERT key=$PREFLIGHT_KEY fqdn=$PREFLIGHT_FQDN
          [ -r "$cert" ] || { echo "ERR certificate $cert not readable"; exit 0; }
          [ -r "$key" ] || { echo "ERR key $key not readable"; exit 0; }
          openssl x509 -in "$cert" -noout -checkend 0 >/dev/null || echo "ERR certificate expired"
          openssl x509 -in "$cert" -noout -checkend 2592000 >/dev/null || echo "WARN certificate expires within 30 days"
          san=$(openssl x509 -in "$cert" -noout -ext subjectAltName 2>/dev/null)
          # exact name, or a wildcard for its parent domain
          tr ',' '\n' <<<"$san" | sed 's/^ *//' | grep -qixF -e "DNS:$fqdn" -e "DNS:*.${fqdn#*.}" \
              || echo "ERR certificate has no subjectAltName DNS:$fqdn"
          [ "$(openssl x509 -in "$cert" -noout -pubkey)" = "$(openssl pkey -in "$key" -pubout 2>/dev/null)" ] \
              || echo "ERR key does not match the certificate"
          exit 0
      environment:
        PREFLIGHT_CERT: "{{ preflight_cert_src }}"
        PREFLIGHT_KEY: "{{ preflight_key_src }}"
        PREFLIGHT_FQDN: "{{ preflight_fqdn }}"
      register: preflight_cert
      delegate_to: localhost
      changed_when: false
      when: preflight_cert_src | length > 0

    - name: Result - RDP certificate
      vars:
        out: "{{ preflight_cert.stdout_lines | default([]) }}"
        errs: "{{ out | select('match', '^ERR ') | map('regex_replace', '^ERR ', '') | list }}"
        warns: "{{ out | select('match', '^WARN ') | map('regex_replace', '^WARN ', '') | list }}"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{ preflight_results + [{'check': 'RDP certificate',
             'status': ('FAIL' if errs else ('WARN' if warns else 'PASS')) if preflight_cert_src else 'WARN',
             'detail': ((errs + warns) | join('; ') if (errs + warns) else preflight_cert_src ~ ' valid for ' ~ preflight_fqdn)
                       if preflight_cert_src else 'self-signed certificate will be generated (lab only: clients warn)',
             'fix': 'use a certificate for ' ~ preflight_fqdn ~ ' (full chain) and its key: fastrdp_front_cert_src/fastrdp_front_key_src'}] }}

    # ------------------------------------------------------------------ report
    - name: Format the report
      vars:
        line: >-
          {{ '%-4s  %s: %s' | format(item.status, item.check, item.detail) }}{{ ('  ->  fix: ' ~ item.fix) if item.status in ['WARN', 'FAIL'] else '' }}
      ansible.builtin.set_fact:
        preflight_lines: "{{ preflight_lines | default([]) + [line] }}"
      loop: "{{ preflight_results }}"
      loop_control:
        label: "{{ item.check }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ preflight_lines }}"

    - name: Fail the host when a check failed
      vars:
        failed_checks: "{{ preflight_results | selectattr('status', 'eq', 'FAIL') | map(attribute='check') | list }}"
      ansible.builtin.assert:
        that: failed_checks | length == 0
        fail_msg: "Preflight FAILED: {{ failed_checks | join(', ') }}. Fix them (see the report above), then run preflight again."
        success_msg: "Preflight passed ({{ preflight_results | selectattr('status', 'eq', 'WARN') | list | length }} warnings). Next: site.yml"
        quiet: false
